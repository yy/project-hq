<script>
const TRACK_PALETTE = [
  "#6366f1", "#0891b2", "#ca8a04", "#dc2626", "#059669",
  "#9333ea", "#e11d48", "#2563eb", "#c2410c", "#4f46e5",
  "#475569",
];
const STATUS_COLORS = {
  "my-plate": "#dc2626",
  active: "#f97316",
  waiting: "#2563eb",
  submitted: "#7c3aed",
  done: "#10b981",
  dropped: "#ef4444",
};
const LOAD_STATUSES = new Set(["my-plate", "active"]);
const LOAD_STATUS_ORDER = ["my-plate", "active"];
const ANALYSIS_STATUSES = new Set([...LOAD_STATUS_ORDER, "waiting"]);
const ANALYSIS_STATUS_ORDER = [...LOAD_STATUS_ORDER, "waiting"];
const OUTFLOW_STATUSES = new Set(["submitted", "done", "dropped"]);
const OUTFLOW_STATUS_ORDER = ["submitted", "done", "dropped"];

let statuses = [];
let projects = [];
let tasks = [];
let routines = [];
let tracks = [];
let pulseTracks = [];
let defaultOwner = 'yy';
let owners = [];
let activeTrack = null;
let searchQuery = "";
let trackColorMap = {};
let dragFile = null;
let dragSourceStatus = null;
let taskDrag = null;
let taskDidDrag = false;
let selectedFile = null;
let didDrag = false;
let editMode = false;
let originalBody = '';
let hqDir = '';
let agentState = null;
let metadataEditMode = false;
let nextActionEditMode = false;
let projectBodyReady = false;
let vaultName = '';
let pendingOpenFile = null;
let activeView = 'board';
let timelineData = null;
let timelineLoading = false;
let visibilityTimer = null;
let routineVisibilityTimer = null;
let undoInFlight = false;
let taskScope = "available";
let editingTask = null;
let editingRoutineFile = null;

function assignTrackColors(tracks) {
  const sorted = [...tracks].sort();
  trackColorMap = {};
  sorted.forEach((t, i) => {
    trackColorMap[t] = TRACK_PALETTE[i % TRACK_PALETTE.length];
  });
}

function renderOwnerOptions() {
  const dl = document.getElementById("owner-options");
  if (!dl) return;
  dl.innerHTML = "";
  for (const o of owners) {
    const opt = document.createElement("option");
    opt.value = o;
    dl.appendChild(opt);
  }
}

async function fetchProjects() {
  const res = await fetch("/api/projects");
  const data = await res.json();
  statuses = data.statuses || statuses;
  projects = data.projects || [];
  scheduleVisibilityRefresh();
  tracks = data.tracks || [...new Set(projects.map(p => p.track))];
  pulseTracks = data.pulse_tracks || [];
  if (data.default_owner) defaultOwner = data.default_owner;
  owners = data.owners || [];
  renderOwnerOptions();
  if (data.hq_dir) {
    hqDir = data.hq_dir;
    vaultName = hqDir.split('/').pop();
  }

  const colorTracks = [...new Set([...tracks, ...projects.map(p => p.track)])];
  assignTrackColors(colorTracks);

  if (activeView === "board" || activeView === "timeline") render();
  fetchTimeline();
  refreshUndoState();

  if (pendingOpenFile) {
    const found = projects.find(p => p.file === pendingOpenFile);
    if (found) {
      const file = pendingOpenFile;
      pendingOpenFile = null;
      await openPanel(file);
      enterEditMode();
    }
  }
}

async function fetchRoutines() {
  const res = await fetch("/api/routines");
  if (!res.ok) throw new Error(`Routine load failed (${res.status})`);
  routines = await res.json();
  scheduleRoutineVisibilityRefresh();
  renderRoutineAreas();
  if (activeView === "routines") renderRoutines();
}

async function fetchTasks() {
  const res = await fetch("/api/tasks");
  let data = [];
  try { data = await res.json(); } catch { /* handled below */ }
  if (!res.ok) throw new Error(data.error || `Task load failed (${res.status})`);
  tasks = data;
  if (activeView === "tasks") renderTasks();
}

async function refreshUndoState() {
  const button = document.getElementById("undo-btn");
  try {
    const res = await fetch("/api/undo");
    if (!res.ok) throw new Error(`Undo status failed (${res.status})`);
    const status = await res.json();
    button.disabled = undoInFlight || !status.available;
    button.title = status.available && status.label
      ? `Undo ${status.label} (⌘Z)`
      : "Nothing to undo";
  } catch {
    button.disabled = true;
    button.title = "Undo unavailable";
  }
}

function discardAgentState() {
  resetAgentSessionState();
  ensureAgentSession();
}

async function undoLastAction() {
  if (undoInFlight) return;
  const button = document.getElementById("undo-btn");
  if (button.disabled) return;

  const openFile = selectedFile;
  undoInFlight = true;
  button.disabled = true;

  try {
    const res = await fetch("/api/undo", { method: "POST" });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Undo failed (${res.status})`);

    const affected = new Set(data.files || []);
    if (affected.size) discardAgentState();
    await Promise.all([fetchProjects(), fetchTasks(), fetchRoutines()]);

    if (openFile && affected.has(openFile)) {
      if (projects.some(project => project.file === openFile)) {
        await openPanel(openFile);
      } else {
        closePanel();
      }
    }
    toast(`Undid ${data.label || "last action"}`);
  } catch (error) {
    toast("Error: " + error.message);
  } finally {
    undoInFlight = false;
    refreshUndoState();
  }
}

function renderFilters() {
  const bar = document.getElementById("track-filters");
  bar.innerHTML = "";

  // Use the config-defined track order (from data.tracks); append any
  // project tracks not listed there so nothing silently disappears.
  const configTracks = tracks || [];
  const extras = [...new Set(projects.map(p => p.track))].filter(t => !configTracks.includes(t)).sort();
  const orderedTracks = [...configTracks, ...extras];

  const allBtn = document.createElement("button");
  allBtn.className = "track-filter" + (activeTrack === null ? " active" : "");
  const allCount = projects.filter(isOpenProject).length;
  allBtn.innerHTML = `All<span class="filter-count">${allCount}</span>`;
  allBtn.addEventListener("click", () => { activeTrack = null; render(); renderMiniTimeline(); });
  bar.appendChild(allBtn);

  for (const track of orderedTracks) {
    const btn = document.createElement("button");
    btn.className = "track-filter" + (activeTrack === track ? " active" : "");
    const color = trackColorMap[track] || "#999";
    const count = projects.filter(p => p.track === track && isOpenProject(p)).length;
    btn.innerHTML = `<span class="filter-dot" style="background:${color}"></span>${esc(track)}<span class="filter-count">${count}</span>`;
    btn.addEventListener("click", () => { activeTrack = track; render(); renderMiniTimeline(); });
    bar.appendChild(btn);
  }
}

async function fetchTimeline() {
  if (timelineLoading) return;
  timelineLoading = true;
  try {
    const res = await fetch("/api/timeline");
    timelineData = await res.json();
    renderTimeline();
    renderMiniTimeline();
  } catch {
    document.getElementById("timeline-note").textContent = "Could not load project history.";
  } finally {
    timelineLoading = false;
  }
}

function setView(view) {
  activeView = view;
  document.getElementById("board").classList.toggle("hidden", view !== "board");
  document.getElementById("tasks-view").classList.toggle("hidden", view !== "tasks");
  document.getElementById("timeline-view").classList.toggle("hidden", view !== "timeline");
  document.getElementById("routines-view").classList.toggle("hidden", view !== "routines");
  document.getElementById("board-view-btn").classList.toggle("active", view === "board");
  document.getElementById("task-view-btn").classList.toggle("active", view === "tasks");
  document.getElementById("timeline-view-btn").classList.toggle("active", view === "timeline");
  document.getElementById("routine-view-btn").classList.toggle("active", view === "routines");
  document.getElementById("search-input").placeholder = view === "tasks"
    ? "Search tasks ( / )"
    : view === "routines"
      ? "Search routines ( / )"
      : "Search projects ( / )";
  if (selectedFile) closePanel();
  else if (view === "tasks") renderTasks();
  else if (view === "routines") renderRoutines();
  else render();
  if (view === "board") void fetchProjects();
  else if (view === "tasks") void fetchTasks();
  else if (view === "routines") void fetchRoutines();
  else if (view === "timeline") void fetchTimeline();
}

function visibleTimelineSnapshots() {
  return (timelineData?.snapshots || [])
    .map(snapshot => ({
      ...snapshot,
      projects: (snapshot.projects || [])
        .filter(project => ANALYSIS_STATUSES.has(project.status))
        .filter(project => !activeTrack || project.track === activeTrack),
      outflow: (snapshot.outflow || [])
        .filter(item => OUTFLOW_STATUSES.has(item.status))
        .filter(item => !activeTrack || item.track === activeTrack),
      pipeline: (snapshot.pipeline || [])
        .filter(item => !activeTrack || item.track === activeTrack),
    }));
}

function timelineHasData(snapshots) {
  return snapshots.some(snapshot => snapshot.projects.length > 0
    || outflowTotal(snapshot.outflow) > 0
    || pipelineTotal(snapshot.pipeline) > 0);
}

function renderTimeline() {
  const chart = document.getElementById("timeline-chart");
  const yAxis = document.getElementById("timeline-y-axis");
  const axis = document.getElementById("timeline-axis");
  const note = document.getElementById("timeline-note");
  const legend = document.getElementById("timeline-legend");
  const analysisPulses = document.getElementById("analysis-pulses");
  chart.innerHTML = "";
  yAxis.innerHTML = "";
  axis.innerHTML = "";
  axis.style.minWidth = "";
  legend.innerHTML = "";
  if (analysisPulses) analysisPulses.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();

  if (!timelineHasData(snapshots)) {
    note.textContent = activeTrack ? `No history for ${activeTrack}.` : "No project history yet.";
    return;
  }

  const maxProjects = Math.max(...snapshots.map(snapshot => snapshot.projects.length));
  const maxOutflow = Math.max(0, ...snapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const source = timelineData?.source === "git_history" ? "Git history" : "current snapshot";
  const scope = activeTrack ? `${activeTrack}, ` : "";
  const cellHeight = timelineCellHeight(maxProjects);
  const cellGap = maxProjects > 150 ? 0 : 1;
  const outflowCellHeight = timelineOutflowCellHeight(maxOutflow);
  chart.style.setProperty("--timeline-cell-height", `${cellHeight}px`);
  chart.style.setProperty("--timeline-gap", `${cellGap}px`);
  chart.style.setProperty("--timeline-outflow-cell-height", `${outflowCellHeight}px`);
  axis.style.minWidth = `${timelineAxisMinWidth(snapshots.length)}px`;
  renderTimelineYAxis(yAxis, maxProjects, maxOutflow);
  renderTimelineAxis(axis, snapshots);
  note.textContent = `${scope}${snapshots.length} daily columns from ${source}; tallest column is ${maxProjects} load + waiting projects; largest outflow day is ${maxOutflow}.`;

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "timeline-column";
    const totalOutflow = outflowTotal(snapshot.outflow);
    column.title = `${snapshot.date}: ${loadCount(snapshot)} load, ${waitingCount(snapshot)} waiting, ${totalOutflow} out`;

    const loadStack = document.createElement("div");
    loadStack.className = "timeline-load-stack";

    for (const project of sortTimelineProjects(snapshot.projects)) {
      const cell = document.createElement("div");
      cell.className = "timeline-cell";
      cell.style.background = timelineColor(project.status, project.age_days);
      cell.title = `${snapshot.date}\n${project.status} · ${project.track}\n${project.title}${project.age_days !== null && project.age_days !== undefined ? `\n${project.age_days} days old` : ""}`;
      loadStack.appendChild(cell);
    }

    const zeroLine = document.createElement("div");
    zeroLine.className = "timeline-zero-line";

    const outflowStack = document.createElement("div");
    outflowStack.className = "timeline-outflow-stack";
    for (const item of sortOutflow(snapshot.outflow)) {
      for (let i = 0; i < item.count; i++) {
        const cell = document.createElement("div");
        cell.className = "timeline-outflow-cell";
        cell.style.background = STATUS_COLORS[item.status] || "#6b7280";
        cell.title = `${snapshot.date}\n${item.status} · ${item.track}`;
        outflowStack.appendChild(cell);
      }
    }

    column.appendChild(loadStack);
    column.appendChild(zeroLine);
    column.appendChild(outflowStack);

    chart.appendChild(column);
  }

  for (const status of ANALYSIS_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)}`;
    legend.appendChild(item);
  }
  for (const status of OUTFLOW_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)} out`;
    legend.appendChild(item);
  }
  renderAnalysisPulses(snapshots);
}

function renderMiniTimeline() {
  const mini = document.getElementById("mini-timeline");
  if (!mini) return;
  mini.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();
  if (!timelineHasData(snapshots)) {
    mini.innerHTML = `<div class="mini-timeline-empty">No timeline yet</div>`;
    return;
  }

  const miniSnapshots = miniTimelineSnapshots(snapshots);
  const maxLoad = Math.max(1, ...miniSnapshots.map(loadCount));
  const waiting = waitingCountsForSnapshots(miniSnapshots);
  const maxWaiting = Math.max(1, ...waiting.map(item => item.count));
  const intake = intakeCountsForSnapshots(snapshots, miniSnapshots);
  const pipelines = pipelineSeriesForSnapshots(miniSnapshots);
  const pulseScale = Math.max(1, Math.round(maxLoad * 0.25));
  const pipelineScale = pipelineSeriesScale(pipelines);
  mini.appendChild(renderMiniPulseGroup("load", renderPulse(miniSnapshots, maxLoad, "load", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("waiting", renderPulse(waiting, maxWaiting, "waiting", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("out", renderPulse(miniSnapshots, pulseScale, "outflow", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("new", renderPulse(intake, pulseScale, "intake", "mini-pulse", 24)));
  for (const { track, series } of pipelines) {
    mini.appendChild(renderMiniPulseGroup(track, renderPulse(series, pipelineScale, pipelineKind(track), "mini-pulse", 24)));
  }
}

// Configured pulse tracks (hq.toml `pulse_tracks`) that exist in the data.
function activePulseTracks() {
  const known = new Set([...(tracks || []), ...projects.map(p => p.track)]);
  return (pulseTracks || []).filter(track => known.has(track));
}

function pipelineSeriesForSnapshots(snapshots) {
  return activePulseTracks().map(track => ({
    track,
    series: pipelineCountsForSnapshots(snapshots, track),
  }));
}

function pipelineSeriesScale(pipelines) {
  return Math.max(1, ...pipelines.flatMap(pipeline => pipeline.series.map(item => item.count)));
}

function pipelineKind(track) {
  return `pipeline:${track}`;
}

function pipelineKindTrack(kind) {
  return kind.startsWith("pipeline:") ? kind.slice("pipeline:".length) : null;
}

function renderMiniPulseGroup(label, pulse) {
  const group = document.createElement("div");
  group.className = "mini-pulse-group";
  const labelEl = document.createElement("div");
  labelEl.className = "mini-pulse-label";
  labelEl.textContent = label;
  group.appendChild(labelEl);
  group.appendChild(pulse);
  return group;
}

function renderAnalysisPulses(snapshots) {
  const container = document.getElementById("analysis-pulses");
  if (!container) return;
  container.innerHTML = "";

  // Match the header pulses exactly: both summarize the same recent snapshots.
  const pulseSnapshots = miniTimelineSnapshots(snapshots);
  const maxLoad = Math.max(1, ...pulseSnapshots.map(loadCount));
  const waiting = waitingCountsForSnapshots(pulseSnapshots);
  const maxWaiting = Math.max(1, ...waiting.map(item => item.count));
  const intake = intakeCountsForSnapshots(snapshots, pulseSnapshots);
  const pipelines = pipelineSeriesForSnapshots(pulseSnapshots);
  const outflowScale = Math.max(1, ...pulseSnapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const eventScale = Math.max(
    outflowScale,
    1,
    ...intake.map(item => item.count)
  );
  const pipelineScale = pipelineSeriesScale(pipelines);

  const pulseDefs = [
    ["Load", miniPulseTitle("load"), pulseSnapshots, maxLoad, "load"],
    ["Waiting", miniPulseTitle("waiting"), waiting, maxWaiting, "waiting"],
    ["Out", miniPulseTitle("outflow"), pulseSnapshots, eventScale, "outflow"],
    ["New", miniPulseTitle("intake"), intake, eventScale, "intake"],
    ...pipelines.map(({ track, series }) => {
      const kind = pipelineKind(track);
      return [`${track[0].toUpperCase()}${track.slice(1)} submitted`, miniPulseTitle(kind), series, pipelineScale, kind];
    }),
  ];

  for (const [label, title, series, scale, kind] of pulseDefs) {
    container.appendChild(renderAnalysisPulseCard(label, title, series, scale, kind, pulseSnapshots));
  }
}

function renderAnalysisPulseCard(label, title, series, scale, kind, axisSnapshots) {
  const card = document.createElement("div");
  card.className = "analysis-pulse-card";
  card.title = title;

  const labelEl = document.createElement("div");
  labelEl.className = "analysis-pulse-label";
  labelEl.textContent = label;

  const body = document.createElement("div");
  body.className = "analysis-pulse-body";
  const yAxis = document.createElement("div");
  yAxis.className = "analysis-pulse-y-axis";
  yAxis.innerHTML = `<span>${esc(formatAxisNumber(scale))}</span><span>${scale > 1 ? esc(formatAxisNumber(Math.round(scale / 2))) : ""}</span><span>0</span>`;

  const pulse = renderPulse(series, scale, kind, "analysis-pulse", 90);
  const xAxis = document.createElement("div");
  xAxis.className = "analysis-pulse-x-axis";
  const firstDate = axisSnapshots[0]?.date || "";
  const lastDate = axisSnapshots[axisSnapshots.length - 1]?.date || "";
  const spanDays = analysisSpanDays(axisSnapshots);
  xAxis.innerHTML = `<span>${esc(formatTimelineAxisDate(firstDate, spanDays))}</span><span>${firstDate === lastDate ? "" : esc(formatTimelineAxisDate(lastDate, spanDays))}</span>`;

  body.appendChild(yAxis);
  body.appendChild(pulse);
  body.appendChild(xAxis);
  card.appendChild(labelEl);
  card.appendChild(body);
  return card;
}

function renderPulse(snapshots, maxCount, kind, className, maxHeight) {
  const pulse = document.createElement("div");
  pulse.className = className;
  pulse.title = miniPulseTitle(kind);

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "mini-column";
    const count = miniPulseCount(snapshot, kind);
    column.title = `${snapshot.date}: ${count} ${miniPulseUnit(kind)}`;

    const stack = document.createElement("div");
    stack.className = "mini-stack";
    const height = count === 0 ? 0 : Math.max(1, Math.round((count / maxCount) * maxHeight));
    stack.style.height = `${height}px`;
    stack.style.setProperty("--mini-dot-height", `${miniDotHeight(count, height)}px`);

    if (kind === "load") {
      for (const status of LOAD_STATUS_ORDER) {
        const statusCount = snapshot.projects.filter(project => project.status === status).length;
        if (statusCount === 0) continue;
        const segment = document.createElement("div");
        segment.className = "mini-segment";
        segment.style.background = STATUS_COLORS[status] || "#6b7280";
        segment.style.setProperty("--mini-segment-height", `${miniSegmentHeight(statusCount, count, height)}px`);
        stack.appendChild(segment);
      }
    } else if (kind === "outflow") {
      for (const item of sortOutflow(snapshot.outflow)) {
        for (let i = 0; i < item.count; i++) {
          const dot = document.createElement("div");
          dot.className = "mini-dot";
          dot.style.background = STATUS_COLORS[item.status] || "#6b7280";
          stack.appendChild(dot);
        }
      }
    } else {
      for (let i = 0; i < snapshot.count; i++) {
        const dot = document.createElement("div");
        dot.className = "mini-dot";
        dot.style.background = miniPulseColor(kind);
        stack.appendChild(dot);
      }
    }

    column.appendChild(stack);
    pulse.appendChild(column);
  }

  return pulse;
}

function miniPulseTitle(kind) {
  if (kind === "load") return "Load over time";
  if (kind === "waiting") return "Waiting projects over time";
  if (kind === "outflow") return "Submitted/done/dropped over time";
  if (kind === "intake") return "New projects over time";
  const track = pipelineKindTrack(kind);
  return track ? `Submitted ${track} projects over time` : "Projects over time";
}

function miniPulseCount(snapshot, kind) {
  if (kind === "load") return loadCount(snapshot);
  if (kind === "outflow") return outflowTotal(snapshot.outflow);
  return snapshot.count;
}

function miniPulseUnit(kind) {
  if (kind === "load") return "load";
  if (kind === "waiting") return "waiting";
  if (kind === "outflow") return "out";
  if (kind === "intake") return "new";
  const track = pipelineKindTrack(kind);
  return track ? `${track} submitted` : "projects";
}

function miniPulseColor(kind) {
  if (kind === "waiting") return STATUS_COLORS.waiting;
  const track = pipelineKindTrack(kind);
  if (track) return trackColorMap[track] || "#6366f1";
  return "#0891b2";
}

function miniTimelineSnapshots(snapshots) {
  const maxColumns = 14;
  if (snapshots.length <= maxColumns) return snapshots;
  return snapshots.slice(snapshots.length - maxColumns);
}

function waitingCountsForSnapshots(snapshots) {
  return snapshots.map(snapshot => ({ date: snapshot.date, count: waitingCount(snapshot) }));
}

function intakeCountsForSnapshots(allSnapshots, visibleSnapshots) {
  const firstSeen = new Map();
  for (const snapshot of allSnapshots) {
    for (const project of snapshot.projects) {
      if (!firstSeen.has(project.file)) firstSeen.set(project.file, snapshot.date);
    }
  }
  const counts = new Map();
  for (const date of firstSeen.values()) {
    counts.set(date, (counts.get(date) || 0) + 1);
  }
  return visibleSnapshots.map(snapshot => ({
    date: snapshot.date,
    count: counts.get(snapshot.date) || 0,
  }));
}

function pipelineCountsForSnapshots(snapshots, track) {
  return snapshots.map(snapshot => ({
    date: snapshot.date,
    count: (snapshot.pipeline || [])
      .filter(item => item.track === track && item.status === "submitted")
      .reduce((total, item) => total + item.count, 0),
  }));
}

function pipelineTotal(items) {
  return (items || []).reduce((total, item) => total + item.count, 0);
}

function dueCountsForSnapshots(snapshots) {
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isDueSoon(project, snapshotDate)).length;
    return { date: snapshot.date, count };
  });
}

function isDueSoon(project, snapshotDate) {
  if (!project.deadline) return false;
  const deadline = parseLocalDate(project.deadline);
  if (Number.isNaN(deadline.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(deadline) - startOfLocalDay(snapshotDate)) / 86400000);
  return days <= 30;
}

function staleCountsForSnapshots(snapshots) {
  const threshold = timelineData?.stale_days ?? 30;
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isStaleProject(project, snapshotDate, threshold)).length;
    return { date: snapshot.date, count };
  });
}

function isStaleProject(project, snapshotDate, threshold) {
  if (project.status !== "waiting" || !project.waiting_since) return false;
  const waitingSince = parseLocalDate(project.waiting_since);
  if (Number.isNaN(waitingSince.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(snapshotDate) - startOfLocalDay(waitingSince)) / 86400000);
  return days > threshold;
}

function miniDotHeight(count, stackHeight) {
  if (count <= 0) return 1;
  return Math.max(1, Math.floor(stackHeight / count));
}

function miniSegmentHeight(count, total, stackHeight) {
  if (count <= 0 || total <= 0) return 0;
  return Math.max(1, Math.round((count / total) * stackHeight));
}

function renderTimelineAxis(axis, snapshots) {
  axis.innerHTML = "";
  const track = document.createElement("div");
  track.className = "timeline-axis-track";
  track.style.width = `${timelineColumnStripWidth(snapshots.length)}px`;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  const spanDays = Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));

  for (let index = 0; index < snapshots.length; index++) {
    const day = document.createElement("span");
    day.className = "timeline-axis-day";
    day.style.left = `${timelineColumnCenter(index)}px`;
    track.appendChild(day);
  }

  for (const index of timelineAxisTickIndexes(snapshots)) {
    const tick = document.createElement("div");
    const isFirst = index === 0;
    const isLast = snapshots.length > 1 && index === snapshots.length - 1;
    tick.className = `timeline-axis-tick${isFirst ? " first" : ""}${isLast ? " last" : ""}`;
    tick.style.left = `${timelineColumnCenter(index)}px`;
    tick.innerHTML = `<span class="timeline-axis-mark"></span><span>${esc(formatTimelineAxisDate(snapshots[index].date, spanDays))}</span>`;
    track.appendChild(tick);
  }

  axis.appendChild(track);
}

function timelineAxisMinWidth(snapshotCount) {
  const yAxisWidth = 44;
  const chartRightPadding = 14;
  return yAxisWidth + chartRightPadding + timelineColumnStripWidth(snapshotCount);
}

function timelineColumnStripWidth(snapshotCount) {
  const columnWidth = 5;
  const columnGap = 1;
  return (snapshotCount * columnWidth) + (Math.max(0, snapshotCount - 1) * columnGap);
}

function timelineColumnCenter(index) {
  const columnWidth = 5;
  const columnGap = 1;
  return (index * (columnWidth + columnGap)) + (columnWidth / 2);
}

function timelineAxisTickIndexes(snapshots) {
  if (!snapshots.length) return [];
  const indexes = new Set();
  for (let index = 0; index < snapshots.length; index++) {
    const date = parseLocalDate(snapshots[index].date);
    if (!Number.isNaN(date.getTime()) && date.getDate() === 1) indexes.add(index);
  }
  if (!indexes.size) return snapshots.length === 1 ? [0] : [0, snapshots.length - 1];

  const monthIndexes = [...indexes].sort((a, b) => a - b);
  const minimumEndpointGap = 8;
  if (monthIndexes[0] >= minimumEndpointGap) indexes.add(0);
  const lastIndex = snapshots.length - 1;
  if (lastIndex - monthIndexes[monthIndexes.length - 1] >= minimumEndpointGap) indexes.add(lastIndex);
  return [...indexes].sort((a, b) => a - b);
}

function formatTimelineAxisDate(dateStr, spanDays) {
  const date = parseLocalDate(dateStr);
  if (Number.isNaN(date.getTime())) return dateStr;
  if (spanDays > 730) return new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" }).format(date);
  if (spanDays > 365) return new Intl.DateTimeFormat(undefined, { month: "short", year: "2-digit" }).format(date);
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date);
}

function analysisSpanDays(snapshots) {
  if (!snapshots.length) return 0;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  if (Number.isNaN(firstDate.getTime()) || Number.isNaN(lastDate.getTime())) return 0;
  return Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));
}

function formatAxisNumber(value) {
  if (value >= 1000) return `${Math.round(value / 100) / 10}k`;
  return String(Math.round(value));
}

function renderTimelineYAxis(yAxis, maxProjects, maxOutflow) {
  const midpoint = Math.round(maxProjects / 2);
  yAxis.innerHTML = `
    <div class="timeline-y-load">
      <span class="timeline-y-label top">${maxProjects}</span>
      <span class="timeline-y-label mid">${midpoint}</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label zero">0</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label bottom">${maxOutflow > 0 ? `-${maxOutflow}` : ""}</span>
    </div>
  `;
}

function sortTimelineProjects(projects) {
  return [...projects].sort((a, b) => {
    const statusDiff = loadStatusRank(a.status) - loadStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track) || a.title.localeCompare(b.title) || a.file.localeCompare(b.file);
  });
}

function loadStatusRank(status) {
  const index = ANALYSIS_STATUS_ORDER.indexOf(status);
  return index === -1 ? ANALYSIS_STATUS_ORDER.length : index;
}

function loadCount(snapshot) {
  return (snapshot.projects || []).filter(project => LOAD_STATUSES.has(project.status)).length;
}

function waitingCount(snapshot) {
  return (snapshot.projects || []).filter(project => project.status === "waiting").length;
}

function sortOutflow(outflow) {
  return [...outflow].sort((a, b) => {
    const statusDiff = outflowStatusRank(a.status) - outflowStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track);
  });
}

function outflowStatusRank(status) {
  const index = OUTFLOW_STATUS_ORDER.indexOf(status);
  return index === -1 ? OUTFLOW_STATUS_ORDER.length : index;
}

function outflowTotal(outflow) {
  return outflow.reduce((total, item) => total + item.count, 0);
}

function timelineCellHeight(maxProjects) {
  if (maxProjects <= 0) return 4;
  const availableHeight = 330;
  const gapReserve = maxProjects > 150 ? 0 : Math.max(0, maxProjects - 1);
  return Math.max(1, Math.min(4, Math.floor((availableHeight - gapReserve) / maxProjects)));
}

function timelineOutflowCellHeight(maxOutflow) {
  if (maxOutflow <= 0) return 6;
  const availableHeight = 66;
  const gapReserve = Math.max(0, maxOutflow - 1);
  return Math.max(2, Math.min(8, Math.floor((availableHeight - gapReserve) / maxOutflow)));
}

function timelineColor(status, ageDays) {
  const base = STATUS_COLORS[status] || "#6b7280";
  if (ageDays === null || ageDays === undefined) return base;
  const ageScore = Math.min(Math.max(ageDays / 365, 0), 1);
  return mixHex("#f8fafc", base, 0.72 + ageScore * 0.28);
}

function mixHex(from, to, amount) {
  const a = parseHex(from);
  const b = parseHex(to);
  const mixed = a.map((channel, i) => Math.round(channel + (b[i] - channel) * amount));
  return `rgb(${mixed[0]}, ${mixed[1]}, ${mixed[2]})`;
}

function parseHex(hex) {
  const value = hex.replace("#", "");
  return [
    parseInt(value.slice(0, 2), 16),
    parseInt(value.slice(2, 4), 16),
    parseInt(value.slice(4, 6), 16),
  ];
}

// --- Agent workspace ---

function createAgentState() {
  return {
    available: null,
    runtime: "",
    provider: "",
    model: "",
    reasoningEffort: "",
    models: [],
    threadId: null,
    activeTurnId: null,
    initializing: false,
    busy: false,
    error: "",
    entries: [],
    itemEntries: new Map(),
    queue: [],
    dispatching: false,
    applying: false,
    configuring: false,
    activityStartedAt: null,
    activityLabel: "",
    eventSource: null,
  };
}

function resetAgentSessionState() {
  if (agentState.eventSource) agentState.eventSource.close();
  agentState = createAgentState();
  renderAgentView();
}

async function agentFetch(url, options) {
  const res = await fetch(url, options);
  let data = {};
  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) throw new Error(data.error || `Agent request failed (${res.status})`);
  return data;
}

async function ensureAgentSession() {
  const state = agentState;
  if (state.threadId || state.initializing) return;
  state.initializing = true;
  state.error = "";
  renderAgentView();

  try {
    const runtime = await agentFetch("/api/agent/status");
    state.available = runtime.available;
    state.runtime = runtime.version || "";
    if (!runtime.available) {
      throw new Error(runtime.error || "Codex is unavailable");
    }

    try {
      const catalog = await agentFetch("/api/agent/models");
      state.models = Array.isArray(catalog.data) ? catalog.data : [];
    } catch {
      state.models = [];
    }

    const savedModel = readAgentPreference("hq-agent-model");
    const savedEffort = readAgentPreference("hq-agent-effort");
    const savedModelInfo = state.models.find(model => (
      model.model === savedModel || model.id === savedModel
    ));
    const supportedEfforts = savedModelInfo?.supportedReasoningEfforts || [];
    const validEffort = supportedEfforts.some(option => option.reasoningEffort === savedEffort)
      ? savedEffort
      : null;
    const session = await agentFetch("/api/agent/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: savedModelInfo?.model || null,
        reasoning_effort: validEffort,
      }),
    });
    state.threadId = session.thread_id;
    state.provider = session.provider;
    state.model = session.model;
    state.reasoningEffort = session.reasoning_effort || "";
    connectAgentEvents(state);
  } catch (error) {
    state.available = false;
    state.error = error.message;
  } finally {
    state.initializing = false;
    renderAgentView();
  }
}

function readAgentPreference(key) {
  try { return localStorage.getItem(key) || ""; } catch { return ""; }
}

function writeAgentPreference(key, value) {
  try { localStorage.setItem(key, value); } catch { /* unavailable */ }
}

function agentModelInfo(modelName = agentState.model) {
  return agentState.models.find(model => model.model === modelName || model.id === modelName);
}

function agentModelLabel(modelName = agentState.model) {
  return agentModelInfo(modelName)?.displayName || modelName || "Codex";
}

function agentEffortLabel(effort = agentState.reasoningEffort) {
  if (!effort) return "Default thinking";
  return effort.charAt(0).toUpperCase() + effort.slice(1);
}

function renderAgentSettings() {
  const state = agentState;
  const modelSelect = document.getElementById("agent-model-select");
  const effortSelect = document.getElementById("agent-effort-select");
  const currentModelInfo = agentModelInfo();
  const modelOptions = [...state.models];
  if (state.model && !currentModelInfo) {
    modelOptions.unshift({ model: state.model, displayName: state.model });
  }
  modelSelect.innerHTML = modelOptions.map(model => (
    `<option value="${esc(model.model)}">${esc(model.displayName || model.model)}</option>`
  )).join("");
  modelSelect.value = state.model;

  const efforts = currentModelInfo?.supportedReasoningEfforts || [];
  const effortOptions = [...efforts];
  if (state.reasoningEffort && !effortOptions.some(option => (
    option.reasoningEffort === state.reasoningEffort
  ))) {
    effortOptions.unshift({
      reasoningEffort: state.reasoningEffort,
      description: "Current thinking level",
    });
  }
  effortSelect.innerHTML = effortOptions.map(option => (
    `<option value="${esc(option.reasoningEffort)}" title="${esc(option.description || "")}">` +
      `${esc(agentEffortLabel(option.reasoningEffort))}</option>`
  )).join("");
  effortSelect.value = state.reasoningEffort;

  const locked = (
    !state.threadId || state.initializing || state.configuring || state.busy ||
    state.applying || state.dispatching || state.queue.length > 0
  );
  modelSelect.disabled = locked || modelOptions.length === 0;
  effortSelect.disabled = locked || effortOptions.length === 0;
}

async function updateAgentSettings(model, effort) {
  const state = agentState;
  if (!state.threadId || state.configuring || !model || !effort) return;
  state.configuring = true;
  state.error = "";
  renderAgentView();
  try {
    const session = await agentFetch("/api/agent/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, reasoning_effort: effort }),
    });
    state.model = session.model;
    state.reasoningEffort = session.reasoning_effort || effort;
    writeAgentPreference("hq-agent-model", state.model);
    writeAgentPreference("hq-agent-effort", state.reasoningEffort);
  } catch (error) {
    state.error = error.message;
  } finally {
    state.configuring = false;
    renderAgentView();
  }
}

function changeAgentModel(event) {
  const model = event.target.value;
  const info = agentModelInfo(model);
  const effort = info?.defaultReasoningEffort ||
    info?.supportedReasoningEfforts?.[0]?.reasoningEffort ||
    agentState.reasoningEffort;
  void updateAgentSettings(model, effort);
}

function changeAgentEffort(event) {
  void updateAgentSettings(agentState.model, event.target.value);
}

function setAgentActivity(label) {
  if (!agentState.activityStartedAt) agentState.activityStartedAt = Date.now();
  agentState.activityLabel = label;
}

function clearAgentActivity() {
  agentState.activityStartedAt = null;
  agentState.activityLabel = "";
}

function formatAgentElapsed(startedAt, now = Date.now()) {
  if (!startedAt) return "";
  const seconds = Math.max(0, Math.floor((now - startedAt) / 1000));
  if (seconds < 60) return `${seconds}s`;
  return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
}

function updateAgentElapsed() {
  const elapsed = document.getElementById("agent-elapsed");
  if (elapsed) elapsed.textContent = formatAgentElapsed(agentState.activityStartedAt);
}

function agentActivityMarkup(label) {
  return `<span class="agent-activity">` +
    `<strong>${esc(label)}…</strong>` +
    `<span class="agent-elapsed" id="agent-elapsed">` +
      `${esc(formatAgentElapsed(agentState.activityStartedAt))}</span>` +
    `</span>`;
}

function updateAgentRunningIndicator(state) {
  const indicator = document.getElementById("agent-running-indicator");
  const isRunning = state.busy || state.applying || state.dispatching;
  const activityLabel = state.applying
    ? "Applying edits"
    : (state.activityLabel || "Working");
  indicator.hidden = !isRunning;
  indicator.setAttribute("aria-label", `Agent is ${activityLabel.toLowerCase()}`);
  indicator.title = `${activityLabel}…`;
}

function clearAgentConversation() {
  const state = agentState;
  const retained = state.entries.filter(entry => entry.queued || entry.streaming);
  state.entries = retained;
  state.itemEntries = new Map(
    retained
      .filter(entry => entry.itemId)
      .map(entry => [entry.itemId, entry])
  );
  renderAgentView();
}

function connectAgentEvents(state) {
  if (state.eventSource) state.eventSource.close();
  const source = new EventSource(
    "/api/agent/events?thread_id=" + encodeURIComponent(state.threadId)
  );
  state.eventSource = source;
  source.addEventListener("agent", event => {
    try {
      handleAgentEvent(JSON.parse(event.data));
    } catch {
      // Ignore malformed or forward-incompatible runtime notifications.
    }
  });
  source.onerror = () => {
    if (state.busy) {
      state.error = "Agent event connection interrupted; reconnecting…";
      renderAgentView();
    }
  };
}

function agentEntryForItem(state, item, kind, defaults = {}) {
  let entry = state.itemEntries.get(item.id);
  if (!entry) {
    entry = { kind, itemId: item.id, ...defaults };
    state.entries.push(entry);
    state.itemEntries.set(item.id, entry);
  }
  return entry;
}

function handleAgentEvent(event) {
  const state = agentState;
  const method = event.method;
  const params = event.params || {};
  const item = params.item || {};
  let continueQueue = false;

  if (method === "item/agentMessage/delta") {
    setAgentActivity("Writing");
    const entry = agentEntryForItem(
      state,
      { id: params.itemId },
      "agent",
      { text: "", streaming: true }
    );
    entry.text += params.delta || "";
  } else if (method === "item/started") {
    if (item.type === "agentMessage") {
      setAgentActivity("Writing");
      agentEntryForItem(state, item, "agent", { text: item.text || "", streaming: true });
    } else {
      setAgentActivity("Working");
    }
  } else if (method === "item/completed") {
    if (item.type === "agentMessage") {
      const entry = agentEntryForItem(state, item, "agent", { text: "" });
      entry.text = item.text || entry.text;
      entry.streaming = false;
    }
    setAgentActivity("Thinking");
  } else if (method === "turn/started") {
    state.busy = true;
    state.error = "";
    state.activeTurnId = params.turn?.id || state.activeTurnId;
    setAgentActivity("Thinking");
  } else if (method === "turn/completed") {
    state.busy = false;
    state.activeTurnId = null;
    const status = params.turn?.status;
    if (status === "failed") {
      clearAgentActivity();
      state.entries.push({
        kind: "notice",
        text: params.turn?.error?.message || "Agent turn failed.",
      });
    } else if (status === "interrupted") {
      clearAgentActivity();
      state.entries.push({ kind: "notice", text: "Agent stopped." });
    } else {
      setAgentActivity("Applying edits");
      autoApplyAgentChange();
    }
    continueQueue = status === "failed" || status === "interrupted";
  } else if (method === "error" || method === "hq/runtimeExited") {
    state.busy = false;
    state.activeTurnId = null;
    state.error = params.message || params.error?.message || "The agent runtime stopped.";
    clearAgentActivity();
  }

  renderAgentView();
  if (continueQueue) void processAgentQueue();
}

function renderAgentEntry(entry) {
  if (entry.kind === "user") {
    const queued = entry.queued
      ? `<span class="agent-queued-label">Queued</span>`
      : "";
    return `<div class="agent-message user${entry.queued ? " queued" : ""}">${queued}${esc(entry.text)}</div>`;
  }
  if (entry.kind === "agent") {
    const text = entry.text || (entry.streaming ? "…" : "");
    return `<div class="agent-message agent">${marked.parse(text)}</div>`;
  }
  return `<div class="agent-notice">${esc(entry.text || "")}</div>`;
}

function renderAgentView() {
  const state = agentState;
  const status = document.getElementById("agent-status");
  const transcript = document.getElementById("agent-transcript");
  const input = document.getElementById("agent-input");
  const send = document.getElementById("agent-send-btn");
  const stop = document.getElementById("agent-stop-btn");
  const clear = document.getElementById("agent-clear-btn");
  const queuedCount = state.queue.length;
  const queueStatus = queuedCount
    ? ` · ${queuedCount} queued`
    : "";
  updateAgentRunningIndicator(state);

  if (state.initializing) {
    status.textContent = "Preparing an isolated Codex workspace…";
  } else if (state.configuring) {
    status.textContent = "Updating Agent model settings…";
  } else if (state.applying) {
    status.innerHTML = `${agentActivityMarkup("Applying edits")}${queueStatus}`;
  } else if (state.error) {
    status.innerHTML = `<strong>Agent unavailable</strong> · ${esc(state.error)}`;
  } else if (state.busy) {
    status.innerHTML = `${agentActivityMarkup(state.activityLabel || "Working")} · ${esc(agentModelLabel())} · ${esc(agentEffortLabel())}${queueStatus}`;
  } else if (state.threadId) {
    status.innerHTML = `<strong>Codex</strong> · ${esc(agentModelLabel())} · ${esc(agentEffortLabel())}${state.runtime ? ` · ${esc(state.runtime)}` : ""}${queueStatus}`;
  } else {
    status.textContent = "Codex agent";
  }

  if (state.entries.length) {
    transcript.innerHTML = state.entries.map(renderAgentEntry).join("");
  } else {
    transcript.innerHTML = `
      <div class="agent-empty">
        Ask about one project or work across the whole portfolio.<br>
        The agent can inspect HQ, use coding tools, and make coordinated project updates.
      </div>`;
  }
  transcript.scrollTop = transcript.scrollHeight;

  renderAgentSettings();

  input.disabled = !state.threadId || state.configuring;
  send.disabled = !state.threadId || state.configuring || !input.value.trim();
  send.textContent = state.busy || state.applying || state.dispatching ? "Queue" : "Send";
  stop.disabled = !state.busy || !state.activeTurnId;
  clear.disabled = (
    !state.threadId ||
    !state.entries.some(entry => !entry.queued && !entry.streaming)
  );
}

function sendAgentMessage() {
  const state = agentState;
  const input = document.getElementById("agent-input");
  const message = input.value;
  if (!message.trim() || !state.threadId) return;

  input.value = "";
  const entry = { kind: "user", text: message, queued: true };
  state.entries.push(entry);
  state.queue.push({
    message,
    contextFile: selectedFile,
    entry,
  });
  state.error = "";
  renderAgentView();
  input.focus();
  void processAgentQueue();
}

async function processAgentQueue() {
  const state = agentState;
  if (
    !state.threadId ||
    state.configuring ||
    state.busy ||
    state.applying ||
    state.dispatching ||
    !state.queue.length
  ) return;

  const pending = state.queue.shift();
  pending.entry.queued = false;
  state.dispatching = true;
  state.busy = true;
  state.error = "";
  setAgentActivity("Starting");
  renderAgentView();

  try {
    const turn = await agentFetch("/api/agent/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: pending.message,
        context_file: pending.contextFile,
      }),
    });
    state.activeTurnId = turn.turn_id;
  } catch (error) {
    state.busy = false;
    state.error = error.message;
    clearAgentActivity();
  } finally {
    state.dispatching = false;
    renderAgentView();
  }
}

async function stopAgentTurn() {
  const state = agentState;
  if (!state.threadId || !state.activeTurnId) return;
  try {
    await agentFetch("/api/agent/interrupt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        thread_id: state.threadId,
        turn_id: state.activeTurnId,
      }),
    });
  } catch (error) {
    state.error = error.message;
    renderAgentView();
  }
}

async function autoApplyAgentChange() {
  const state = agentState;
  const openFile = selectedFile;
  state.applying = true;
  setAgentActivity("Applying edits");
  renderAgentView();
  try {
    const change = await agentFetch("/api/agent/change");
    if (!change.changed) return;
    const result = await agentFetch("/api/agent/apply", {
      method: "POST",
    });
    const count = result.files?.length || 0;
    state.entries.push({
      kind: "notice",
      text: `Applied ${count} HQ file${count === 1 ? "" : "s"}. Undo is available.`,
    });
    await Promise.all([fetchProjects(), fetchTasks(), fetchRoutines()]);
    if (openFile && projects.some(project => project.file === openFile)) {
      await openPanel(openFile);
    }
    toast(`Applied ${count} agent update${count === 1 ? "" : "s"}`);
    refreshUndoState();
  } catch (error) {
    state.error = error.message;
  } finally {
    state.applying = false;
    clearAgentActivity();
    renderAgentView();
    void processAgentQueue();
  }
}

// --- Standalone tasks ---

function taskMatchesSearch(task) {
  if (!searchQuery) return true;
  const haystack = [
    task.text,
    task.priority,
    task.due,
    task.deferred_until,
  ].filter(value => value !== null && value !== undefined).join(" ").toLowerCase();
  return searchQuery.toLowerCase().split(/\s+/).filter(Boolean)
    .every(term => haystack.includes(term));
}

function tasksForScope() {
  return tasks.filter(taskMatchesSearch).filter(task =>
    taskScope === "available" ? task.visible : !task.visible
  );
}

function renderTaskFilters() {
  const bar = document.getElementById("track-filters");
  bar.innerHTML = "";
  [["available", "Available"], ["deferred", "Deferred"]].forEach(([scope, label]) => {
    const button = document.createElement("button");
    button.className = "track-filter" + (taskScope === scope ? " active" : "");
    const count = tasks.filter(task => scope === "available" ? task.visible : !task.visible).length;
    button.innerHTML = `${label}<span class="filter-count">${count}</span>`;
    button.addEventListener("click", () => {
      taskScope = scope;
      renderTasks();
    });
    bar.appendChild(button);
  });
}

function taskAnnotationSummary(task) {
  const parts = [];
  if (task.waiting) parts.push("Waiting");
  parts.push(...task.contexts.map(value => `@${value}`));
  parts.push(...task.people.map(value => `&${value}`));
  parts.push(...task.tags.map(value => `+${value}`));
  if (task.created) parts.push(`created ${task.created}`);
  return parts.join(" · ");
}

function taskDateLabel(task) {
  if (!task.visible && task.deferred_until) return `Deferred to ${task.deferred_until}`;
  if (!task.due) return "";
  const days = daysSince(task.due);
  if (days === 0) return "Due today";
  if (days > 0) return `Due ${task.due} · ${days}d overdue`;
  return `Due ${task.due}`;
}

function renderTasks() {
  const visible = tasksForScope();
  renderTaskFilters();
  const list = document.getElementById("task-list");
  list.innerHTML = "";
  if (!visible.length) {
    list.innerHTML = `<div class="empty-state">${
      tasks.length ? `No ${taskScope} tasks` : "No tasks yet"
    }</div>`;
    return;
  }
  const rows = document.createElement("div");
  rows.className = "routine-list";
  visible.forEach(task => rows.appendChild(createTaskRow(task)));
  list.appendChild(rows);
}

function createTaskRow(task) {
  const row = document.createElement("div");
  row.className = "routine-row task-row";
  row.draggable = true;
  row.innerHTML = `
    <button class="routine-complete" type="button"
      aria-label="Complete ${esc(task.title)}">✓</button>
    <div>
      <div class="routine-title">${esc(task.title)}</div>
      <div class="routine-summary">${esc(taskAnnotationSummary(task))}</div>
    </div>
    <div class="task-priority">${task.priority == null ? "" : `p:${esc(task.priority)}`}</div>
    <div class="routine-date">${esc(taskDateLabel(task))}</div>
    <div class="routine-actions">
      <div class="card-defer-wrap" data-task-defer>
        <button class="routine-action" type="button" aria-haspopup="menu"
          aria-expanded="false">Defer</button>
        <div class="card-defer-menu" role="menu">
          <div class="card-defer-presets">
            <button type="button" data-task-defer-days="1">Tomorrow</button>
            <button type="button" data-task-defer-days="7">One week</button>
            <button type="button" data-task-defer-month="1">One month</button>
          </div>
          <div class="card-defer-custom">
            <input type="date" aria-label="Custom task defer date">
            <button type="button" data-task-defer-custom>Set</button>
          </div>
        </div>
      </div>
    </div>`;

  row.addEventListener("click", () => {
    if (!taskDidDrag) openTaskModal(task);
  });
  row.querySelector(".routine-complete").addEventListener("click", event => {
    event.stopPropagation();
    completeStandaloneTask(task);
  });
  const deferWrap = row.querySelector("[data-task-defer]");
  deferWrap.addEventListener("click", event => event.stopPropagation());
  const deferButton = deferWrap.querySelector("[aria-haspopup='menu']");
  deferButton.addEventListener("click", () => {
    const shouldOpen = !deferWrap.classList.contains("open");
    closeActionMenus(deferWrap);
    deferWrap.classList.toggle("open", shouldOpen);
    deferButton.setAttribute("aria-expanded", String(shouldOpen));
  });
  deferWrap.querySelectorAll("[data-task-defer-days]").forEach(button => {
    button.addEventListener("click", () => {
      const date = addRoutineInterval(new Date(), Number(button.dataset.taskDeferDays), "day");
      deferStandaloneTask(task, formatLocalDate(date));
    });
  });
  deferWrap.querySelector("[data-task-defer-month]").addEventListener("click", event => {
    const date = addRoutineInterval(new Date(), Number(event.currentTarget.dataset.taskDeferMonth), "month");
    deferStandaloneTask(task, formatLocalDate(date));
  });
  const customInput = deferWrap.querySelector('input[type="date"]');
  deferWrap.querySelector("[data-task-defer-custom]").addEventListener("click", () => {
    if (!customInput.value || parseLocalDate(customInput.value) <= startOfLocalDay(new Date())) {
      toast("Choose a future date");
      return;
    }
    deferStandaloneTask(task, customInput.value);
  });

  row.addEventListener("dragstart", event => {
    taskDrag = task;
    taskDidDrag = true;
    event.dataTransfer.effectAllowed = "move";
    requestAnimationFrame(() => row.classList.add("dragging"));
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    document.querySelectorAll(".task-row").forEach(element =>
      element.classList.remove("drop-before", "drop-after")
    );
    taskDrag = null;
    setTimeout(() => { taskDidDrag = false; }, 0);
  });
  row.addEventListener("dragover", event => {
    if (!taskDrag || taskDrag.line === task.line) return;
    event.preventDefault();
    const after = event.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
    row.classList.toggle("drop-before", !after);
    row.classList.toggle("drop-after", after);
  });
  row.addEventListener("dragleave", () => row.classList.remove("drop-before", "drop-after"));
  row.addEventListener("drop", event => {
    event.preventDefault();
    event.stopPropagation();
    const after = row.classList.contains("drop-after");
    row.classList.remove("drop-before", "drop-after");
    const targetIndex = tasksForScope().findIndex(candidate => candidate.line === task.line);
    reorderStandaloneTask(targetIndex + (after ? 1 : 0));
  });
  return row;
}

function effectiveTaskPriority(task, index) {
  return Number.isFinite(task?.priority) ? task.priority : -(index + 1) * 100;
}

function taskPriorityForDrop(items, dropIndex, draggedLine) {
  const originalIndex = items.findIndex(task => task.line === draggedLine);
  const others = items.filter(task => task.line !== draggedLine);
  let insertion = dropIndex;
  if (originalIndex >= 0 && originalIndex < insertion) insertion -= 1;
  insertion = Math.max(0, Math.min(insertion, others.length));
  const previous = others[insertion - 1];
  const next = others[insertion];
  if (!previous && !next) return 100;
  if (!previous) return effectiveTaskPriority(next, insertion) + 100;
  if (!next) return effectiveTaskPriority(previous, insertion - 1) - 100;
  const high = effectiveTaskPriority(previous, insertion - 1);
  const low = effectiveTaskPriority(next, insertion);
  return high > low ? (high + low) / 2 : high - 0.5;
}

async function reorderStandaloneTask(dropIndex) {
  if (!taskDrag) return;
  const task = taskDrag;
  const priority = taskPriorityForDrop(tasksForScope(), dropIndex, task.line);
  try {
    const res = await fetch("/api/task/priority", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line: task.line, expected: task.raw, priority }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Task reorder failed (${res.status})`);
    await fetchTasks();
    refreshUndoState();
  } catch (error) {
    toast("Error: " + error.message);
  }
}

async function completeStandaloneTask(task) {
  try {
    const res = await fetch("/api/task/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line: task.line, expected: task.raw }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Task completion failed (${res.status})`);
    await fetchTasks();
    refreshUndoState();
    toast(`Completed ${task.title}`);
  } catch (error) {
    toast("Error: " + error.message);
  }
}

async function deferStandaloneTask(task, until) {
  closeActionMenus();
  try {
    const res = await fetch("/api/task/defer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line: task.line, expected: task.raw, until }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Task deferral failed (${res.status})`);
    await fetchTasks();
    refreshUndoState();
    toast(`Deferred until ${until}`);
  } catch (error) {
    toast("Error: " + error.message);
  }
}

function openTaskModal(task = null) {
  editingTask = task;
  document.getElementById("task-modal-title").textContent = task ? "Edit task" : "New task";
  document.getElementById("task-submit").textContent = task ? "Save" : "Create";
  document.getElementById("task-text").value = task?.text || "";
  const priorities = tasks.map(task => task.priority).filter(Number.isFinite);
  document.getElementById("task-priority").value = task?.priority ??
    (priorities.length ? Math.max(...priorities) + 100 : 100);
  document.getElementById("task-due").value = task?.due || "";
  document.getElementById("task-deferred-until").value = task?.deferred_until || "";
  document.getElementById("task-waiting").checked = task?.waiting || false;
  document.getElementById("task-error").textContent = "";
  document.getElementById("task-modal").classList.add("open");
  document.getElementById("task-text").focus();
}

function closeTaskModal() {
  document.getElementById("task-modal").classList.remove("open");
  editingTask = null;
}

async function submitTaskModal() {
  const error = document.getElementById("task-error");
  const submit = document.getElementById("task-submit");
  error.textContent = "";
  const text = document.getElementById("task-text").value.trim();
  const priorityRaw = document.getElementById("task-priority").value;
  if (!text) {
    error.textContent = "Task text is required";
    return;
  }
  const priority = priorityRaw === "" ? null : Number(priorityRaw);
  if (priority !== null && !Number.isFinite(priority)) {
    error.textContent = "Priority must be a number";
    return;
  }
  const payload = {
    text,
    priority,
    due: document.getElementById("task-due").value || null,
    deferred_until: document.getElementById("task-deferred-until").value || null,
    waiting: document.getElementById("task-waiting").checked,
  };
  if (editingTask) {
    payload.line = editingTask.line;
    payload.expected = editingTask.raw;
  }
  submit.disabled = true;
  try {
    const res = await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Task save failed (${res.status})`);
    closeTaskModal();
    await fetchTasks();
    refreshUndoState();
  } catch (saveError) {
    error.textContent = saveError.message;
  } finally {
    submit.disabled = false;
  }
}

// --- Routines ---

function renderRoutineAreas() {
  const list = document.getElementById("routine-areas");
  list.innerHTML = "";
  [...new Set(routines.map(routine => routine.area))].sort().forEach(area => {
    const option = document.createElement("option");
    option.value = area;
    list.appendChild(option);
  });
}

function routineMatchesSearch(routine) {
  if (!searchQuery) return true;
  const haystack = [
    routine.title,
    routine.area,
    routine.repeat,
    routine.repeat_from,
    routine.body,
  ].filter(Boolean).join(" ").toLowerCase();
  return searchQuery.toLowerCase().split(/\s+/).filter(Boolean)
    .every(term => haystack.includes(term));
}

function routinesForTimeline() {
  return routines
    .filter(routineMatchesSearch)
    .sort((a, b) =>
      a.next_due.localeCompare(b.next_due) ||
      a.title.localeCompare(b.title)
    );
}

function endOfRoutineSeason(today) {
  const month = today.getMonth();
  if (month <= 1) return new Date(today.getFullYear(), 2, 0);
  if (month <= 4) return new Date(today.getFullYear(), 5, 0);
  if (month <= 7) return new Date(today.getFullYear(), 8, 0);
  if (month <= 10) return new Date(today.getFullYear(), 11, 0);
  return new Date(today.getFullYear() + 1, 2, 0);
}

function routineHorizon(routine, now = new Date()) {
  if (["available", "due", "overdue"].includes(routine.timing)) return "Now";
  const today = startOfLocalDay(now);
  const target = routine.timing === "deferred"
    ? routineMoment(routine.deferred_until)
    : parseLocalDate(routine.available_on || routine.next_due);
  if (!target || target < now) return "Now";
  const targetDay = startOfLocalDay(target);
  if (targetDay.getTime() === today.getTime()) return "Today";

  const endOfWeek = new Date(today);
  endOfWeek.setDate(today.getDate() + ((7 - today.getDay()) % 7));
  if (targetDay <= endOfWeek) return "This week";

  const endOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  if (targetDay <= endOfMonth) return "This month";
  if (targetDay <= endOfRoutineSeason(today)) return "This season";

  const endOfYear = new Date(today.getFullYear(), 11, 31);
  if (targetDay <= endOfYear) return "This year";
  return "Later";
}

function routineMoment(value) {
  if (!value) return null;
  const moment = value.includes("T") ? new Date(value) : parseLocalDate(value);
  return Number.isNaN(moment.getTime()) ? null : moment;
}

function routineMomentLabel(value) {
  const moment = routineMoment(value);
  if (!moment || !value.includes("T")) return value;
  return moment.toLocaleString(undefined, {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

function routineDateLabel(routine) {
  if (routine.timing === "overdue") {
    const days = daysSince(routine.next_due);
    return `Due ${routine.next_due} · ${days}d overdue`;
  }
  if (routine.timing === "due") return "Due today";
  if (routine.timing === "deferred") {
    return `Deferred to ${routineMomentLabel(routine.deferred_until)} · due ${routine.next_due}`;
  }
  if (routine.timing === "upcoming") {
    return `Available ${routine.available_on} · due ${routine.next_due}`;
  }
  return `Due ${routine.next_due}`;
}

function addRoutineInterval(date, count, unit) {
  const result = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  if (unit === "day") result.setDate(result.getDate() + count);
  if (unit === "week") result.setDate(result.getDate() + count * 7);
  if (unit === "month") result.setMonth(result.getMonth() + count);
  return result;
}

function renderRoutines() {
  const list = document.getElementById("routine-list");
  const visible = routinesForTimeline();
  document.getElementById("track-filters").innerHTML = "";
  list.innerHTML = "";

  if (!visible.length) {
    list.innerHTML = `<div class="empty-state">${
      routines.length ? "No matching routines" : "No routines yet"
    }</div>`;
    return;
  }

  const groups = new Map();
  visible.forEach(routine => {
    const horizon = routineHorizon(routine);
    if (!groups.has(horizon)) groups.set(horizon, []);
    groups.get(horizon).push(routine);
  });

  const routineHorizons = ["Now", "Today", "This week", "This month", "This season", "This year", "Later"];
  routineHorizons.forEach(horizon => {
    const groupedRoutines = groups.get(horizon) || [];
    const section = document.createElement("section");
    section.className = `routine-group${groupedRoutines.length ? "" : " empty"}`;
    section.innerHTML = `<div class="routine-group-title">${esc(horizon)}</div>`;
    const rows = document.createElement("div");
    rows.className = "routine-list";
    groupedRoutines.forEach(routine => rows.appendChild(createRoutineRow(routine)));
    section.appendChild(rows);
    list.appendChild(section);
  });
}

function createRoutineRow(routine) {
  const row = document.createElement("div");
  const customNow = new Date();
  const customDefault = new Date(customNow.getTime() + 60 * 60 * 1000);
  row.className = `routine-row ${routine.timing}`;
  row.dataset.file = routine.file;
  row.innerHTML = `
    <button class="routine-complete" type="button"
      aria-label="Complete ${esc(routine.title)}">✓</button>
    <div>
      <div class="routine-title">${esc(routine.title)}</div>
      <div class="routine-summary">${esc(routine.area)} · Every ${esc(routine.repeat)} · ${
        routine.repeat_from === "completion" ? "from completion" : "fixed schedule"
      } · available ${esc(routine.available_before)} before</div>
    </div>
    <div class="routine-date">${esc(routineDateLabel(routine))}</div>
    <div class="routine-actions">
      <div class="card-defer-wrap" data-routine-defer>
        <button class="routine-action" type="button" aria-haspopup="menu"
          aria-expanded="false">Defer</button>
        <div class="card-defer-menu" role="menu">
          <div class="card-defer-presets">
            <button type="button" data-routine-defer-preset="hour">1 hour</button>
            <button type="button" data-routine-defer-preset="evening">This evening</button>
            <button type="button" data-routine-defer-days="1">Tomorrow</button>
            <button type="button" data-routine-defer-days="7">One week</button>
            <button type="button" data-routine-defer-month="1">One month</button>
          </div>
          <div class="card-defer-custom">
            <input type="datetime-local" aria-label="Custom routine defer date and time"
              min="${formatLocalDateTimeInput(customNow)}"
              value="${formatLocalDateTimeInput(customDefault)}">
            <button type="button" data-routine-defer-custom>Set</button>
          </div>
        </div>
      </div>
      <button class="routine-action" type="button" data-routine-skip>Skip</button>
    </div>`;

  row.addEventListener("click", () => openRoutineModal(routine));
  const complete = row.querySelector(".routine-complete");
  complete.addEventListener("click", event => {
    event.stopPropagation();
    mutateRoutine("/api/routine/complete", routine.file, `Completed ${routine.title}`);
  });
  const deferWrap = row.querySelector("[data-routine-defer]");
  deferWrap.addEventListener("click", event => event.stopPropagation());
  const deferButton = deferWrap.querySelector("[aria-haspopup='menu']");
  deferButton.addEventListener("click", () => {
    const shouldOpen = !deferWrap.classList.contains("open");
    closeActionMenus(deferWrap);
    deferWrap.classList.toggle("open", shouldOpen);
    deferButton.setAttribute("aria-expanded", String(shouldOpen));
  });
  deferWrap.querySelectorAll("[data-routine-defer-preset]").forEach(button => {
    button.addEventListener("click", () => {
      const preset = button.dataset.routineDeferPreset;
      deferRoutineUntil(routine.file, deferUntilForPreset(preset), DEFER_LABELS[preset]);
    });
  });
  deferWrap.querySelectorAll("[data-routine-defer-days]").forEach(button => {
    button.addEventListener("click", () => {
      const date = addRoutineInterval(new Date(), Number(button.dataset.routineDeferDays), "day");
      deferRoutineUntil(routine.file, formatLocalDate(date));
    });
  });
  deferWrap.querySelector("[data-routine-defer-month]").addEventListener("click", event => {
    const date = addRoutineInterval(new Date(), Number(event.currentTarget.dataset.routineDeferMonth), "month");
    deferRoutineUntil(routine.file, formatLocalDate(date));
  });
  const customInput = deferWrap.querySelector('input[type="datetime-local"]');
  deferWrap.querySelector("[data-routine-defer-custom]").addEventListener("click", () => {
    const customDate = new Date(customInput.value);
    if (!customInput.value || Number.isNaN(customDate.getTime()) || customDate <= new Date()) {
      toast("Choose a future date and time");
      return;
    }
    deferRoutineUntil(routine.file, customDate.toISOString());
  });
  row.querySelector("[data-routine-skip]").addEventListener("click", event => {
    event.stopPropagation();
    mutateRoutine("/api/routine/skip", routine.file, `Skipped ${routine.title}`);
  });
  return row;
}

async function mutateRoutine(endpoint, file, success, extra = {}) {
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, ...extra }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Routine update failed (${res.status})`);
    await fetchRoutines();
    refreshUndoState();
    toast(success);
  } catch (error) {
    toast("Error: " + error.message);
  }
}

function deferRoutineUntil(file, until, label = `until ${routineMomentLabel(until)}`) {
  closeActionMenus();
  return mutateRoutine("/api/routine/defer", file, `Deferred ${label}`, { until });
}

function parseRoutineInterval(value, fallbackUnit) {
  const match = /^(\d+)\s+(day|week|month|year)s?$/.exec(value || "");
  return match
    ? { count: match[1], unit: match[2] }
    : { count: "1", unit: fallbackUnit };
}

function openRoutineModal(routine = null) {
  editingRoutineFile = routine?.file || null;
  document.getElementById("routine-modal-title").textContent =
    routine ? "Edit routine" : "New routine";
  document.getElementById("routine-submit").textContent = routine ? "Save" : "Create";
  document.getElementById("routine-title").value = routine?.title || "";
  document.getElementById("routine-area").value = routine?.area || "home";
  const repeat = parseRoutineInterval(routine?.repeat, "month");
  document.getElementById("routine-repeat-count").value = repeat.count;
  document.getElementById("routine-repeat-unit").value = repeat.unit;
  document.getElementById("routine-repeat-from").value =
    routine?.repeat_from || "completion";
  const available = parseRoutineInterval(routine?.available_before, "day");
  document.getElementById("routine-available-count").value =
    routine ? available.count : "0";
  document.getElementById("routine-available-unit").value = available.unit;
  document.getElementById("routine-next-due").value =
    routine?.next_due || formatLocalDate(new Date());
  document.getElementById("routine-notes").value = routine?.body || "";
  document.getElementById("routine-error").textContent = "";
  document.getElementById("routine-modal").classList.add("open");
  document.getElementById("routine-title").focus();
}

function closeRoutineModal() {
  document.getElementById("routine-modal").classList.remove("open");
  editingRoutineFile = null;
}

async function submitRoutineModal() {
  const error = document.getElementById("routine-error");
  const submit = document.getElementById("routine-submit");
  error.textContent = "";
  const title = document.getElementById("routine-title").value.trim();
  const area = document.getElementById("routine-area").value.trim();
  const repeatCount = document.getElementById("routine-repeat-count").value;
  const repeatUnit = document.getElementById("routine-repeat-unit").value;
  const availableCount = document.getElementById("routine-available-count").value;
  const availableUnit = document.getElementById("routine-available-unit").value;
  const nextDue = document.getElementById("routine-next-due").value;
  if (!title || !area || !repeatCount || !nextDue) {
    error.textContent = "Title, area, repeat interval, and next due date are required";
    return;
  }
  const payload = {
    title,
    area,
    repeat: `${repeatCount} ${repeatUnit}`,
    repeat_from: document.getElementById("routine-repeat-from").value,
    available_before: `${availableCount || 0} ${availableUnit}`,
    next_due: nextDue,
    body: document.getElementById("routine-notes").value,
  };
  const wasEditing = Boolean(editingRoutineFile);
  if (editingRoutineFile) payload.file = editingRoutineFile;

  submit.disabled = true;
  try {
    const res = await fetch("/api/routines", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Routine save failed (${res.status})`);
    closeRoutineModal();
    await fetchRoutines();
    refreshUndoState();
    toast(wasEditing ? "Routine saved" : "Routine created");
  } catch (err) {
    error.textContent = err.message;
  } finally {
    submit.disabled = false;
  }
}

async function openPanel(file) {
  const p = projects.find(pr => pr.file === file);
  if (!p) return;

  closeActionMenus();
  selectedFile = file;
  metadataEditMode = false;
  nextActionEditMode = false;
  projectBodyReady = false;
  originalBody = "";
  render(); // re-render to show selected state on card

  document.getElementById("panel-title").textContent = p.title;
  document.getElementById("panel-file").textContent = p.file;
  renderProjectNextAction(p);
  renderProjectFields(p);
  renderPanelActionControls(p);

  // Set Obsidian link
  const obsBtn = document.getElementById("panel-obsidian");
  const filePath = file.replace(/\.md$/, '');
  obsBtn.href = `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(filePath)}`;

  // Fetch body content
  const content = document.getElementById("panel-content");
  content.innerHTML = '<span class="panel-body-empty">Loading...</span>';

  try {
    const res = await fetch("/api/project?file=" + encodeURIComponent(file));
    const data = await res.json();
    originalBody = data.body || '';
    projectBodyReady = true;
    renderBody(content, originalBody);
    renderProjectNextAction(p);
  } catch {
    content.className = "panel-body-empty";
    content.textContent = "Failed to load content.";
    renderProjectNextAction(p);

  exitEditMode();
  document.getElementById("panel-overlay").classList.add("open");
  document.body.classList.add("panel-open");
}

function closePanel() {
  editMode = false;
  metadataEditMode = false;
  nextActionEditMode = false;
  projectBodyReady = false;
  closeActionMenus();
  document.getElementById("panel-overlay").classList.remove("open");
  document.body.classList.remove("panel-open");
  selectedFile = null;
  render();
}

  const content = document.getElementById("panel-content");

function exitEditMode() {
  editMode = false;
  const editor = document.getElementById("panel-editor");
  const content = document.getElementById("panel-content");
  const actions = document.getElementById("panel-edit-actions");
  const btn = document.getElementById("panel-edit-btn");

  actions.style.display = "none";

}

function selectedProject() {
  return projects.find(project => project.file === selectedFile);
}

function availableBodyAction(project) {
  return (project.actions || []).find(action =>
    action.source === "checklist" && action.available
  ) || null;
}

function legacyNextAction(project) {
  return (project.actions || []).find(action =>
    action.source === "my-next" && action.available
  ) || null;
}

function nextActionForProject(project) {
  return availableBodyAction(project) || legacyNextAction(project);
}

function nextActionText(project) {
  return nextActionForProject(project)?.text || "";
}

function renderProjectNextAction(project) {
  const container = document.getElementById("panel-next-action");
  const action = nextActionForProject(project);
  const text = action?.text || "";

  if (nextActionEditMode) {
    container.innerHTML = `
      <div class="panel-next-action-row">
        <div class="panel-next-action-copy">
          <div class="panel-field-label">Next action</div>
          <input id="panel-next-action-input" type="text"
            value="${esc(text)}" placeholder="Add an action to the document body">
        </div>
        <div class="panel-next-action-buttons">
          <button type="button" id="panel-next-action-cancel">Cancel</button>
          <button type="button" class="primary" id="panel-next-action-save">Save</button>
        </div>
      </div>`;
    document.getElementById("panel-next-action-cancel")
      .addEventListener("click", exitNextActionEditMode);
    document.getElementById("panel-next-action-save")
      .addEventListener("click", saveNextAction);
    const input = document.getElementById("panel-next-action-input");
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveNextAction();
      } else if (event.key === "Escape") {
        event.preventDefault();
        exitNextActionEditMode();
      }
    });
    input.focus();
    input.select();
    return;
  }

  container.innerHTML = `
    <div class="panel-next-action-row">
      <div class="panel-next-action-copy">
        <div class="panel-field-label">Next action</div>
        <div class="panel-next-action-text${text ? "" : " empty"}">
          ${text ? esc(text) : "No available action in the document body"}
        </div>
      </div>
      <div class="panel-next-action-buttons">
        <button type="button" id="panel-next-action-edit"
          ${projectBodyReady ? "" : "disabled"}>${text ? "Edit" : "Add action"}</button>
      </div>
    </div>`;
  document.getElementById("panel-next-action-edit")
    .addEventListener("click", enterNextActionEditMode);
}

function enterNextActionEditMode() {
  const project = selectedProject();
  if (!project || !projectBodyReady) return;
  if (editMode) exitEditMode();
  if (metadataEditMode) exitMetadataEditMode();
  nextActionEditMode = true;
  renderProjectNextAction(project);
}

function exitNextActionEditMode() {
  const project = selectedProject();
  nextActionEditMode = false;
  if (project) renderProjectNextAction(project);
}

async function saveNextAction() {
  const project = selectedProject();
  const input = document.getElementById("panel-next-action-input");
  if (!project || !input) return;
  const text = input.value.trim();
  if (!text) {
    toast("Next action cannot be blank");
    input.focus();
    return;
  }

  const bodyAction = availableBodyAction(project);
  const file = project.file;
  try {
    const res = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        file,
        line: bodyAction?.line ?? null,
        expected_body: originalBody,
        expected_text: bodyAction?.text ?? null,
        text,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Save failed (${res.status})`);
    nextActionEditMode = false;
    await fetchProjects();
    if (projects.some(candidate => candidate.file === file)) {
      await openPanel(file);
    }
    toast(bodyAction ? "Next action updated" : "Action added to document");
    refreshUndoState();
  } catch (error) {
    toast("Error: " + error.message);
  }
}

function metadataField(label, name, value, options = {}) {
  const classes = ["panel-field-edit"];
