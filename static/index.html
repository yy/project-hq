<body>
  <header>
    <div class="header-top">
      <button class="app-home" id="home-btn" type="button" title="Return to Kanban">HQ</button>
      <span class="count" id="total-count"></span>
      <div class="mini-timeline" id="mini-timeline" title="Toggle analysis view"></div>
      <input type="search" class="search-box" id="search-input" placeholder="Search projects ( / )" autocomplete="off" spellcheck="false">
      <div class="view-switch" aria-label="View">
        <button class="view-toggle active" id="board-view-btn" type="button" title="Kanban view (v to toggle)">Kanban</button>
        <button class="view-toggle" id="timeline-view-btn" type="button" title="Analysis view (v to toggle)">Analysis</button>
      </div>
      <button class="header-action" id="undo-btn" type="button" title="Nothing to undo" disabled>↶ Undo</button>
      <button class="header-action" id="new-project-btn">+ New project</button>
    </div>
    <div class="track-filters" id="track-filters"></div>
  </header>

  <div class="modal-overlay" id="new-project-modal">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal">
      <h2>New project</h2>
      <div class="modal-row">
        <label>Track
          <select id="np-track"></select>
        </label>
        <label>Status
          <select id="np-status"></select>
        </label>
      </div>
      <label id="np-new-track-row" style="display:none">New track name
        <input type="text" id="np-new-track" placeholder="lowercase-with-hyphens">
      </label>
      <div class="modal-row">
        <label style="flex:0 0 35%">Owner
          <input type="text" id="np-owner" list="owner-options" autocomplete="off">
        </label>
        <label>Title
          <input type="text" id="np-title">
        </label>
      </div>
      <label>Slug
        <input type="text" id="np-slug" placeholder="auto from title">
      </label>
      <div class="quickadd-preview" id="np-preview"></div>
      <details>
        <summary>More options</summary>
        <div class="modal-row" style="margin-top:8px">
          <label>Priority
            <input type="number" id="np-priority" step="any">
          </label>
          <label>Deadline
            <input type="text" id="np-deadline" placeholder="YYYY-MM-DD">
          </label>
        </div>
        <label style="margin-top:8px">My next
          <input type="text" id="np-my-next">
        </label>
      </details>
      <div class="modal-error" id="np-error"></div>
      <div class="modal-actions">
        <button data-modal-close>Cancel</button>
        <button id="np-submit" class="primary">Create</button>
      </div>
    </div>
  </div>
  <datalist id="owner-options"></datalist>
  <div class="app-workspace">
    <main class="main-workspace">
      <div class="board" id="board"></div>
      <div class="timeline-view hidden" id="timeline-view">
        <div class="timeline-toolbar">
          <div>
            <div class="timeline-title">Project analysis</div>
            <div class="timeline-note" id="timeline-note">Loading history...</div>
          </div>
        </div>
        <div class="timeline-scroller">
          <div class="timeline-plot">
            <div class="timeline-y-axis" id="timeline-y-axis"></div>
            <div class="timeline-chart" id="timeline-chart"></div>
          </div>
          <div class="timeline-axis" id="timeline-axis"></div>
        </div>
        <div class="timeline-legend" id="timeline-legend"></div>
        <div class="analysis-pulses" id="analysis-pulses"></div>
      </div>

      <div class="panel-overlay" id="panel-overlay">
        <div class="panel-backdrop" id="panel-backdrop"></div>
        <div class="panel">
          <div class="panel-header">
            <div class="panel-heading">
              <button class="panel-close" id="panel-close">← Kanban</button>
              <h2 id="panel-title"></h2>
            </div>
            <div class="panel-actions">
              <div class="card-defer-wrap panel-action-wrap" id="panel-move-wrap">
                <button class="panel-btn panel-primary-action" id="panel-move-btn"
                  type="button" aria-haspopup="menu" aria-expanded="false">Move ▾</button>
                <div class="card-defer-menu card-move-menu" id="panel-move-menu" role="menu">
                  <div class="card-move-options" id="panel-move-options"></div>
                </div>
              </div>
              <div class="card-defer-wrap panel-action-wrap" id="panel-defer-wrap">
                <button class="panel-btn panel-primary-action" id="panel-defer-btn"
                  type="button" aria-haspopup="menu" aria-expanded="false">Defer ▾</button>
                <div class="card-defer-menu" role="menu">
                  <div class="card-defer-presets">
                    <button type="button" data-panel-defer-preset="hour">1 hour</button>
                    <button type="button" data-panel-defer-preset="evening">This evening</button>
                    <button type="button" data-panel-defer-preset="tomorrow">Tomorrow</button>
                    <button type="button" data-panel-defer-preset="week">Next week</button>
                    <button type="button" data-panel-defer-preset="month">Next month</button>
                    <button type="button" data-panel-defer-preset="year">Next year</button>
                  </div>
                  <div class="card-defer-custom">
                    <input type="datetime-local" id="panel-defer-custom"
                      aria-label="Custom project defer date and time">
                    <button type="button" id="panel-defer-custom-btn">Set</button>
                  </div>
                </div>
              </div>
              <button class="panel-btn" id="panel-edit-btn" title="Edit project notes">Edit notes</button>
              <div class="card-defer-wrap panel-action-wrap" id="panel-more-wrap">
                <button class="panel-btn" id="panel-more-btn" type="button"
                  aria-haspopup="menu" aria-expanded="false"
                  title="More project actions">More ▾</button>
                <div class="card-defer-menu panel-more-menu" role="menu">
                  <div class="card-move-options">
                    <button type="button" id="panel-metadata-btn">Edit details</button>
                    <a id="panel-obsidian">Open in Obsidian</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="panel-fields" id="panel-fields"></div>
          <div class="panel-body" id="panel-project-view">
            <div id="panel-content"></div>
            <textarea id="panel-editor"></textarea>
            <div class="panel-edit-actions" id="panel-edit-actions">
              <button id="panel-cancel-btn">Cancel</button>
              <button id="panel-save-btn" class="primary">Save</button>
            </div>
          </div>
          <div class="panel-footer" id="panel-file"></div>
        </div>
      </div>
    </main>

    <aside class="agent-workspace agent-view" id="agent-workspace">
      <div class="agent-header">
        <div class="agent-title">Agent</div>
      </div>
      <div class="agent-status" id="agent-status">Checking Codex…</div>
      <div class="agent-transcript" id="agent-transcript"></div>
      <div class="agent-composer">
        <textarea id="agent-input" placeholder="Ask about HQ or request updates across projects…"></textarea>
        <div class="agent-composer-actions">
          <span class="agent-composer-hint">⌘↩ send · edits apply automatically · ⌘Z undo</span>
          <div class="agent-composer-buttons">
            <button id="agent-stop-btn" disabled>Stop</button>
            <button class="primary" id="agent-send-btn" disabled>Send</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

<script>
const TRACK_PALETTE = [
  "#6366f1", "#0891b2", "#ca8a04", "#dc2626", "#059669",
  "#9333ea", "#e11d48", "#2563eb", "#c2410c", "#4f46e5",
  "#475569",
];
const STATUS_COLORS = {
  "my-plate": "#dc2626",
  active: "#f97316",
  waiting: "#2563eb",
  submitted: "#7c3aed",
  done: "#10b981",
  dropped: "#ef4444",
};
const LOAD_STATUSES = new Set(["my-plate", "active", "waiting"]);
const LOAD_STATUS_ORDER = ["my-plate", "active", "waiting"];
const OUTFLOW_STATUSES = new Set(["submitted", "done", "dropped"]);
const OUTFLOW_STATUS_ORDER = ["submitted", "done", "dropped"];

let statuses = [];
let projects = [];
let tracks = [];
let pulseTracks = [];
let defaultOwner = 'yy';
let owners = [];
let activeTrack = null;
let searchQuery = "";
let trackColorMap = {};
let dragFile = null;
let dragSourceStatus = null;
let selectedFile = null;
let didDrag = false;
let editMode = false;
let originalBody = '';
let hqDir = '';
let agentState = null;
let metadataEditMode = false;
let vaultName = '';
let pendingOpenFile = null;
let activeView = 'board';
let timelineData = null;
let timelineLoading = false;
let visibilityTimer = null;
let undoInFlight = false;

function assignTrackColors(tracks) {
  const sorted = [...tracks].sort();
  trackColorMap = {};
  sorted.forEach((t, i) => {
    trackColorMap[t] = TRACK_PALETTE[i % TRACK_PALETTE.length];
  });
}

function renderOwnerOptions() {
  const dl = document.getElementById("owner-options");
  if (!dl) return;
  dl.innerHTML = "";
  for (const o of owners) {
    const opt = document.createElement("option");
    opt.value = o;
    dl.appendChild(opt);
  }
}

async function fetchProjects() {
  const res = await fetch("/api/projects");
  const data = await res.json();
  statuses = data.statuses || statuses;
  projects = data.projects || [];
  scheduleVisibilityRefresh();
  tracks = data.tracks || [...new Set(projects.map(p => p.track))];
  pulseTracks = data.pulse_tracks || [];
  if (data.default_owner) defaultOwner = data.default_owner;
  owners = data.owners || [];
  renderOwnerOptions();
  if (data.hq_dir) {
    hqDir = data.hq_dir;
    vaultName = hqDir.split('/').pop();
  }

  const colorTracks = [...new Set([...tracks, ...projects.map(p => p.track)])];
  assignTrackColors(colorTracks);

  render();
  fetchTimeline();
  refreshUndoState();

  if (pendingOpenFile) {
    const found = projects.find(p => p.file === pendingOpenFile);
    if (found) {
      const file = pendingOpenFile;
      pendingOpenFile = null;
      await openPanel(file);
      enterEditMode();
    }
  }
}

async function refreshUndoState() {
  const button = document.getElementById("undo-btn");
  try {
    const res = await fetch("/api/undo");
    if (!res.ok) throw new Error(`Undo status failed (${res.status})`);
    const status = await res.json();
    button.disabled = undoInFlight || !status.available;
    button.title = status.available && status.label
      ? `Undo ${status.label} (⌘Z)`
      : "Nothing to undo";
  } catch {
    button.disabled = true;
    button.title = "Undo unavailable";
  }
}

function discardAgentState() {
  resetAgentSessionState();
  ensureAgentSession();
}

async function undoLastAction() {
  if (undoInFlight) return;
  const button = document.getElementById("undo-btn");
  if (button.disabled) return;

  const openFile = selectedFile;
  undoInFlight = true;
  button.disabled = true;

  try {
    const res = await fetch("/api/undo", { method: "POST" });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Undo failed (${res.status})`);

    const affected = new Set(data.files || []);
    if (affected.size) discardAgentState();
    await fetchProjects();

    if (openFile && affected.has(openFile)) {
      if (projects.some(project => project.file === openFile)) {
        await openPanel(openFile);
      } else {
        closePanel();
      }
    }
    toast(`Undid ${data.label || "last action"}`);
  } catch (error) {
    toast("Error: " + error.message);
  } finally {
    undoInFlight = false;
    refreshUndoState();
  }
}

function renderFilters() {
  const bar = document.getElementById("track-filters");
  bar.innerHTML = "";

  // Use the config-defined track order (from data.tracks); append any
  // project tracks not listed there so nothing silently disappears.
  const configTracks = tracks || [];
  const extras = [...new Set(projects.map(p => p.track))].filter(t => !configTracks.includes(t)).sort();
  const orderedTracks = [...configTracks, ...extras];

  const allBtn = document.createElement("button");
  allBtn.className = "track-filter" + (activeTrack === null ? " active" : "");
  const allCount = projects.filter(isOpenProject).length;
  allBtn.innerHTML = `All<span class="filter-count">${allCount}</span>`;
  allBtn.addEventListener("click", () => { activeTrack = null; render(); renderMiniTimeline(); });
  bar.appendChild(allBtn);

  for (const track of orderedTracks) {
    const btn = document.createElement("button");
    btn.className = "track-filter" + (activeTrack === track ? " active" : "");
    const color = trackColorMap[track] || "#999";
    const count = projects.filter(p => p.track === track && isOpenProject(p)).length;
    btn.innerHTML = `<span class="filter-dot" style="background:${color}"></span>${esc(track)}<span class="filter-count">${count}</span>`;
    btn.addEventListener("click", () => { activeTrack = track; render(); renderMiniTimeline(); });
    bar.appendChild(btn);
  }
}

async function fetchTimeline() {
  if (timelineLoading) return;
  timelineLoading = true;
  try {
    const res = await fetch("/api/timeline");
    timelineData = await res.json();
    renderTimeline();
    renderMiniTimeline();
  } catch {
    document.getElementById("timeline-note").textContent = "Could not load project history.";
  } finally {
    timelineLoading = false;
  }
}

function setView(view) {
  activeView = view;
  document.getElementById("board").classList.toggle("hidden", view !== "board");
  document.getElementById("timeline-view").classList.toggle("hidden", view !== "timeline");
  document.getElementById("board-view-btn").classList.toggle("active", view === "board");
  document.getElementById("timeline-view-btn").classList.toggle("active", view === "timeline");
  if (selectedFile) closePanel();
  else render();
  if (view === "timeline") fetchTimeline();
}

function visibleTimelineSnapshots() {
  return (timelineData?.snapshots || [])
    .map(snapshot => ({
      ...snapshot,
      projects: (snapshot.projects || [])
        .filter(project => LOAD_STATUSES.has(project.status))
        .filter(project => !activeTrack || project.track === activeTrack),
      outflow: (snapshot.outflow || [])
        .filter(item => OUTFLOW_STATUSES.has(item.status))
        .filter(item => !activeTrack || item.track === activeTrack),
    }))
    .filter(snapshot => snapshot.projects.length > 0 || outflowTotal(snapshot.outflow) > 0);
}

function renderTimeline() {
  const chart = document.getElementById("timeline-chart");
  const yAxis = document.getElementById("timeline-y-axis");
  const axis = document.getElementById("timeline-axis");
  const note = document.getElementById("timeline-note");
  const legend = document.getElementById("timeline-legend");
  const analysisPulses = document.getElementById("analysis-pulses");
  chart.innerHTML = "";
  yAxis.innerHTML = "";
  axis.innerHTML = "";
  axis.style.minWidth = "";
  legend.innerHTML = "";
  if (analysisPulses) analysisPulses.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();

  if (snapshots.length === 0) {
    note.textContent = activeTrack ? `No history for ${activeTrack}.` : "No project history yet.";
    return;
  }

  const maxProjects = Math.max(...snapshots.map(snapshot => snapshot.projects.length));
  const maxOutflow = Math.max(0, ...snapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const source = timelineData?.source === "git_history" ? "Git history" : "current snapshot";
  const scope = activeTrack ? `${activeTrack}, ` : "";
  const cellHeight = timelineCellHeight(maxProjects);
  const cellGap = maxProjects > 150 ? 0 : 1;
  const outflowCellHeight = timelineOutflowCellHeight(maxOutflow);
  chart.style.setProperty("--timeline-cell-height", `${cellHeight}px`);
  chart.style.setProperty("--timeline-gap", `${cellGap}px`);
  chart.style.setProperty("--timeline-outflow-cell-height", `${outflowCellHeight}px`);
  axis.style.minWidth = `${timelineAxisMinWidth(snapshots.length)}px`;
  renderTimelineYAxis(yAxis, maxProjects, maxOutflow);
  renderTimelineAxis(axis, snapshots);
  note.textContent = `${scope}${snapshots.length} snapshots from ${source}; tallest column is ${maxProjects} load projects; largest outflow day is ${maxOutflow}.`;

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "timeline-column";
    const totalOutflow = outflowTotal(snapshot.outflow);
    column.title = `${snapshot.date}: ${snapshot.projects.length} load projects, ${totalOutflow} out`;

    const loadStack = document.createElement("div");
    loadStack.className = "timeline-load-stack";

    for (const project of sortTimelineProjects(snapshot.projects)) {
      const cell = document.createElement("div");
      cell.className = "timeline-cell";
      cell.style.background = timelineColor(project.status, project.age_days);
      cell.title = `${snapshot.date}\n${project.status} · ${project.track}\n${project.title}${project.age_days !== null && project.age_days !== undefined ? `\n${project.age_days} days old` : ""}`;
      loadStack.appendChild(cell);
    }

    const zeroLine = document.createElement("div");
    zeroLine.className = "timeline-zero-line";

    const outflowStack = document.createElement("div");
    outflowStack.className = "timeline-outflow-stack";
    for (const item of sortOutflow(snapshot.outflow)) {
      for (let i = 0; i < item.count; i++) {
        const cell = document.createElement("div");
        cell.className = "timeline-outflow-cell";
        cell.style.background = STATUS_COLORS[item.status] || "#6b7280";
        cell.title = `${snapshot.date}\n${item.status} · ${item.track}`;
        outflowStack.appendChild(cell);
      }
    }

    column.appendChild(loadStack);
    column.appendChild(zeroLine);
    column.appendChild(outflowStack);

    chart.appendChild(column);
  }

  for (const status of LOAD_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)}`;
    legend.appendChild(item);
  }
  for (const status of OUTFLOW_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)} out`;
    legend.appendChild(item);
  }
  renderAnalysisPulses(snapshots);
}

function renderMiniTimeline() {
  const mini = document.getElementById("mini-timeline");
  if (!mini) return;
  mini.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();
  if (snapshots.length === 0) {
    mini.innerHTML = `<div class="mini-timeline-empty">No timeline yet</div>`;
    return;
  }

  const miniSnapshots = miniTimelineSnapshots(snapshots);
  const maxLoad = Math.max(1, ...miniSnapshots.map(snapshot => snapshot.projects.length));
  const intake = intakeCountsForSnapshots(snapshots, miniSnapshots);
  const pipelines = pipelineSeriesForSnapshots(miniSnapshots);
  const pulseScale = Math.max(1, Math.round(maxLoad * 0.25));
  const pipelineScale = pipelineSeriesScale(pipelines);
  mini.appendChild(renderMiniPulseGroup("load", renderPulse(miniSnapshots, maxLoad, "load", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("out", renderPulse(miniSnapshots, pulseScale, "outflow", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("new", renderPulse(intake, pulseScale, "intake", "mini-pulse", 24)));
  for (const { track, series } of pipelines) {
    mini.appendChild(renderMiniPulseGroup(track, renderPulse(series, pipelineScale, pipelineKind(track), "mini-pulse", 24)));
  }
}

// Configured pulse tracks (hq.toml `pulse_tracks`) that exist in the data.
function activePulseTracks() {
  const known = new Set([...(tracks || []), ...projects.map(p => p.track)]);
  return (pulseTracks || []).filter(track => known.has(track));
}

function pipelineSeriesForSnapshots(snapshots) {
  return activePulseTracks().map(track => ({
    track,
    series: pipelineCountsForSnapshots(snapshots, track),
  }));
}

function pipelineSeriesScale(pipelines) {
  return Math.max(1, ...pipelines.flatMap(pipeline => pipeline.series.map(item => item.count)));
}

function pipelineKind(track) {
  return `pipeline:${track}`;
}

function pipelineKindTrack(kind) {
  return kind.startsWith("pipeline:") ? kind.slice("pipeline:".length) : null;
}

function renderMiniPulseGroup(label, pulse) {
  const group = document.createElement("div");
  group.className = "mini-pulse-group";
  const labelEl = document.createElement("div");
  labelEl.className = "mini-pulse-label";
  labelEl.textContent = label;
  group.appendChild(labelEl);
  group.appendChild(pulse);
  return group;
}

function renderAnalysisPulses(snapshots) {
  const container = document.getElementById("analysis-pulses");
  if (!container) return;
  container.innerHTML = "";

  const maxLoad = Math.max(1, ...snapshots.map(snapshot => snapshot.projects.length));
  const intake = intakeCountsForSnapshots(snapshots, snapshots);
  const pipelines = pipelineSeriesForSnapshots(snapshots);
  const outflowScale = Math.max(1, ...snapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const eventScale = Math.max(
    outflowScale,
    1,
    ...intake.map(item => item.count)
  );
  const pipelineScale = pipelineSeriesScale(pipelines);

  const pulseDefs = [
    ["Load", miniPulseTitle("load"), snapshots, maxLoad, "load"],
    ["Out", miniPulseTitle("outflow"), snapshots, eventScale, "outflow"],
    ["New", miniPulseTitle("intake"), intake, eventScale, "intake"],
    ...pipelines.map(({ track, series }) => {
      const kind = pipelineKind(track);
      return [`${track[0].toUpperCase()}${track.slice(1)} submitted`, miniPulseTitle(kind), series, pipelineScale, kind];
    }),
  ];

  for (const [label, title, series, scale, kind] of pulseDefs) {
    container.appendChild(renderAnalysisPulseCard(label, title, series, scale, kind, snapshots));
  }
}

function renderAnalysisPulseCard(label, title, series, scale, kind, axisSnapshots) {
  const card = document.createElement("div");
  card.className = "analysis-pulse-card";
  card.title = title;

  const labelEl = document.createElement("div");
  labelEl.className = "analysis-pulse-label";
  labelEl.textContent = label;

  const body = document.createElement("div");
  body.className = "analysis-pulse-body";
  const yAxis = document.createElement("div");
  yAxis.className = "analysis-pulse-y-axis";
  yAxis.innerHTML = `<span>${esc(formatAxisNumber(scale))}</span><span>${scale > 1 ? esc(formatAxisNumber(Math.round(scale / 2))) : ""}</span><span>0</span>`;

  const pulse = renderPulse(series, scale, kind, "analysis-pulse", 90);
  const xAxis = document.createElement("div");
  xAxis.className = "analysis-pulse-x-axis";
  const firstDate = axisSnapshots[0]?.date || "";
  const lastDate = axisSnapshots[axisSnapshots.length - 1]?.date || "";
  const spanDays = analysisSpanDays(axisSnapshots);
  xAxis.innerHTML = `<span>${esc(formatTimelineAxisDate(firstDate, spanDays))}</span><span>${firstDate === lastDate ? "" : esc(formatTimelineAxisDate(lastDate, spanDays))}</span>`;

  body.appendChild(yAxis);
  body.appendChild(pulse);
  body.appendChild(xAxis);
  card.appendChild(labelEl);
  card.appendChild(body);
  return card;
}

function renderPulse(snapshots, maxCount, kind, className, maxHeight) {
  const pulse = document.createElement("div");
  pulse.className = className;
  pulse.title = miniPulseTitle(kind);

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "mini-column";
    const count = miniPulseCount(snapshot, kind);
    column.title = `${snapshot.date}: ${count} ${miniPulseUnit(kind)}`;

    const stack = document.createElement("div");
    stack.className = "mini-stack";
    const height = count === 0 ? 0 : Math.max(1, Math.round((count / maxCount) * maxHeight));
    stack.style.height = `${height}px`;
    stack.style.setProperty("--mini-dot-height", `${miniDotHeight(count, height)}px`);

    if (kind === "load") {
      for (const status of LOAD_STATUS_ORDER) {
        const statusCount = snapshot.projects.filter(project => project.status === status).length;
        if (statusCount === 0) continue;
        const segment = document.createElement("div");
        segment.className = "mini-segment";
        segment.style.background = STATUS_COLORS[status] || "#6b7280";
        segment.style.setProperty("--mini-segment-height", `${miniSegmentHeight(statusCount, count, height)}px`);
        stack.appendChild(segment);
      }
    } else if (kind === "outflow") {
      for (const item of sortOutflow(snapshot.outflow)) {
        for (let i = 0; i < item.count; i++) {
          const dot = document.createElement("div");
          dot.className = "mini-dot";
          dot.style.background = STATUS_COLORS[item.status] || "#6b7280";
          stack.appendChild(dot);
        }
      }
    } else {
      for (let i = 0; i < snapshot.count; i++) {
        const dot = document.createElement("div");
        dot.className = "mini-dot";
        dot.style.background = miniPulseColor(kind);
        stack.appendChild(dot);
      }
    }

    column.appendChild(stack);
    pulse.appendChild(column);
  }

  return pulse;
}

function miniPulseTitle(kind) {
  if (kind === "load") return "Load over time";
  if (kind === "outflow") return "Submitted/done/dropped over time";
  if (kind === "intake") return "New projects over time";
  const track = pipelineKindTrack(kind);
  return track ? `Submitted ${track} projects over time` : "Projects over time";
}

function miniPulseCount(snapshot, kind) {
  if (kind === "load") return snapshot.projects.length;
  if (kind === "outflow") return outflowTotal(snapshot.outflow);
  return snapshot.count;
}

function miniPulseUnit(kind) {
  if (kind === "load") return "load";
  if (kind === "outflow") return "out";
  if (kind === "intake") return "new";
  const track = pipelineKindTrack(kind);
  return track ? `${track} submitted` : "projects";
}

function miniPulseColor(kind) {
  const track = pipelineKindTrack(kind);
  if (track) return trackColorMap[track] || "#6366f1";
  return "#0891b2";
}

function miniTimelineSnapshots(snapshots) {
  const maxColumns = 14;
  if (snapshots.length <= maxColumns) return snapshots;
  return snapshots.slice(snapshots.length - maxColumns);
}

function intakeCountsForSnapshots(allSnapshots, visibleSnapshots) {
  const firstSeen = new Map();
  for (const snapshot of allSnapshots) {
    for (const project of snapshot.projects) {
      if (!firstSeen.has(project.file)) firstSeen.set(project.file, snapshot.date);
    }
  }
  const counts = new Map();
  for (const date of firstSeen.values()) {
    counts.set(date, (counts.get(date) || 0) + 1);
  }
  return visibleSnapshots.map(snapshot => ({
    date: snapshot.date,
    count: counts.get(snapshot.date) || 0,
  }));
}

function pipelineCountsForSnapshots(snapshots, track) {
  return snapshots.map(snapshot => ({
    date: snapshot.date,
    count: (snapshot.pipeline || [])
      .filter(item => item.track === track && item.status === "submitted")
      .reduce((total, item) => total + item.count, 0),
  }));
}

function dueCountsForSnapshots(snapshots) {
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isDueSoon(project, snapshotDate)).length;
    return { date: snapshot.date, count };
  });
}

function isDueSoon(project, snapshotDate) {
  if (!project.deadline) return false;
  const deadline = parseLocalDate(project.deadline);
  if (Number.isNaN(deadline.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(deadline) - startOfLocalDay(snapshotDate)) / 86400000);
  return days <= 30;
}

function staleCountsForSnapshots(snapshots) {
  const threshold = timelineData?.stale_days ?? 30;
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isStaleProject(project, snapshotDate, threshold)).length;
    return { date: snapshot.date, count };
  });
}

function isStaleProject(project, snapshotDate, threshold) {
  if (project.status !== "waiting" || !project.waiting_since) return false;
  const waitingSince = parseLocalDate(project.waiting_since);
  if (Number.isNaN(waitingSince.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(snapshotDate) - startOfLocalDay(waitingSince)) / 86400000);
  return days > threshold;
}

function miniDotHeight(count, stackHeight) {
  if (count <= 0) return 1;
  return Math.max(1, Math.floor(stackHeight / count));
}

function miniSegmentHeight(count, total, stackHeight) {
  if (count <= 0 || total <= 0) return 0;
  return Math.max(1, Math.round((count / total) * stackHeight));
}

function renderTimelineAxis(axis, snapshots) {
  axis.innerHTML = "";
  const track = document.createElement("div");
  track.className = "timeline-axis-track";
  track.style.width = `${timelineColumnStripWidth(snapshots.length)}px`;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  const spanDays = Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));

  for (const index of timelineAxisTickIndexes(snapshots.length)) {
    const tick = document.createElement("div");
    const isFirst = index === 0;
    const isLast = snapshots.length > 1 && index === snapshots.length - 1;
    tick.className = `timeline-axis-tick${isFirst ? " first" : ""}${isLast ? " last" : ""}`;
    tick.style.left = `${timelineColumnCenter(index)}px`;
    tick.innerHTML = `<span class="timeline-axis-mark"></span><span>${esc(formatTimelineAxisDate(snapshots[index].date, spanDays))}</span>`;
    track.appendChild(tick);
  }

  axis.appendChild(track);
}

function timelineAxisMinWidth(snapshotCount) {
  const yAxisWidth = 44;
  const chartRightPadding = 14;
  return yAxisWidth + chartRightPadding + timelineColumnStripWidth(snapshotCount);
}

function timelineColumnStripWidth(snapshotCount) {
  const columnWidth = 8;
  const columnGap = 2;
  return (snapshotCount * columnWidth) + (Math.max(0, snapshotCount - 1) * columnGap);
}

function timelineColumnCenter(index) {
  const columnWidth = 8;
  const columnGap = 2;
  return (index * (columnWidth + columnGap)) + (columnWidth / 2);
}

function timelineAxisTickIndexes(length) {
  if (length <= 0) return [];
  if (length === 1) return [0];
  const tickCount = Math.min(6, length);
  const indexes = new Set();
  for (let i = 0; i < tickCount; i++) {
    indexes.add(Math.round((i * (length - 1)) / (tickCount - 1)));
  }
  return [...indexes].sort((a, b) => a - b);
}

function formatTimelineAxisDate(dateStr, spanDays) {
  const date = parseLocalDate(dateStr);
  if (Number.isNaN(date.getTime())) return dateStr;
  if (spanDays > 730) return new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" }).format(date);
  if (spanDays > 120) return new Intl.DateTimeFormat(undefined, { month: "short", year: "2-digit" }).format(date);
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date);
}

function analysisSpanDays(snapshots) {
  if (!snapshots.length) return 0;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  if (Number.isNaN(firstDate.getTime()) || Number.isNaN(lastDate.getTime())) return 0;
  return Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));
}

function formatAxisNumber(value) {
  if (value >= 1000) return `${Math.round(value / 100) / 10}k`;
  return String(Math.round(value));
}

function renderTimelineYAxis(yAxis, maxProjects, maxOutflow) {
  const midpoint = Math.round(maxProjects / 2);
  yAxis.innerHTML = `
    <div class="timeline-y-load">
      <span class="timeline-y-label top">${maxProjects}</span>
      <span class="timeline-y-label mid">${midpoint}</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label zero">0</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label bottom">${maxOutflow > 0 ? `-${maxOutflow}` : ""}</span>
    </div>
  `;
}

function sortTimelineProjects(projects) {
  return [...projects].sort((a, b) => {
    const statusDiff = loadStatusRank(a.status) - loadStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track) || a.title.localeCompare(b.title) || a.file.localeCompare(b.file);
  });
}

function loadStatusRank(status) {
  const index = LOAD_STATUS_ORDER.indexOf(status);
  return index === -1 ? LOAD_STATUS_ORDER.length : index;
}

function sortOutflow(outflow) {
  return [...outflow].sort((a, b) => {
    const statusDiff = outflowStatusRank(a.status) - outflowStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track);
  });
}

function outflowStatusRank(status) {
  const index = OUTFLOW_STATUS_ORDER.indexOf(status);
  return index === -1 ? OUTFLOW_STATUS_ORDER.length : index;
}

function outflowTotal(outflow) {
  return outflow.reduce((total, item) => total + item.count, 0);
}

function timelineCellHeight(maxProjects) {
  if (maxProjects <= 0) return 4;
  const availableHeight = 330;
  const gapReserve = maxProjects > 150 ? 0 : Math.max(0, maxProjects - 1);
  return Math.max(1, Math.min(4, Math.floor((availableHeight - gapReserve) / maxProjects)));
}

function timelineOutflowCellHeight(maxOutflow) {
  if (maxOutflow <= 0) return 6;
  const availableHeight = 66;
  const gapReserve = Math.max(0, maxOutflow - 1);
  return Math.max(2, Math.min(8, Math.floor((availableHeight - gapReserve) / maxOutflow)));
}

function timelineColor(status, ageDays) {
  const base = STATUS_COLORS[status] || "#6b7280";
  if (ageDays === null || ageDays === undefined) return base;
  const ageScore = Math.min(Math.max(ageDays / 365, 0), 1);
  return mixHex("#f8fafc", base, 0.72 + ageScore * 0.28);
}

function mixHex(from, to, amount) {
  const a = parseHex(from);
  const b = parseHex(to);
  const mixed = a.map((channel, i) => Math.round(channel + (b[i] - channel) * amount));
  return `rgb(${mixed[0]}, ${mixed[1]}, ${mixed[2]})`;
}

function parseHex(hex) {
  const value = hex.replace("#", "");
  return [
    parseInt(value.slice(0, 2), 16),
    parseInt(value.slice(2, 4), 16),
    parseInt(value.slice(4, 6), 16),
  ];
}

// --- Agent workspace ---

function createAgentState() {
  return {
    available: null,
    runtime: "",
    provider: "",
    model: "",
    threadId: null,
    activeTurnId: null,
    initializing: false,
    busy: false,
    error: "",
    entries: [],
    itemEntries: new Map(),
    queue: [],
    dispatching: false,
    applying: false,
    eventSource: null,
  };
}

function resetAgentSessionState() {
  if (agentState.eventSource) agentState.eventSource.close();
  agentState = createAgentState();
  renderAgentView();
}

async function agentFetch(url, options) {
  const res = await fetch(url, options);
  let data = {};
  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) throw new Error(data.error || `Agent request failed (${res.status})`);
  return data;
}

async function ensureAgentSession() {
  const state = agentState;
  if (state.threadId || state.initializing) return;
  state.initializing = true;
  state.error = "";
  renderAgentView();

  try {
    const runtime = await agentFetch("/api/agent/status");
    state.available = runtime.available;
    state.runtime = runtime.version || "";
    if (!runtime.available) {
      throw new Error(runtime.error || "Codex is unavailable");
    }

    const session = await agentFetch("/api/agent/session", {
      method: "POST",
    });
    state.threadId = session.thread_id;
    state.provider = session.provider;
    state.model = session.model;
    connectAgentEvents(state);
  } catch (error) {
    state.available = false;
    state.error = error.message;
  } finally {
    state.initializing = false;
    renderAgentView();
  }
}

function connectAgentEvents(state) {
  if (state.eventSource) state.eventSource.close();
  const source = new EventSource(
    "/api/agent/events?thread_id=" + encodeURIComponent(state.threadId)
  );
  state.eventSource = source;
  source.addEventListener("agent", event => {
    try {
      handleAgentEvent(JSON.parse(event.data));
    } catch {
      // Ignore malformed or forward-incompatible runtime notifications.
    }
  });
  source.onerror = () => {
    if (state.busy) {
      state.error = "Agent event connection interrupted; reconnecting…";
      renderAgentView();
    }
  };
}

function agentEntryForItem(state, item, kind, defaults = {}) {
  let entry = state.itemEntries.get(item.id);
  if (!entry) {
    entry = { kind, itemId: item.id, ...defaults };
    state.entries.push(entry);
    state.itemEntries.set(item.id, entry);
  }
  return entry;
}

function handleAgentEvent(event) {
  const state = agentState;
  const method = event.method;
  const params = event.params || {};
  const item = params.item || {};
  let continueQueue = false;

  if (method === "item/agentMessage/delta") {
    const entry = agentEntryForItem(
      state,
      { id: params.itemId },
      "agent",
      { text: "", streaming: true }
    );
    entry.text += params.delta || "";
  } else if (method === "item/started") {
    if (item.type === "agentMessage") {
      agentEntryForItem(state, item, "agent", { text: item.text || "", streaming: true });
    }
  } else if (method === "item/completed") {
    if (item.type === "agentMessage") {
      const entry = agentEntryForItem(state, item, "agent", { text: "" });
      entry.text = item.text || entry.text;
      entry.streaming = false;
    }
  } else if (method === "turn/started") {
    state.busy = true;
    state.error = "";
    state.activeTurnId = params.turn?.id || state.activeTurnId;
  } else if (method === "turn/completed") {
    state.busy = false;
    state.activeTurnId = null;
    const status = params.turn?.status;
    if (status === "failed") {
      state.entries.push({
        kind: "notice",
        text: params.turn?.error?.message || "Agent turn failed.",
      });
    } else if (status === "interrupted") {
      state.entries.push({ kind: "notice", text: "Agent stopped." });
    } else {
      autoApplyAgentChange();
    }
    continueQueue = status === "failed" || status === "interrupted";
  } else if (method === "error" || method === "hq/runtimeExited") {
    state.busy = false;
    state.activeTurnId = null;
    state.error = params.message || params.error?.message || "The agent runtime stopped.";
  }

  renderAgentView();
  if (continueQueue) void processAgentQueue();
}

function renderAgentEntry(entry) {
  if (entry.kind === "user") {
    const queued = entry.queued
      ? `<span class="agent-queued-label">Queued</span>`
      : "";
    return `<div class="agent-message user${entry.queued ? " queued" : ""}">${queued}${esc(entry.text)}</div>`;
  }
  if (entry.kind === "agent") {
    const text = entry.text || (entry.streaming ? "…" : "");
    return `<div class="agent-message agent">${marked.parse(text)}</div>`;
  }
  return `<div class="agent-notice">${esc(entry.text || "")}</div>`;
}

function renderAgentView() {
  const state = agentState;
  const status = document.getElementById("agent-status");
  const transcript = document.getElementById("agent-transcript");
  const input = document.getElementById("agent-input");
  const send = document.getElementById("agent-send-btn");
  const stop = document.getElementById("agent-stop-btn");
  const queuedCount = state.queue.length;
  const queueStatus = queuedCount
    ? ` · ${queuedCount} queued`
    : "";

  if (state.initializing) {
    status.textContent = "Preparing an isolated Codex workspace…";
  } else if (state.applying) {
    status.textContent = `Applying agent edits and refreshing HQ…${queueStatus}`;
  } else if (state.error) {
    status.innerHTML = `<strong>Agent unavailable</strong> · ${esc(state.error)}`;
  } else if (state.busy) {
    status.innerHTML = `<strong>Codex working…</strong> · ${esc(state.model)}${queueStatus}`;
  } else if (state.threadId) {
    status.innerHTML = `<strong>Codex</strong> · ${esc(state.model)}${state.runtime ? ` · ${esc(state.runtime)}` : ""}${queueStatus}`;
  } else {
    status.textContent = "Codex agent";
  }

  if (state.entries.length) {
    transcript.innerHTML = state.entries.map(renderAgentEntry).join("");
  } else {
    transcript.innerHTML = `
      <div class="agent-empty">
        Ask about one project or work across the whole portfolio.<br>
        The agent can inspect HQ, use coding tools, and make coordinated project updates.
      </div>`;
  }
  transcript.scrollTop = transcript.scrollHeight;

  input.disabled = !state.threadId;
  send.disabled = !state.threadId || !input.value.trim();
  send.textContent = state.busy || state.applying || state.dispatching ? "Queue" : "Send";
  stop.disabled = !state.busy || !state.activeTurnId;
}

function sendAgentMessage() {
  const state = agentState;
  const input = document.getElementById("agent-input");
  const message = input.value;
  if (!message.trim() || !state.threadId) return;

  input.value = "";
  const entry = { kind: "user", text: message, queued: true };
  state.entries.push(entry);
  state.queue.push({
    message,
    contextFile: selectedFile,
    entry,
  });
  state.error = "";
  renderAgentView();
  input.focus();
  void processAgentQueue();
}

async function processAgentQueue() {
  const state = agentState;
  if (
    !state.threadId ||
    state.busy ||
    state.applying ||
    state.dispatching ||
    !state.queue.length
  ) return;

  const pending = state.queue.shift();
  pending.entry.queued = false;
  state.dispatching = true;
  state.busy = true;
  state.error = "";
  renderAgentView();

  try {
    const turn = await agentFetch("/api/agent/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: pending.message,
        context_file: pending.contextFile,
      }),
    });
    state.activeTurnId = turn.turn_id;
  } catch (error) {
    state.busy = false;
    state.error = error.message;
  } finally {
    state.dispatching = false;
    renderAgentView();
  }
}

async function stopAgentTurn() {
  const state = agentState;
  if (!state.threadId || !state.activeTurnId) return;
  try {
    await agentFetch("/api/agent/interrupt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        thread_id: state.threadId,
        turn_id: state.activeTurnId,
      }),
    });
  } catch (error) {
    state.error = error.message;
    renderAgentView();
  }
}

async function autoApplyAgentChange() {
  const state = agentState;
  const openFile = selectedFile;
  state.applying = true;
  renderAgentView();
  try {
    const change = await agentFetch("/api/agent/change");
    if (!change.changed) return;
    const result = await agentFetch("/api/agent/apply", {
      method: "POST",
    });
    const count = result.files?.length || 0;
    state.entries.push({
      kind: "notice",
      text: `Applied ${count} project file${count === 1 ? "" : "s"}. Undo is available.`,
    });
    await fetchProjects();
    if (openFile && projects.some(project => project.file === openFile)) {
      await openPanel(openFile);
    }
    toast(`Applied ${count} agent update${count === 1 ? "" : "s"}`);
    refreshUndoState();
  } catch (error) {
    state.error = error.message;
  } finally {
    state.applying = false;
    renderAgentView();
    void processAgentQueue();
  }
}

// --- Side panel ---

async function openPanel(file) {
  const p = projects.find(pr => pr.file === file);
  if (!p) return;

  closeActionMenus();
  selectedFile = file;
  metadataEditMode = false;
  render(); // re-render to show selected state on card

  document.getElementById("panel-title").textContent = p.title;
  document.getElementById("panel-file").textContent = p.file;
  renderProjectFields(p);
  renderPanelActionControls(p);

  // Set Obsidian link
  const obsBtn = document.getElementById("panel-obsidian");
  const filePath = file.replace(/\.md$/, '');
  obsBtn.href = `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(filePath)}`;

  // Fetch body content
  const content = document.getElementById("panel-content");
  content.innerHTML = '<span class="panel-body-empty">Loading...</span>';

  try {
    const res = await fetch("/api/project?file=" + encodeURIComponent(file));
    const data = await res.json();
    originalBody = data.body || '';
    renderBody(content, originalBody);
  } catch {
    content.className = "panel-body-empty";
    content.textContent = "Failed to load content.";
  }

  exitEditMode();
  document.getElementById("panel-overlay").classList.add("open");
  document.body.classList.add("panel-open");
}

function closePanel() {
  editMode = false;
  metadataEditMode = false;
  closeActionMenus();
  document.getElementById("panel-overlay").classList.remove("open");
  document.body.classList.remove("panel-open");
  selectedFile = null;
  render();
}

function enterEditMode() {
  if (metadataEditMode) exitMetadataEditMode();
  editMode = true;
  const editor = document.getElementById("panel-editor");
  const content = document.getElementById("panel-content");
  const actions = document.getElementById("panel-edit-actions");
  const btn = document.getElementById("panel-edit-btn");

  editor.value = originalBody;
  content.style.display = "none";
  editor.style.display = "block";
  actions.style.display = "flex";
  btn.textContent = "Editing";
  editor.focus();
}

function exitEditMode() {
  editMode = false;
  const editor = document.getElementById("panel-editor");
  const content = document.getElementById("panel-content");
  const actions = document.getElementById("panel-edit-actions");
  const btn = document.getElementById("panel-edit-btn");

  editor.style.display = "none";
  actions.style.display = "none";
  content.style.display = "block";
  btn.textContent = "Edit notes";
}

function selectedProject() {
  return projects.find(project => project.file === selectedFile);
}

function renderPanelActionControls(project) {
  const moveButton = document.getElementById("panel-move-btn");
  moveButton.setAttribute("aria-label", `Move project from ${statusLabel(project.status)}`);

  const moveOptions = document.getElementById("panel-move-options");
  moveOptions.innerHTML = statuses.map(status => `
    <button type="button" data-panel-move-status="${esc(status)}"
      ${status === project.status ? "disabled" : ""}>${esc(statusLabel(status))}</button>
  `).join("");
  moveOptions.querySelectorAll("[data-panel-move-status]").forEach(button => {
    button.addEventListener("click", async () => {
      const file = selectedFile;
      closeActionMenus();
      if (file) await moveProjectStatus(file, button.dataset.panelMoveStatus);
    });
  });

  document.getElementById("panel-defer-btn")
    .setAttribute("aria-label", `Defer ${project.title}`);
  const now = new Date();
  const defaultDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
  const customInput = document.getElementById("panel-defer-custom");
  customInput.min = formatLocalDateTimeInput(now);
  customInput.value = formatLocalDateTimeInput(defaultDate);
}

function metadataField(label, name, value, options = {}) {
  const classes = ["panel-field-edit"];
  if (options.wide) classes.push("wide");
  const list = options.list ? ` list="${esc(options.list)}"` : "";
  const step = options.step ? ` step="${esc(options.step)}"` : "";
  return `
    <label class="${classes.join(" ")}">
      <div class="panel-field-label">${esc(label)}</div>
      <input data-metadata="${esc(name)}" type="${options.type || "text"}"${list}${step} value="${esc(String(value ?? ""))}">
    </label>`;
}

function metadataSelect(label, name, value, choices) {
  const options = choices.map(([choice, text]) =>
    `<option value="${esc(choice)}"${choice === value ? " selected" : ""}>${esc(text)}</option>`
  ).join("");
  return `
    <label class="panel-field-edit">
      <div class="panel-field-label">${esc(label)}</div>
      <select data-metadata="${esc(name)}">${options}</select>
    </label>`;
}

function renderProjectFields(project) {
  const fields = document.getElementById("panel-fields");
  const button = document.getElementById("panel-metadata-btn");
  fields.innerHTML = "";
  fields.classList.toggle("editing", metadataEditMode);
  button.textContent = metadataEditMode ? "Editing details" : "Edit details";

  if (!metadataEditMode) {
    const fieldDefs = [
      ["Status", project.status],
      ["Track", project.track],
      ["Priority", project.priority],
      ["Owner", project.owner],
      ["Next action", project.my_next && project.my_next !== "(fill in)" ? project.my_next : "", true],
      ["Waiting on", project.waiting_on, true],
      ["Waiting since", project.waiting_since],
      ["Deadline", project.deadline],
      ["Deferred until", project.deferred_until],
      ["Action mode", project.action_mode],
    ];
    for (const [label, value, wide] of fieldDefs) {
      if (!value && value !== 0) continue;
      const div = document.createElement("div");
      div.className = "panel-field" + (wide ? " wide" : "");
      div.innerHTML = `<div class="panel-field-label">${esc(label)}</div><div class="panel-field-value">${esc(String(value))}</div>`;
      fields.appendChild(div);
    }
    return;
  }

  const statusChoices = statuses.map(status => [status, statusLabel(status)]);
  fields.innerHTML = [
    metadataField("Title", "title", project.title, { wide: true }),
    `<div class="panel-field-edit"><div class="panel-field-label">Track</div><div class="panel-field-value">${esc(project.track)}</div></div>`,
    metadataSelect("Status", "status", project.status, statusChoices),
    metadataField("Priority", "priority", project.priority, { type: "number", step: "any" }),
    metadataField("Owner", "owner", project.owner, { list: "owner-options" }),
    metadataField("Next action", "my_next", project.my_next === "(fill in)" ? "" : project.my_next, { wide: true }),
    metadataField("Waiting on", "waiting_on", project.waiting_on, { wide: true }),
    metadataField("Waiting since", "waiting_since", project.waiting_since),
    metadataField("Deadline", "deadline", project.deadline),
    metadataField("Deferred until", "deferred_until", project.deferred_until),
    metadataSelect("Action mode", "action_mode", project.action_mode || "parallel", [
      ["parallel", "Parallel"],
      ["serial", "Serial"],
    ]),
    `<div class="metadata-actions">
      <button type="button" id="metadata-cancel-btn">Cancel</button>
      <button type="button" class="primary" id="metadata-save-btn">Save details</button>
    </div>`,
  ].join("");

  document.getElementById("metadata-cancel-btn").addEventListener("click", exitMetadataEditMode);
  document.getElementById("metadata-save-btn").addEventListener("click", saveMetadata);
}

function enterMetadataEditMode() {
  const project = selectedProject();
  if (!project) return;
  if (editMode) exitEditMode();
  metadataEditMode = true;
  renderProjectFields(project);
  document.querySelector('[data-metadata="title"]')?.focus();
}

function exitMetadataEditMode() {
  const project = selectedProject();
  metadataEditMode = false;
  if (project) renderProjectFields(project);
}

async function saveMetadata() {
  const project = selectedProject();
  if (!project) return;

  const value = name =>
    document.querySelector(`[data-metadata="${name}"]`)?.value.trim() || "";
  const priority = Number(value("priority"));
  if (!value("title")) {
    toast("Title is required");
    return;
  }
  if (!Number.isFinite(priority)) {
    toast("Priority must be a number");
    return;
  }

  const payload = {
    file: project.file,
    title: value("title"),
    status: value("status"),
    priority,
    owner: value("owner"),
    my_next: value("my_next"),
    waiting_on: value("waiting_on"),
    waiting_since: value("waiting_since"),
    deadline: value("deadline"),
    deferred_until: value("deferred_until"),
    action_mode: value("action_mode"),
  };

  try {
    const res = await fetch("/api/metadata", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Save failed (${res.status})`);
    metadataEditMode = false;
    await fetchProjects();
    if (projects.some(candidate => candidate.file === project.file)) {
      await openPanel(project.file);
    }
    toast("Project details saved");
    refreshUndoState();
  } catch (error) {
    toast("Error: " + error.message);
  }
}

const CHECKBOX_LINE_RE = /^\s*[-*+]\s+\[([ xX])\]\s/;

function checkboxLineIndices(body) {
  const indices = [];
  const lines = body.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (CHECKBOX_LINE_RE.test(lines[i])) indices.push(i);
  }
  return indices;
}

function renderBody(content, body) {
  if (!body) {
    content.className = "panel-body-empty";
    content.textContent = "No notes.";
    return;
  }
  content.className = "panel-body-content";
  content.innerHTML = marked.parse(body);

  const lineIndices = checkboxLineIndices(body);
  const inputs = content.querySelectorAll('input[type="checkbox"]');
  inputs.forEach((input, i) => {
    const lineIndex = lineIndices[i];
    if (lineIndex === undefined) return;
    input.disabled = false;
    input.style.cursor = "pointer";
    input.addEventListener("change", () => toggleCheckbox(input, lineIndex));
  });
}

async function toggleCheckbox(input, lineIndex) {
  const file = selectedFile;
  const expected = !input.checked;
  const checked = input.checked;
  input.disabled = true;
  try {
    const res = await fetch("/api/checkbox", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, line: lineIndex, expected, checked }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      input.checked = expected;
      toast("Error: " + (data.error || "Toggle failed"));
      return;
    }
    const lines = originalBody.split('\n');
    lines[lineIndex] = lines[lineIndex].replace(/\[[ xX]\]/, checked ? '[x]' : '[ ]');
    originalBody = lines.join('\n');
    refreshUndoState();
  } catch {
    input.checked = expected;
    toast("Toggle failed");
  } finally {
    input.disabled = false;
  }
}

async function saveBody() {
  const editor = document.getElementById("panel-editor");
  const body = editor.value;

  try {
    const res = await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: selectedFile, body }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast("Error: " + (data.error || "Save failed"));
      return;
    }
    originalBody = body;
    renderBody(document.getElementById("panel-content"), originalBody);
    exitEditMode();
    toast("Saved");
    refreshUndoState();
  } catch {
    toast("Save failed");
  }
}

document.getElementById("panel-edit-btn").addEventListener("click", () => {
  if (editMode) exitEditMode();
  else enterEditMode();
});
document.getElementById("panel-metadata-btn").addEventListener("click", () => {
  closeActionMenus();
  if (metadataEditMode) exitMetadataEditMode();

// --- Drag-and-drop helpers ---

function getDropIndex(body, y) {
  const cards = [...body.querySelectorAll(".card")];
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (y < mid) return i;
  }
  return cards.length;
}

function clearIndicators(body) {
  body.querySelectorAll(".drop-indicator").forEach(el => el.remove());
}

function showIndicator(body, index) {
  clearIndicators(body);
  const indicator = document.createElement("div");
  indicator.className = "drop-indicator";
  const cards = [...body.querySelectorAll(".card")];
  if (index < cards.length) {
    body.insertBefore(indicator, cards[index]);
  } else {
    body.appendChild(indicator);
  }
}

function matchesSearch(p) {
  if (!searchQuery) return true;
  const haystack = [p.title, p.track, p.owner, p.my_next, p.waiting_on, p.last, p.file]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
  return searchQuery.toLowerCase().split(/\s+/).filter(Boolean)
    .every(term => haystack.includes(term));
}

function isProjectVisible(project) {
  return project.visible !== false;
}

function boardStatus(project) {
  if (project.status === "submitted") return "waiting";
  if (project.status === "dropped") return "done";
  return project.status;
}

function statusLabel(status) {
  return status.split("-").map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
}

function getColumnItems(status) {
  const items = projects
    .filter(p => boardStatus(p) === status)
    .filter(isProjectVisible)
    .filter(p => !activeTrack || p.track === activeTrack)
    .filter(matchesSearch);
  items.sort((a, b) => b.priority - a.priority);
  return items;
}

const TERMINAL_STATUSES = new Set(["done", "dropped"]);

function isOpenProject(project) {
  return !TERMINAL_STATUSES.has(project.status);
}

function moveStatusForDrop(project, targetStatus) {
  return boardStatus(project) === targetStatus ? project.status : targetStatus;
}

async function moveProjectStatus(file, toStatus) {
  const project = projects.find(project => project.file === file);
  if (!project || project.status === toStatus) return;

  const refreshOpenPanel = selectedFile === file;
  const previousStatus = project.status;
  project.status = toStatus;
  if (refreshOpenPanel) {
    renderProjectFields(project);
    renderPanelActionControls(project);
  }
  render();

  try {
    const res = await fetch("/api/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, to_status: toStatus }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Move failed (${res.status})`);
    toast(`Moved to ${statusLabel(toStatus)}`);
    await fetchProjects();
    if (refreshOpenPanel && selectedFile === file
        && projects.some(candidate => candidate.file === file)) {
      await openPanel(file);
    }
  } catch (error) {
    project.status = previousStatus;
    if (refreshOpenPanel) {
      renderProjectFields(project);
      renderPanelActionControls(project);
    }
    render();
    toast("Error: " + error.message);
  }
}

function computePriority(items, dropIndex, draggedFile) {
  const originalIndex = items.findIndex(p => p.file === draggedFile);
  const adjustedIndex = originalIndex !== -1 && originalIndex < dropIndex ? dropIndex - 1 : dropIndex;
  // Remove the dragged card from the list after adjusting the DOM-based drop index.
  const others = items.filter(p => p.file !== draggedFile);
  // above = card that will be above the drop position (higher priority)
  const above = others[adjustedIndex - 1];
  // below = card that will be below the drop position (lower priority)
  const below = others[adjustedIndex];

  if (above && below) {
    return (above.priority + below.priority) / 2;
  }
  if (above) return above.priority - 10;
  if (below) return below.priority + 10;
  return 50; // empty column
}

async function handleDrop(targetStatus, dropIndex) {
  if (!dragFile) return;

  const sameColumn = dragSourceStatus === targetStatus;
  const draggedProject = projects.find(project => project.file === dragFile);
  if (!draggedProject) return;
  const payload = {
    file: dragFile,
    to_status: moveStatusForDrop(draggedProject, targetStatus),
  };

  if (sameColumn) {
    // Reorder: compute new priority based on neighbors
    const items = getColumnItems(targetStatus);
    payload.priority = computePriority(items, dropIndex, dragFile);
  }
  // Cross-column: keep existing priority, just change status

  const res = await fetch("/api/move", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });

  if (!res.ok) {
    const data = await res.json();
    toast("Error: " + (data.error || "Unknown"));
    return;
  }

  if (!sameColumn) toast("Moved to " + targetStatus);
  fetchProjects();
}

// --- Deferral ---

function padDatePart(value) {
  return String(value).padStart(2, "0");
}

function formatLocalDate(date) {
  return `${date.getFullYear()}-${padDatePart(date.getMonth() + 1)}-${padDatePart(date.getDate())}`;
}

function formatLocalDateTimeInput(date) {
  return `${formatLocalDate(date)}T${padDatePart(date.getHours())}:${padDatePart(date.getMinutes())}`;
}

function addCalendarMonths(date, months) {
  const result = new Date(date);
  const day = result.getDate();
  result.setDate(1);
  result.setMonth(result.getMonth() + months);
  const finalDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
  result.setDate(Math.min(day, finalDay));
  return result;
}

function deferUntilForPreset(preset, now = new Date()) {
  if (preset === "hour") {
    return new Date(now.getTime() + 60 * 60 * 1000).toISOString();
  }
  if (preset === "evening") {
    const evening = new Date(now);
    evening.setHours(18, 0, 0, 0);
    if (evening <= now) evening.setDate(evening.getDate() + 1);
    return evening.toISOString();
  }

  const date = new Date(now);
  if (preset === "tomorrow") date.setDate(date.getDate() + 1);
  else if (preset === "week") date.setDate(date.getDate() + 7);
  else if (preset === "month") return formatLocalDate(addCalendarMonths(date, 1));
  else if (preset === "year") return formatLocalDate(addCalendarMonths(date, 12));
  else return null;
  return formatLocalDate(date);
}

function deferredWakeTime(value) {
  if (!value) return null;
  const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  const date = dateOnly
    ? new Date(Number(dateOnly[1]), Number(dateOnly[2]) - 1, Number(dateOnly[3]))
    : new Date(value);
  return Number.isNaN(date.getTime()) ? null : date.getTime();
}

function scheduleVisibilityRefresh() {
  clearTimeout(visibilityTimer);
  visibilityTimer = null;

  const now = Date.now();
  const nextWake = projects
    .filter(project => project.visible === false)
    .map(project => deferredWakeTime(project.deferred_until))
    .filter(time => time !== null && time > now)
    .sort((a, b) => a - b)[0];
  if (nextWake === undefined) return;

  const oneDay = 24 * 60 * 60 * 1000;
  visibilityTimer = setTimeout(fetchProjects, Math.min(nextWake - now + 50, oneDay));
}

const DEFER_LABELS = {
  hour: "for 1 hour",
  evening: "until this evening",
  tomorrow: "until tomorrow",
  week: "until next week",
  month: "until next month",
  year: "until next year",
};

async function applyDeferral(file, until, label) {
  const project = projects.find(p => p.file === file);
  if (!file || !project || !until) return;

  project.deferred_until = until;
  project.visible = false;
  render();

  try {
    const res = await fetch("/api/defer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, until }),
    });
    let data = {};
    try { data = await res.json(); } catch { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `Defer failed (${res.status})`);
    toast(`Deferred ${label}`);
    await fetchProjects();
  } catch (error) {
    project.visible = true;
    render();
    toast("Error: " + error.message);
  }
}

function slugify(s) {
  let out = "";
  let prevDash = true;
  // NFKD-decompose and drop combining marks so "Café" -> "cafe" (matches server).
  const folded = (s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  for (const ch of folded) {
    const lower = ch.toLowerCase();
    if (/[a-z0-9]/.test(lower)) {
      out += lower;
      prevDash = false;
    } else if (!prevDash) {
      out += "-";
      prevDash = true;
    }
  }
  return out.replace(/-+$/, "");
}

async function createProject(payload) {
  const res = await fetch("/api/projects", {

  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) {
    const err = new Error(data.error || `Create failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

}

async function submitModal() {
  const errorEl = document.getElementById("np-error");
  errorEl.textContent = "";
  const submitBtn = document.getElementById("np-submit");

  let track = document.getElementById("np-track").value;
  const isNewTrack = track === "__new__";
  if (isNewTrack) {
    track = document.getElementById("np-new-track").value.trim();
    if (!track) { errorEl.textContent = "Track name required"; return; }
  }
  const title = document.getElementById("np-title").value.trim();
  if (!title) { errorEl.textContent = "Title required"; return; }
  const owner = document.getElementById("np-owner").value.trim() || defaultOwner;
  const slug = document.getElementById("np-slug").value.trim();
  const status = document.getElementById("np-status").value;
  const priorityRaw = document.getElementById("np-priority").value;
  const deadline = document.getElementById("np-deadline").value.trim();
  const myNext = document.getElementById("np-my-next").value.trim();

  const payload = { track, title, owner, status };
  if (slug) payload.slug = slug;
  if (priorityRaw !== "") {
    const n = Number(priorityRaw);
    if (Number.isFinite(n)) payload.priority = n;
  }
  if (deadline) payload.deadline = deadline;
  if (myNext) payload.my_next = myNext;
  if (isNewTrack) payload.create_track = true;

  submitBtn.disabled = true;
  try {
    const data = await createProject(payload);
    pendingOpenFile = data.file;
    closeModal();
    await fetchProjects();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
}

  if (
    e.key.toLowerCase() === "z" &&
    (e.metaKey || e.ctrlKey) &&
    !e.shiftKey &&
    !e.altKey &&
    !typing
  ) {
    e.preventDefault();
    undoLastAction();
    return;
  }
  const focusSearch =
    (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) ||
    (e.key === "f" && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey);

// --- Render ---

function render() {
  renderFilters();

  const board = document.getElementById("board");
  board.innerHTML = "";

  const visible = (activeTrack ? projects.filter(p => p.track === activeTrack) : projects)
    .filter(isProjectVisible)
    .filter(matchesSearch);
  const nonTerminal = visible.filter(isOpenProject);
  const label = (activeTrack ? activeTrack : "active") + (searchQuery ? " matching" : "");
  document.getElementById("total-count").textContent = nonTerminal.length + " " + label;

  for (const status of statuses.filter(status => !["submitted", "dropped"].includes(status))) {
    const rendered = getColumnItems(status);
    const mergedStatus = status === "waiting"
      ? "submitted"
      : status === "done"
        ? "dropped"
        : null;
    const mergedCount = mergedStatus
      ? rendered.filter(project => project.status === mergedStatus).length
      : 0;

    const col = document.createElement("div");
    col.className = "column";
    col.dataset.status = status;

    col.innerHTML = `
      <div class="column-header">
        <span class="dot"></span>
        ${status}
        <span class="badge">${rendered.length}${mergedCount ? ` · ${mergedCount} ${mergedStatus}` : ""}</span>
      </div>
    `;

    const body = document.createElement("div");
    body.className = "column-body";
    body.dataset.status = status;

    body.addEventListener("dragover", e => {
      e.preventDefault();
      if (dragSourceStatus === status) {
        // Same column: show precise drop indicator
        clearIndicators(body);
        body.classList.remove("drag-over");
        const idx = getDropIndex(body, e.clientY);
        showIndicator(body, idx);
      } else {
        // Cross column: highlight whole column
        clearIndicators(body);
        body.classList.add("drag-over");
      }
    });

    body.addEventListener("dragleave", e => {
      if (!body.contains(e.relatedTarget)) {
        clearIndicators(body);
        body.classList.remove("drag-over");
      }
    });

    body.addEventListener("drop", e => {
      e.preventDefault();
      clearIndicators(body);
      body.classList.remove("drag-over");
      const idx = getDropIndex(body, e.clientY);
      handleDrop(status, idx);
    });

    if (rendered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = searchQuery ? "No matches" : "No projects";
      body.appendChild(empty);
    }

    for (const p of rendered) {
      const color = trackColorMap[p.track] || "#999";
      const dimmed = activeTrack && p.track !== activeTrack;

      const card = document.createElement("div");
      card.className = "card" + (dimmed ? " dimmed" : "") + (selectedFile === p.file ? " selected" : "");
      card.style.borderLeftColor = color;
      card.draggable = !dimmed;
      card.dataset.file = p.file;

      card.addEventListener("mousedown", () => { didDrag = false; });

      card.addEventListener("dragstart", e => {
        didDrag = true;
        dragFile = p.file;
        dragSourceStatus = boardStatus(p);
        e.dataTransfer.setData("text/plain", p.file);
        e.dataTransfer.effectAllowed = "move";
        requestAnimationFrame(() => card.classList.add("dragging"));
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        dragFile = null;
        dragSourceStatus = null;
        document.querySelectorAll(".drop-indicator").forEach(el => el.remove());
      });

      card.addEventListener("click", () => {
        if (!didDrag) openPanel(p.file);
      });

      let meta = "";
      if (p.my_next && p.my_next !== "(fill in)") {
        meta += `<span>\u2192 ${esc(p.my_next)}</span>`;
      }
      if (p.waiting_on) {
        const days = p.waiting_since ? daysSince(p.waiting_since) : null;
        const dayStr = days !== null ? ` (${days}d)` : "";
        meta += `<span>Waiting on ${esc(p.waiting_on)}${dayStr}</span>`;
      }
      if (p.deadline) {
        meta += `<span class="deadline">Due ${esc(p.deadline)}</span>`;
      }
      if (p.status === "submitted") {
        meta += `<span class="submitted">Submitted</span>`;
      }
      if (p.deferred_until) {
        meta += `<span>Deferred until ${esc(p.deferred_until)}</span>`;
      }

      const customNow = new Date();
      const customDefault = new Date(customNow.getTime() + 24 * 60 * 60 * 1000);
      const moveControl = `
        <div class="card-defer-wrap card-move-wrap" data-card-move>
          <button type="button" class="card-defer card-status" aria-haspopup="menu"
            aria-expanded="false"
            aria-label="Change status from ${esc(statusLabel(p.status))}"
            style="color:${STATUS_COLORS[p.status] || "var(--text-secondary)"}">
            ${esc(statusLabel(p.status))} ▾
          </button>
          <div class="card-defer-menu card-move-menu" role="menu">
            <div class="card-move-options">
              ${statuses.map(status => `
                <button type="button" data-move-status="${esc(status)}"
                  ${status === p.status ? "disabled" : ""}>${esc(statusLabel(status))}</button>
              `).join("")}
            </div>
          </div>
        </div>`;
      const deferControl = `
        <div class="card-defer-wrap" data-card-defer>
            <button type="button" class="card-defer" aria-haspopup="menu"
              aria-expanded="false">Defer</button>
            <div class="card-defer-menu" role="menu">
              <div class="card-defer-presets">
                <button type="button" data-defer-preset="hour">1 hour</button>
                <button type="button" data-defer-preset="evening">This evening</button>
                <button type="button" data-defer-preset="tomorrow">Tomorrow</button>
                <button type="button" data-defer-preset="week">Next week</button>
                <button type="button" data-defer-preset="month">Next month</button>
                <button type="button" data-defer-preset="year">Next year</button>
              </div>
              <div class="card-defer-custom">
                <input type="datetime-local" aria-label="Custom defer date and time"
                  min="${formatLocalDateTimeInput(customNow)}"
                  value="${formatLocalDateTimeInput(customDefault)}">
                <button type="button" data-defer-custom>Set</button>
              </div>
            </div>
        </div>`;

      card.innerHTML = `
        <div class="card-top">
          <div class="card-track" style="color:${color}">${esc(p.track)}</div>
          ${moveControl}
        </div>
        <div class="card-title">${esc(p.title)}</div>
        ${meta ? `<div class="card-meta">${meta}</div>` : ""}
        <div class="card-footer">
          ${isOpenProject(p) ? deferControl : ""}
        </div>
      `;

      card.querySelectorAll(".card-defer-wrap").forEach(actionWrap => {
        actionWrap.addEventListener("mousedown", e => e.stopPropagation());
        actionWrap.addEventListener("click", e => e.stopPropagation());
        const actionButton = actionWrap.querySelector("[aria-haspopup='menu']");
        actionButton.addEventListener("click", () => {
          const shouldOpen = !actionWrap.classList.contains("open");
          closeActionMenus(actionWrap);
          actionWrap.classList.toggle("open", shouldOpen);
          actionButton.setAttribute("aria-expanded", String(shouldOpen));
        });
      });

      const moveWrap = card.querySelector("[data-card-move]");
      moveWrap.querySelectorAll("[data-move-status]").forEach(button => {
        button.addEventListener("click", () => {
          moveProjectStatus(p.file, button.dataset.moveStatus);
        });
      });

      const deferWrap = card.querySelector("[data-card-defer]");
      if (deferWrap) {
        deferWrap.querySelectorAll("[data-defer-preset]").forEach(button => {
          button.addEventListener("click", () => {
            const preset = button.dataset.deferPreset;
            applyDeferral(p.file, deferUntilForPreset(preset), DEFER_LABELS[preset]);
          });
        });
        const customInput = deferWrap.querySelector('input[type="datetime-local"]');
        const customButton = deferWrap.querySelector("[data-defer-custom]");
        const submitCustom = () => {
          const customDate = new Date(customInput.value);
          if (!customInput.value || Number.isNaN(customDate.getTime()) || customDate <= new Date()) {
            toast("Choose a future date and time");
            customInput.focus();
            return;
          }
          applyDeferral(p.file, customDate.toISOString(), `until ${customDate.toLocaleString()}`);
        };
        customButton.addEventListener("click", submitCustom);
        customInput.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitCustom();
          }
        });
      }

      body.appendChild(card);
    }

    if (!TERMINAL_STATUSES.has(status)) {
      const addBtn = document.createElement("button");
      addBtn.className = "column-add";
      addBtn.textContent = "+ New";
      addBtn.addEventListener("click", () => {
        if (activeTrack) {
          showQuickAdd(body, status);
        } else {
          openModal(status);
        }
      });
      body.appendChild(addBtn);
    }

    col.appendChild(body);
    board.appendChild(col);
  }

  if (activeView === "timeline" && timelineData) renderTimeline();
  if (timelineData) renderMiniTimeline();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2000);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function parseLocalDate(dateStr) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!match) return new Date(dateStr);
  const [, year, month, day] = match;
  return new Date(Number(year), Number(month) - 1, Number(day));
}

function startOfLocalDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function daysSince(dateStr) {
  const d = parseLocalDate(dateStr);
  if (Number.isNaN(d.getTime())) return null;
  const today = startOfLocalDay(new Date());
  const days = Math.floor((today - d) / 86400000);
  return days >= 0 ? days : null;
}

// SSE live reload
function connectSSE() {
  const es = new EventSource("/api/events");
  es.onmessage = () => fetchProjects();
  es.onerror = () => {
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

agentState = createAgentState();
fetchProjects();
ensureAgentSession();
connectSSE();
</script>
