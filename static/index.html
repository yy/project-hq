<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #fff;
    --border: #e5e5e5;
    --text: #1a1a1a;
    --text-secondary: #666;
    --text-tertiary: #999;
    --accent: #2563eb;
    --col-active: #059669;
    --col-waiting: #d97706;
    --col-submitted: #7c3aed;
    --col-deferred: #6b7280;
    --col-done: #10b981;
    --col-dropped: #ef4444;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --panel-width: 520px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 20px 28px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .count {
    font-size: 13px;
    color: var(--text-tertiary);
    font-weight: 400;
  }

  .track-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    padding-bottom: 0;
  }

  .track-filter {
    position: relative;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    margin-bottom: -1px;
  }

  .track-filter:hover {
    color: var(--text-secondary);
  }

  .track-filter.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .track-filter .filter-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
    position: relative;
    top: -0.5px;
  }

  .track-filter .filter-count {
    color: var(--text-tertiary);
    font-weight: 400;
    margin-left: 3px;
    font-size: 11px;
  }

  .mini-timeline {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
    cursor: pointer;
    overflow: hidden;
  }

  .mini-timeline.hidden {
    display: none;
  }

  .mini-pulse-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }

  .mini-pulse-group + .mini-pulse-group {
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }

  .mini-pulse-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .mini-pulse {
    width: 58px;
    height: 30px;
    padding: 2px 3px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
  }

  .mini-timeline-empty {
    width: 216px;
    height: 28px;
    color: var(--text-tertiary);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mini-column {
    flex: 0 0 2px;
    width: 2px;
    height: 100%;
    display: flex;
    align-items: flex-end;
  }

  .mini-stack {
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    gap: 0;
    overflow: hidden;
  }

  .mini-dot,
  .mini-segment {
    width: 2px;
    height: var(--mini-dot-height, 1px);
    min-height: 1px;
  }

  .mini-segment {
    height: var(--mini-segment-height, 1px);
  }

  .board {
    display: flex;
    gap: 12px;
    padding: 20px 28px;
    overflow-x: auto;
    min-height: calc(100vh - 100px);
    align-items: stretch;
  }

  .board.hidden,
  .timeline-view.hidden {
    display: none;
  }

  .view-switch {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    background: var(--surface);
  }

  .view-toggle {
    height: 26px;
    padding: 0 10px;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  .view-toggle:last-child {
    border-right: none;
  }

  .view-toggle:hover {
    background: var(--bg);
    color: var(--text);
  }

  .view-toggle.active {
    background: var(--text);
    color: #fff;
  }

  .timeline-view {
    padding: 20px 28px 28px;
    min-height: calc(100vh - 100px);
  }

  .timeline-toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }

  .timeline-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .timeline-note {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .timeline-scroller {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .timeline-plot {
    display: flex;
    align-items: stretch;
  }

  .timeline-y-axis {
    flex: 0 0 44px;
    padding: 14px 8px 14px 12px;
    display: grid;
    grid-template-rows: 1fr 1px 72px;
    color: var(--text-tertiary);
    font-size: 11px;
    text-align: right;
  }

  .timeline-y-load,
  .timeline-y-outflow {
    position: relative;
  }

  .timeline-y-label {
    position: absolute;
    right: 0;
    transform: translateY(50%);
    line-height: 1;
  }

  .timeline-y-label.top { top: 0; transform: translateY(-10%); }
  .timeline-y-label.mid { top: 50%; }
  .timeline-y-label.zero { top: 0; transform: translateY(-50%); }
  .timeline-y-label.bottom { bottom: 0; transform: translateY(50%); }

  .timeline-chart {
    flex: 1;
    height: 430px;
    padding: 14px 14px 14px 0;
    display: flex;
    align-items: stretch;
    gap: 2px;
  }

  .timeline-column {
    flex: 0 0 8px;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr 1px 72px;
  }

  .timeline-load-stack {
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    gap: var(--timeline-gap, 1px);
    align-self: end;
  }

  .timeline-zero-line {
    background: var(--border);
  }

  .timeline-outflow-stack {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 1px;
  }

  .timeline-cell,
  .timeline-outflow-cell {
    width: 8px;
    border-radius: 1px;
    min-height: 1px;
  }

  .timeline-cell {
    height: var(--timeline-cell-height, 4px);
  }

  .timeline-outflow-cell {
    height: var(--timeline-outflow-cell-height, 6px);
  }

  .timeline-axis {
    height: 34px;
    padding: 0 14px 10px 44px;
    border-top: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .timeline-axis-track {
    position: relative;
    height: 100%;
    width: max-content;
  }

  .timeline-axis-tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .timeline-axis-tick.first {
    transform: translateX(0);
    align-items: flex-start;
  }

  .timeline-axis-tick.last {
    transform: translateX(-100%);
    align-items: flex-end;
  }

  .timeline-axis-mark {
    width: 1px;
    height: 6px;
    background: var(--border);
  }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 12px;
    color: var(--text-secondary);
    font-size: 12px;
  }

  .timeline-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .timeline-legend-swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .analysis-pulses {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  .analysis-pulse-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    padding: 10px 12px 12px;
  }

  .analysis-pulse-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .analysis-pulse-body {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    grid-template-rows: 96px 18px;
    gap: 3px 8px;
  }

  .analysis-pulse-y-axis {
    grid-row: 1;
    color: var(--text-tertiary);
    font-size: 10px;
    line-height: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2px 0 0;
    font-variant-numeric: tabular-nums;
  }

  .analysis-pulse {
    grid-column: 2;
    height: 96px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow: hidden;
    padding-top: 2px;
  }

  .analysis-pulse .mini-column {
    flex: 1 1 4px;
    min-width: 3px;
  }

  .analysis-pulse-x-axis {
    grid-column: 2;
    border-top: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 10px;
    line-height: 1;
    display: flex;
    justify-content: space-between;
    padding-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  .column {
    flex: 0 0 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
  }

  .column-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }

  .column-header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .column-header .badge {
    font-weight: 500;
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .column[data-status="active"] .dot { background: var(--col-active, #6b7280); }
  .column[data-status="waiting"] .dot { background: var(--col-waiting, #6b7280); }
  .column[data-status="submitted"] .dot { background: var(--col-submitted, #6b7280); }
  .column[data-status="deferred"] .dot { background: var(--col-deferred, #6b7280); }
  .column[data-status="done"] .dot { background: var(--col-done, #6b7280); }
  .column[data-status="dropped"] .dot { background: var(--col-dropped, #6b7280); }

  .column-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 60px;
    flex: 1;
    padding: 4px;
    border-radius: var(--radius);
    transition: background 0.15s;
  }

  .column-body.drag-over {
    background: rgba(37, 99, 235, 0.1);
    outline: 2px dashed rgba(37, 99, 235, 0.3);
    outline-offset: -2px;
    border-radius: var(--radius);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: grab;
    transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    box-shadow: var(--shadow);
    border-left: 3px solid var(--border);
  }

  .card:hover {
    border-color: #ccc;
  }

  .card.dragging {
    opacity: 0.4;
  }

  .card.dimmed {
    opacity: 0.15;
    pointer-events: none;
  }

  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  body.panel-open .card:not(.selected) {
    opacity: 0.35;
    transition: opacity 0.2s;
  }

  body.panel-open .card.selected {
    box-shadow: 0 0 0 1px var(--accent), 0 2px 12px rgba(37, 99, 235, 0.15);
  }

  .drop-indicator {
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
    margin: -1px 4px;
    pointer-events: none;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .card-track {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .card-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    line-height: 1.5;
  }

  .card-meta span {
    display: block;
  }

  .card-meta .deadline {
    color: var(--col-waiting);
    font-weight: 500;
  }

  /* --- Side panel --- */

  .panel-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
  }

  .panel-overlay.open {
    display: block;
  }

  .panel-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.08);
  }

  .panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: var(--panel-width);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 24px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }

  .panel-overlay.open .panel {
    transform: translateX(0);
  }

  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 20px 20px 0;
    gap: 12px;
  }

  .panel-header h2 {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .panel-close {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    border-radius: 4px;
    font-size: 18px;
    line-height: 1;
  }

  .panel-close:hover {
    background: var(--bg);
    color: var(--text);
  }

  .panel-fields {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
  }

  .panel-field {
    min-width: 100px;
  }

  .panel-field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
    margin-bottom: 2px;
  }

  .panel-field-value {
    font-size: 13px;
    color: var(--text);
  }

  .panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .panel-body-content {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
    word-wrap: break-word;
  }

  .panel-body-content h1,
  .panel-body-content h2,
  .panel-body-content h3 {
    color: var(--text);
    margin: 16px 0 6px;
    line-height: 1.3;
  }

  .panel-body-content h1 { font-size: 16px; }
  .panel-body-content h2 { font-size: 14px; }
  .panel-body-content h3 { font-size: 13px; }

  .panel-body-content p { margin: 0 0 10px; }

  .panel-body-content ul,
  .panel-body-content ol {
    margin: 0 0 10px;
    padding-left: 20px;
  }

  .panel-body-content li { margin-bottom: 3px; }

  .panel-body-content code {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 12px;
    background: var(--bg);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .panel-body-content pre {
    background: var(--bg);
    padding: 10px;
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 0 0 10px;
  }

  .panel-body-content pre code {
    background: none;
    padding: 0;
  }

  .panel-body-content a {
    color: var(--accent);
    text-decoration: none;
  }

  .panel-body-content a:hover { text-decoration: underline; }

  .panel-body-content blockquote {
    border-left: 3px solid var(--border);
    padding-left: 12px;
    color: var(--text-tertiary);
    margin: 0 0 10px;
  }

  .panel-body-empty {
    font-size: 13px;
    color: var(--text-tertiary);
    font-style: italic;
  }

  .panel-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .panel-btn {
    height: 28px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .panel-btn:hover {
    background: var(--bg);
    color: var(--text);
  }

  #panel-editor {
    display: none;
    width: 100%;
    flex: 1;
    min-height: 200px;
    resize: none;
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    color: var(--text);
    background: var(--surface);
    outline: none;
  }

  #panel-editor:focus {
    border-color: var(--accent);
  }

  .panel-edit-actions {
    display: none;
    gap: 8px;
    justify-content: flex-end;
    padding-top: 8px;
  }

  .panel-edit-actions button {
    height: 28px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .panel-edit-actions button:hover {
    background: var(--bg);
  }

  .panel-edit-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .panel-edit-actions button.primary:hover {
    opacity: 0.9;
  }

  .panel-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "SF Mono", "Menlo", monospace;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text);
    color: #fff;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show { opacity: 1; }

  .empty-state {
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 16px 4px;
    text-align: center;
    font-style: italic;
  }

  /* --- New project / track UI --- */

  .header-action {
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  .header-action:hover {
    background: var(--bg);
    color: var(--text);
    border-color: #ccc;
  }

  .column-add {
    margin-top: 4px;
    width: 100%;
    padding: 6px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-tertiary);
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
  }

  .column-add:hover {
    background: var(--surface);
    color: var(--text-secondary);
    border-color: #ccc;
  }

  .quickadd-form {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }

  .quickadd-form input {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }

  .quickadd-form input:focus {
    border-color: var(--accent);
  }

  .quickadd-row {
    display: flex;
    gap: 6px;
  }

  .quickadd-row .quickadd-owner {
    flex: 0 0 30%;
  }

  .quickadd-row .quickadd-title {
    flex: 1;
  }

  .quickadd-preview {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "SF Mono", "Menlo", monospace;
    min-height: 14px;
  }

  .quickadd-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .quickadd-actions button {
    height: 24px;
    padding: 0 10px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .quickadd-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.18);
  }

  .modal {
    position: relative;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    width: 480px;
    max-width: calc(100vw - 32px);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal h2 {
    font-size: 15px;
    font-weight: 600;
  }

  .modal label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
  }

  .modal input,
  .modal select,
  .modal textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    background: var(--surface);
    text-transform: none;
    font-weight: 400;
    letter-spacing: normal;
    outline: none;
  }

  .modal input:focus,
  .modal select:focus,
  .modal textarea:focus {
    border-color: var(--accent);
  }

  .modal-row {
    display: flex;
    gap: 12px;
  }

  .modal-row label {
    flex: 1;
  }

  .modal details {
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .modal details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    user-select: none;
  }

  .modal details[open] summary {
    margin-bottom: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-actions button {
    height: 30px;
    padding: 0 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .modal-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-error {
    color: var(--col-dropped);
    font-size: 12px;
    min-height: 14px;
  }
</style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>HQ</h1>
      <span class="count" id="total-count"></span>
      <div class="mini-timeline" id="mini-timeline" title="Open analysis view"></div>
      <div class="view-switch" aria-label="View">
        <button class="view-toggle active" id="board-view-btn" type="button">Kanban</button>
        <button class="view-toggle" id="timeline-view-btn" type="button">Analysis</button>
      </div>
      <button class="header-action" id="new-project-btn">+ New project</button>
    </div>
    <div class="track-filters" id="track-filters"></div>
  </header>

  <div class="modal-overlay" id="new-project-modal">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal">
      <h2>New project</h2>
      <div class="modal-row">
        <label>Track
          <select id="np-track"></select>
        </label>
        <label>Status
          <select id="np-status"></select>
        </label>
      </div>
      <label id="np-new-track-row" style="display:none">New track name
        <input type="text" id="np-new-track" placeholder="lowercase-with-hyphens">
      </label>
      <div class="modal-row">
        <label style="flex:0 0 35%">Owner
          <input type="text" id="np-owner" list="owner-options" autocomplete="off">
        </label>
        <label>Title
          <input type="text" id="np-title">
        </label>
      </div>
      <label>Slug
        <input type="text" id="np-slug" placeholder="auto from title">
      </label>
      <div class="quickadd-preview" id="np-preview"></div>
      <details>
        <summary>More options</summary>
        <div class="modal-row" style="margin-top:8px">
          <label>Priority
            <input type="number" id="np-priority" step="any">
          </label>
          <label>Deadline
            <input type="text" id="np-deadline" placeholder="YYYY-MM-DD">

      </details>
      <div class="modal-error" id="np-error"></div>

        <button data-modal-close>Cancel</button>
        <button id="np-submit" class="primary">Create</button>
      </div>
    </div>
  </div>
  <datalist id="owner-options"></datalist>
  <div class="board" id="board"></div>
  <div class="timeline-view hidden" id="timeline-view">
    <div class="timeline-toolbar">
      <div>
        <div class="timeline-title">Project analysis</div>
        <div class="timeline-note" id="timeline-note">Loading history...</div>
      </div>
    </div>
    <div class="timeline-scroller">
      <div class="timeline-plot">
        <div class="timeline-y-axis" id="timeline-y-axis"></div>
        <div class="timeline-chart" id="timeline-chart"></div>
      </div>
      <div class="timeline-axis" id="timeline-axis"></div>
    </div>
    <div class="timeline-legend" id="timeline-legend"></div>
    <div class="analysis-pulses" id="analysis-pulses"></div>
  </div>

  <div class="panel-overlay" id="panel-overlay">
    <div class="panel-backdrop" id="panel-backdrop"></div>
    <div class="panel">
      <div class="panel-header">
        <h2 id="panel-title"></h2>
        <div class="panel-actions">
          <a class="panel-btn" id="panel-obsidian" title="Open in Obsidian">Obsidian</a>
          <button class="panel-btn" id="panel-edit-btn" title="Edit">Edit</button>
          <button class="panel-close" id="panel-close">&times;</button>
        </div>
      </div>
      <div class="panel-fields" id="panel-fields"></div>
      <div class="panel-body">
        <div id="panel-content"></div>
        <textarea id="panel-editor"></textarea>
        <div class="panel-edit-actions" id="panel-edit-actions">
          <button id="panel-cancel-btn">Cancel</button>
          <button id="panel-save-btn" class="primary">Save</button>
        </div>
      </div>
      <div class="panel-footer" id="panel-file"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const TRACK_PALETTE = [
  "#6366f1", "#0891b2", "#ca8a04", "#dc2626", "#059669",
  "#9333ea", "#e11d48", "#2563eb", "#c2410c", "#4f46e5",
];
const STATUS_COLORS = {
  "my-plate": "#dc2626",
  active: "#f97316",
  waiting: "#2563eb",
  submitted: "#7c3aed",
  deferred: "#6b7280",
  done: "#10b981",
  dropped: "#ef4444",
};
const LOAD_STATUSES = new Set(["my-plate", "active", "waiting", "deferred"]);
const LOAD_STATUS_ORDER = ["my-plate", "active", "waiting", "deferred"];
const OUTFLOW_STATUSES = new Set(["submitted", "done", "dropped"]);
const OUTFLOW_STATUS_ORDER = ["submitted", "done", "dropped"];

let statuses = [];
let projects = [];
let tracks = [];
let defaultOwner = 'yy';
let owners = [];
let activeTrack = null;
let trackColorMap = {};
let dragFile = null;
let dragSourceStatus = null;
let selectedFile = null;
let didDrag = false;
let editMode = false;
let originalBody = '';
let hqDir = '';
let vaultName = '';
let pendingOpenFile = null;
let activeView = 'board';
let timelineData = null;
let timelineLoading = false;

function assignTrackColors(tracks) {
  const sorted = [...tracks].sort();
  trackColorMap = {};
  sorted.forEach((t, i) => {
    trackColorMap[t] = TRACK_PALETTE[i % TRACK_PALETTE.length];
  });
}

function renderOwnerOptions() {
  const dl = document.getElementById("owner-options");
  if (!dl) return;
  dl.innerHTML = "";
  for (const o of owners) {
    const opt = document.createElement("option");
    opt.value = o;
    dl.appendChild(opt);
  }
}

async function fetchProjects() {
  const res = await fetch("/api/projects");
  const data = await res.json();
  statuses = data.statuses || statuses;
  projects = data.projects || [];
  tracks = data.tracks || [...new Set(projects.map(p => p.track))];
  if (data.default_owner) defaultOwner = data.default_owner;
  owners = data.owners || [];
  renderOwnerOptions();
  if (data.hq_dir) {
    hqDir = data.hq_dir;
    vaultName = hqDir.split('/').pop();
  }

  const colorTracks = [...new Set([...tracks, ...projects.map(p => p.track)])];
  assignTrackColors(colorTracks);

  render();
  fetchTimeline();

  if (pendingOpenFile) {
    const found = projects.find(p => p.file === pendingOpenFile);
    if (found) {
      const file = pendingOpenFile;
      pendingOpenFile = null;
      await openPanel(file);
      enterEditMode();
    }
  }
}

function renderFilters() {
  const bar = document.getElementById("track-filters");
  bar.innerHTML = "";

  const tracks = [...new Set(projects.map(p => p.track))].sort();

  const allBtn = document.createElement("button");
  allBtn.className = "track-filter" + (activeTrack === null ? " active" : "");
  const allCount = projects.filter(isOpenProject).length;
  allBtn.innerHTML = `All<span class="filter-count">${allCount}</span>`;
  allBtn.addEventListener("click", () => { activeTrack = null; render(); renderMiniTimeline(); });
  bar.appendChild(allBtn);

  for (const track of tracks) {
    const btn = document.createElement("button");
    btn.className = "track-filter" + (activeTrack === track ? " active" : "");
    const color = trackColorMap[track] || "#999";
    const count = projects.filter(p => p.track === track && isOpenProject(p)).length;
    btn.innerHTML = `<span class="filter-dot" style="background:${color}"></span>${esc(track)}<span class="filter-count">${count}</span>`;
    btn.addEventListener("click", () => { activeTrack = track; render(); renderMiniTimeline(); });
    bar.appendChild(btn);
  }
}

async function fetchTimeline() {
  if (timelineLoading) return;
  timelineLoading = true;
  try {
    const res = await fetch("/api/timeline");
    timelineData = await res.json();
    renderTimeline();
    renderMiniTimeline();
  } catch {
    document.getElementById("timeline-note").textContent = "Could not load project history.";
  } finally {
    timelineLoading = false;
  }
}

function setView(view) {
  activeView = view;
  document.getElementById("board").classList.toggle("hidden", view !== "board");
  document.getElementById("timeline-view").classList.toggle("hidden", view !== "timeline");
  document.getElementById("board-view-btn").classList.toggle("active", view === "board");
  document.getElementById("timeline-view-btn").classList.toggle("active", view === "timeline");
  render();
  if (view === "timeline") fetchTimeline();
}

function visibleTimelineSnapshots() {
  return (timelineData?.snapshots || [])
    .map(snapshot => ({
      ...snapshot,
      projects: (snapshot.projects || [])
        .filter(project => LOAD_STATUSES.has(project.status))
        .filter(project => !activeTrack || project.track === activeTrack),
      outflow: (snapshot.outflow || [])
        .filter(item => OUTFLOW_STATUSES.has(item.status))
        .filter(item => !activeTrack || item.track === activeTrack),
    }))
    .filter(snapshot => snapshot.projects.length > 0 || outflowTotal(snapshot.outflow) > 0);
}

function renderTimeline() {
  const chart = document.getElementById("timeline-chart");
  const yAxis = document.getElementById("timeline-y-axis");
  const axis = document.getElementById("timeline-axis");
  const note = document.getElementById("timeline-note");
  const legend = document.getElementById("timeline-legend");
  const analysisPulses = document.getElementById("analysis-pulses");
  chart.innerHTML = "";
  yAxis.innerHTML = "";
  axis.innerHTML = "";
  axis.style.minWidth = "";
  legend.innerHTML = "";
  if (analysisPulses) analysisPulses.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();

  if (snapshots.length === 0) {
    note.textContent = activeTrack ? `No history for ${activeTrack}.` : "No project history yet.";
    return;
  }

  const maxProjects = Math.max(...snapshots.map(snapshot => snapshot.projects.length));
  const maxOutflow = Math.max(0, ...snapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const source = timelineData?.source === "git_history" ? "Git history" : "current snapshot";
  const scope = activeTrack ? `${activeTrack}, ` : "";
  const cellHeight = timelineCellHeight(maxProjects);
  const cellGap = maxProjects > 150 ? 0 : 1;
  const outflowCellHeight = timelineOutflowCellHeight(maxOutflow);
  chart.style.setProperty("--timeline-cell-height", `${cellHeight}px`);
  chart.style.setProperty("--timeline-gap", `${cellGap}px`);
  chart.style.setProperty("--timeline-outflow-cell-height", `${outflowCellHeight}px`);
  axis.style.minWidth = `${timelineAxisMinWidth(snapshots.length)}px`;
  renderTimelineYAxis(yAxis, maxProjects, maxOutflow);
  renderTimelineAxis(axis, snapshots);
  note.textContent = `${scope}${snapshots.length} snapshots from ${source}; tallest column is ${maxProjects} load projects; largest outflow day is ${maxOutflow}.`;

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "timeline-column";
    const totalOutflow = outflowTotal(snapshot.outflow);
    column.title = `${snapshot.date}: ${snapshot.projects.length} load projects, ${totalOutflow} out`;

    const loadStack = document.createElement("div");
    loadStack.className = "timeline-load-stack";

    for (const project of sortTimelineProjects(snapshot.projects)) {
      const cell = document.createElement("div");
      cell.className = "timeline-cell";
      cell.style.background = timelineColor(project.status, project.age_days);
      cell.title = `${snapshot.date}\n${project.status} · ${project.track}\n${project.title}${project.age_days !== null && project.age_days !== undefined ? `\n${project.age_days} days old` : ""}`;
      loadStack.appendChild(cell);
    }

    const zeroLine = document.createElement("div");
    zeroLine.className = "timeline-zero-line";

    const outflowStack = document.createElement("div");
    outflowStack.className = "timeline-outflow-stack";
    for (const item of sortOutflow(snapshot.outflow)) {
      for (let i = 0; i < item.count; i++) {
        const cell = document.createElement("div");
        cell.className = "timeline-outflow-cell";
        cell.style.background = STATUS_COLORS[item.status] || "#6b7280";
        cell.title = `${snapshot.date}\n${item.status} · ${item.track}`;
        outflowStack.appendChild(cell);
      }
    }

    column.appendChild(loadStack);
    column.appendChild(zeroLine);
    column.appendChild(outflowStack);

    chart.appendChild(column);
  }

  for (const status of LOAD_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)}`;
    legend.appendChild(item);
  }
  for (const status of OUTFLOW_STATUS_ORDER.filter(status => statuses.includes(status))) {
    const color = STATUS_COLORS[status] || "#6b7280";
    const item = document.createElement("div");
    item.className = "timeline-legend-item";
    item.innerHTML = `<span class="timeline-legend-swatch" style="background:${color}"></span>${esc(status)} out`;
    legend.appendChild(item);
  }
  renderAnalysisPulses(snapshots);
}

function renderMiniTimeline() {
  const mini = document.getElementById("mini-timeline");
  if (!mini) return;
  mini.innerHTML = "";

  const snapshots = visibleTimelineSnapshots();
  if (snapshots.length === 0) {
    mini.innerHTML = `<div class="mini-timeline-empty">No timeline yet</div>`;
    return;
  }

  const miniSnapshots = miniTimelineSnapshots(snapshots);
  const maxLoad = Math.max(1, ...miniSnapshots.map(snapshot => snapshot.projects.length));
  const intake = intakeCountsForSnapshots(snapshots, miniSnapshots);
  const researchPipeline = pipelineCountsForSnapshots(miniSnapshots, "research");
  const fundingPipeline = pipelineCountsForSnapshots(miniSnapshots, "funding");
  const pulseScale = Math.max(1, Math.round(maxLoad * 0.25));
  const pipelineScale = Math.max(
    1,
    ...researchPipeline.map(item => item.count),
    ...fundingPipeline.map(item => item.count)
  );
  mini.appendChild(renderMiniPulseGroup("load", renderPulse(miniSnapshots, maxLoad, "load", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("out", renderPulse(miniSnapshots, pulseScale, "outflow", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("new", renderPulse(intake, pulseScale, "intake", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("research", renderPulse(researchPipeline, pipelineScale, "researchPipeline", "mini-pulse", 24)));
  mini.appendChild(renderMiniPulseGroup("funding", renderPulse(fundingPipeline, pipelineScale, "fundingPipeline", "mini-pulse", 24)));
}

function renderMiniPulseGroup(label, pulse) {
  const group = document.createElement("div");
  group.className = "mini-pulse-group";
  const labelEl = document.createElement("div");
  labelEl.className = "mini-pulse-label";
  labelEl.textContent = label;
  group.appendChild(labelEl);
  group.appendChild(pulse);
  return group;
}

function renderAnalysisPulses(snapshots) {
  const container = document.getElementById("analysis-pulses");
  if (!container) return;
  container.innerHTML = "";

  const maxLoad = Math.max(1, ...snapshots.map(snapshot => snapshot.projects.length));
  const intake = intakeCountsForSnapshots(snapshots, snapshots);
  const researchPipeline = pipelineCountsForSnapshots(snapshots, "research");
  const fundingPipeline = pipelineCountsForSnapshots(snapshots, "funding");
  const outflowScale = Math.max(1, ...snapshots.map(snapshot => outflowTotal(snapshot.outflow)));
  const eventScale = Math.max(
    outflowScale,
    1,
    ...intake.map(item => item.count)
  );
  const pipelineScale = Math.max(
    1,
    ...researchPipeline.map(item => item.count),
    ...fundingPipeline.map(item => item.count)
  );

  const pulseDefs = [
    ["Load", miniPulseTitle("load"), snapshots, maxLoad, "load"],
    ["Out", miniPulseTitle("outflow"), snapshots, eventScale, "outflow"],
    ["New", miniPulseTitle("intake"), intake, eventScale, "intake"],
    ["Research submitted", miniPulseTitle("researchPipeline"), researchPipeline, pipelineScale, "researchPipeline"],
    ["Funding submitted", miniPulseTitle("fundingPipeline"), fundingPipeline, pipelineScale, "fundingPipeline"],
  ];

  for (const [label, title, series, scale, kind] of pulseDefs) {
    container.appendChild(renderAnalysisPulseCard(label, title, series, scale, kind, snapshots));
  }
}

function renderAnalysisPulseCard(label, title, series, scale, kind, axisSnapshots) {
  const card = document.createElement("div");
  card.className = "analysis-pulse-card";
  card.title = title;

  const labelEl = document.createElement("div");
  labelEl.className = "analysis-pulse-label";
  labelEl.textContent = label;

  const body = document.createElement("div");
  body.className = "analysis-pulse-body";
  const yAxis = document.createElement("div");
  yAxis.className = "analysis-pulse-y-axis";
  yAxis.innerHTML = `<span>${esc(formatAxisNumber(scale))}</span><span>${scale > 1 ? esc(formatAxisNumber(Math.round(scale / 2))) : ""}</span><span>0</span>`;

  const pulse = renderPulse(series, scale, kind, "analysis-pulse", 90);
  const xAxis = document.createElement("div");
  xAxis.className = "analysis-pulse-x-axis";
  const firstDate = axisSnapshots[0]?.date || "";
  const lastDate = axisSnapshots[axisSnapshots.length - 1]?.date || "";
  const spanDays = analysisSpanDays(axisSnapshots);
  xAxis.innerHTML = `<span>${esc(formatTimelineAxisDate(firstDate, spanDays))}</span><span>${firstDate === lastDate ? "" : esc(formatTimelineAxisDate(lastDate, spanDays))}</span>`;

  body.appendChild(yAxis);
  body.appendChild(pulse);
  body.appendChild(xAxis);
  card.appendChild(labelEl);
  card.appendChild(body);
  return card;
}

function renderPulse(snapshots, maxCount, kind, className, maxHeight) {
  const pulse = document.createElement("div");
  pulse.className = className;
  pulse.title = miniPulseTitle(kind);

  for (const snapshot of snapshots) {
    const column = document.createElement("div");
    column.className = "mini-column";
    const count = miniPulseCount(snapshot, kind);
    column.title = `${snapshot.date}: ${count} ${miniPulseUnit(kind)}`;

    const stack = document.createElement("div");
    stack.className = "mini-stack";
    const height = count === 0 ? 0 : Math.max(1, Math.round((count / maxCount) * maxHeight));
    stack.style.height = `${height}px`;
    stack.style.setProperty("--mini-dot-height", `${miniDotHeight(count, height)}px`);

    if (kind === "load") {
      for (const status of LOAD_STATUS_ORDER) {
        const statusCount = snapshot.projects.filter(project => project.status === status).length;
        if (statusCount === 0) continue;
        const segment = document.createElement("div");
        segment.className = "mini-segment";
        segment.style.background = STATUS_COLORS[status] || "#6b7280";
        segment.style.setProperty("--mini-segment-height", `${miniSegmentHeight(statusCount, count, height)}px`);
        stack.appendChild(segment);
      }
    } else if (kind === "outflow") {
      for (const item of sortOutflow(snapshot.outflow)) {
        for (let i = 0; i < item.count; i++) {
          const dot = document.createElement("div");
          dot.className = "mini-dot";
          dot.style.background = STATUS_COLORS[item.status] || "#6b7280";
          stack.appendChild(dot);
        }
      }
    } else {
      for (let i = 0; i < snapshot.count; i++) {
        const dot = document.createElement("div");
        dot.className = "mini-dot";
        dot.style.background = miniPulseColor(kind);
        stack.appendChild(dot);
      }
    }

    column.appendChild(stack);
    pulse.appendChild(column);
  }

  return pulse;
}

function miniPulseTitle(kind) {
  if (kind === "load") return "Load over time";
  if (kind === "outflow") return "Submitted/done/dropped over time";
  if (kind === "intake") return "New projects over time";
  if (kind === "researchPipeline") return "Submitted research projects over time";
  return "Submitted funding projects over time";
}

function miniPulseCount(snapshot, kind) {
  if (kind === "load") return snapshot.projects.length;
  if (kind === "outflow") return outflowTotal(snapshot.outflow);
  return snapshot.count;
}

function miniPulseUnit(kind) {
  if (kind === "load") return "load";
  if (kind === "outflow") return "out";
  if (kind === "intake") return "new";
  if (kind === "researchPipeline") return "research submitted";
  return "funding submitted";
}

function miniPulseColor(kind) {
  if (kind === "researchPipeline") return "#dc2626";
  if (kind === "fundingPipeline") return "#6366f1";
  return "#0891b2";
}

function miniTimelineSnapshots(snapshots) {
  const maxColumns = 14;
  if (snapshots.length <= maxColumns) return snapshots;
  return snapshots.slice(snapshots.length - maxColumns);
}

function intakeCountsForSnapshots(allSnapshots, visibleSnapshots) {
  const firstSeen = new Map();
  for (const snapshot of allSnapshots) {
    for (const project of snapshot.projects) {
      if (!firstSeen.has(project.file)) firstSeen.set(project.file, snapshot.date);
    }
  }
  const counts = new Map();
  for (const date of firstSeen.values()) {
    counts.set(date, (counts.get(date) || 0) + 1);
  }
  return visibleSnapshots.map(snapshot => ({
    date: snapshot.date,
    count: counts.get(snapshot.date) || 0,
  }));
}

function pipelineCountsForSnapshots(snapshots, track) {
  return snapshots.map(snapshot => ({
    date: snapshot.date,
    count: (snapshot.pipeline || [])
      .filter(item => item.track === track && item.status === "submitted")
      .reduce((total, item) => total + item.count, 0),
  }));
}

function dueCountsForSnapshots(snapshots) {
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isDueSoon(project, snapshotDate)).length;
    return { date: snapshot.date, count };
  });
}

function isDueSoon(project, snapshotDate) {
  if (!project.deadline) return false;
  const deadline = parseLocalDate(project.deadline);
  if (Number.isNaN(deadline.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(deadline) - startOfLocalDay(snapshotDate)) / 86400000);
  return days <= 30;
}

function staleCountsForSnapshots(snapshots) {
  const threshold = timelineData?.stale_days ?? 30;
  return snapshots.map(snapshot => {
    const snapshotDate = parseLocalDate(snapshot.date);
    const count = snapshot.projects.filter(project => isStaleProject(project, snapshotDate, threshold)).length;
    return { date: snapshot.date, count };
  });
}

function isStaleProject(project, snapshotDate, threshold) {
  if (project.status !== "waiting" || !project.waiting_since) return false;
  const waitingSince = parseLocalDate(project.waiting_since);
  if (Number.isNaN(waitingSince.getTime()) || Number.isNaN(snapshotDate.getTime())) return false;
  const days = Math.floor((startOfLocalDay(snapshotDate) - startOfLocalDay(waitingSince)) / 86400000);
  return days > threshold;
}

function miniDotHeight(count, stackHeight) {
  if (count <= 0) return 1;
  return Math.max(1, Math.floor(stackHeight / count));
}

function miniSegmentHeight(count, total, stackHeight) {
  if (count <= 0 || total <= 0) return 0;
  return Math.max(1, Math.round((count / total) * stackHeight));
}

function renderTimelineAxis(axis, snapshots) {
  axis.innerHTML = "";
  const track = document.createElement("div");
  track.className = "timeline-axis-track";
  track.style.width = `${timelineColumnStripWidth(snapshots.length)}px`;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  const spanDays = Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));

  for (const index of timelineAxisTickIndexes(snapshots.length)) {
    const tick = document.createElement("div");
    const isFirst = index === 0;
    const isLast = snapshots.length > 1 && index === snapshots.length - 1;
    tick.className = `timeline-axis-tick${isFirst ? " first" : ""}${isLast ? " last" : ""}`;
    tick.style.left = `${timelineColumnCenter(index)}px`;
    tick.innerHTML = `<span class="timeline-axis-mark"></span><span>${esc(formatTimelineAxisDate(snapshots[index].date, spanDays))}</span>`;
    track.appendChild(tick);
  }

  axis.appendChild(track);
}

function timelineAxisMinWidth(snapshotCount) {
  const yAxisWidth = 44;
  const chartRightPadding = 14;
  return yAxisWidth + chartRightPadding + timelineColumnStripWidth(snapshotCount);
}

function timelineColumnStripWidth(snapshotCount) {
  const columnWidth = 8;
  const columnGap = 2;
  return (snapshotCount * columnWidth) + (Math.max(0, snapshotCount - 1) * columnGap);
}

function timelineColumnCenter(index) {
  const columnWidth = 8;
  const columnGap = 2;
  return (index * (columnWidth + columnGap)) + (columnWidth / 2);
}

function timelineAxisTickIndexes(length) {
  if (length <= 0) return [];
  if (length === 1) return [0];
  const tickCount = Math.min(6, length);
  const indexes = new Set();
  for (let i = 0; i < tickCount; i++) {
    indexes.add(Math.round((i * (length - 1)) / (tickCount - 1)));
  }
  return [...indexes].sort((a, b) => a - b);
}

function formatTimelineAxisDate(dateStr, spanDays) {
  const date = parseLocalDate(dateStr);
  if (Number.isNaN(date.getTime())) return dateStr;
  if (spanDays > 730) return new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" }).format(date);
  if (spanDays > 120) return new Intl.DateTimeFormat(undefined, { month: "short", year: "2-digit" }).format(date);
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date);
}

function analysisSpanDays(snapshots) {
  if (!snapshots.length) return 0;
  const firstDate = parseLocalDate(snapshots[0].date);
  const lastDate = parseLocalDate(snapshots[snapshots.length - 1].date);
  if (Number.isNaN(firstDate.getTime()) || Number.isNaN(lastDate.getTime())) return 0;
  return Math.max(0, Math.round((startOfLocalDay(lastDate) - startOfLocalDay(firstDate)) / 86400000));
}

function formatAxisNumber(value) {
  if (value >= 1000) return `${Math.round(value / 100) / 10}k`;
  return String(Math.round(value));
}

function renderTimelineYAxis(yAxis, maxProjects, maxOutflow) {
  const midpoint = Math.round(maxProjects / 2);
  yAxis.innerHTML = `
    <div class="timeline-y-load">
      <span class="timeline-y-label top">${maxProjects}</span>
      <span class="timeline-y-label mid">${midpoint}</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label zero">0</span>
    </div>
    <div class="timeline-y-outflow">
      <span class="timeline-y-label bottom">${maxOutflow > 0 ? `-${maxOutflow}` : ""}</span>
    </div>
  `;
}

function sortTimelineProjects(projects) {
  return [...projects].sort((a, b) => {
    const statusDiff = loadStatusRank(a.status) - loadStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track) || a.title.localeCompare(b.title) || a.file.localeCompare(b.file);
  });
}

function loadStatusRank(status) {
  const index = LOAD_STATUS_ORDER.indexOf(status);
  return index === -1 ? LOAD_STATUS_ORDER.length : index;
}

function sortOutflow(outflow) {
  return [...outflow].sort((a, b) => {
    const statusDiff = outflowStatusRank(a.status) - outflowStatusRank(b.status);
    if (statusDiff !== 0) return statusDiff;
    return a.track.localeCompare(b.track);
  });
}

function outflowStatusRank(status) {
  const index = OUTFLOW_STATUS_ORDER.indexOf(status);
  return index === -1 ? OUTFLOW_STATUS_ORDER.length : index;
}

function outflowTotal(outflow) {
  return outflow.reduce((total, item) => total + item.count, 0);
}

function timelineCellHeight(maxProjects) {
  if (maxProjects <= 0) return 4;
  const availableHeight = 330;
  const gapReserve = maxProjects > 150 ? 0 : Math.max(0, maxProjects - 1);
  return Math.max(1, Math.min(4, Math.floor((availableHeight - gapReserve) / maxProjects)));
}

function timelineOutflowCellHeight(maxOutflow) {
  if (maxOutflow <= 0) return 6;
  const availableHeight = 66;
  const gapReserve = Math.max(0, maxOutflow - 1);
  return Math.max(2, Math.min(8, Math.floor((availableHeight - gapReserve) / maxOutflow)));
}

function timelineColor(status, ageDays) {
  const base = STATUS_COLORS[status] || "#6b7280";
  if (ageDays === null || ageDays === undefined) return base;
  const ageScore = Math.min(Math.max(ageDays / 365, 0), 1);
  return mixHex("#f8fafc", base, 0.72 + ageScore * 0.28);
}

function mixHex(from, to, amount) {
  const a = parseHex(from);
  const b = parseHex(to);
  const mixed = a.map((channel, i) => Math.round(channel + (b[i] - channel) * amount));
  return `rgb(${mixed[0]}, ${mixed[1]}, ${mixed[2]})`;
}

function parseHex(hex) {
  const value = hex.replace("#", "");
  return [
    parseInt(value.slice(0, 2), 16),
    parseInt(value.slice(2, 4), 16),
    parseInt(value.slice(4, 6), 16),
  ];
}

async function openPanel(file) {
  const p = projects.find(pr => pr.file === file);
  if (!p) return;

  selectedFile = file;
  render(); // re-render to show selected state on card

  document.getElementById("panel-title").textContent = p.title;
  document.getElementById("panel-file").textContent = p.file;

  // Build fields
  const fields = document.getElementById("panel-fields");
  fields.innerHTML = "";
  const fieldDefs = [
    ["Status", p.status],
    ["Track", p.track],
    ["Priority", p.priority],
    ["Owner", p.owner],
    ["Next action", p.my_next && p.my_next !== "(fill in)" ? p.my_next : ""],
    ["Waiting on", p.waiting_on],
    ["Deadline", p.deadline],
    ["Deferred until", p.deferred_until],
  ];
  for (const [label, value] of fieldDefs) {
    if (!value && value !== 0) continue;
    const div = document.createElement("div");
    div.className = "panel-field";
    div.innerHTML = `<div class="panel-field-label">${esc(label)}</div><div class="panel-field-value">${esc(String(value))}</div>`;
    fields.appendChild(div);
  }

  // Set Obsidian link
  const obsBtn = document.getElementById("panel-obsidian");
  const filePath = file.replace(/\.md$/, '');
  obsBtn.href = `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(filePath)}`;

  // Fetch body content
  const content = document.getElementById("panel-content");
  content.innerHTML = '<span class="panel-body-empty">Loading...</span>';

  try {
    const res = await fetch("/api/project?file=" + encodeURIComponent(file));
    const data = await res.json();
    originalBody = data.body || '';
    renderBody(content, originalBody);
  } catch {
    content.className = "panel-body-empty";
    content.textContent = "Failed to load content.";
  }

  exitEditMode();
  document.getElementById("panel-overlay").classList.add("open");
  document.body.classList.add("panel-open");
}

function closePanel() {
  editMode = false;
  document.getElementById("panel-overlay").classList.remove("open");
  document.body.classList.remove("panel-open");
  selectedFile = null;
  render();
}

function enterEditMode() {
  editMode = true;
  const editor = document.getElementById("panel-editor");
  const content = document.getElementById("panel-content");
  const actions = document.getElementById("panel-edit-actions");
  const btn = document.getElementById("panel-edit-btn");

  editor.value = originalBody;
  content.style.display = "none";
  editor.style.display = "block";
  actions.style.display = "flex";
  btn.textContent = "Editing";
  editor.focus();
}

function exitEditMode() {
  editMode = false;
  const editor = document.getElementById("panel-editor");
  const content = document.getElementById("panel-content");
  const actions = document.getElementById("panel-edit-actions");
  const btn = document.getElementById("panel-edit-btn");

  editor.style.display = "none";
  actions.style.display = "none";
  content.style.display = "block";
  btn.textContent = "Edit";
}

const CHECKBOX_LINE_RE = /^\s*[-*+]\s+\[([ xX])\]\s/;

function checkboxLineIndices(body) {
  const indices = [];
  const lines = body.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (CHECKBOX_LINE_RE.test(lines[i])) indices.push(i);
  }
  return indices;
}

function renderBody(content, body) {
  if (!body) {
    content.className = "panel-body-empty";
    content.textContent = "No notes.";
    return;
  }
  content.className = "panel-body-content";
  content.innerHTML = marked.parse(body);

  const lineIndices = checkboxLineIndices(body);
  const inputs = content.querySelectorAll('input[type="checkbox"]');
  inputs.forEach((input, i) => {
    const lineIndex = lineIndices[i];
    if (lineIndex === undefined) return;
    input.disabled = false;
    input.style.cursor = "pointer";
    input.addEventListener("change", () => toggleCheckbox(input, lineIndex));
  });
}

async function toggleCheckbox(input, lineIndex) {
  const file = selectedFile;
  const expected = !input.checked;
  const checked = input.checked;
  input.disabled = true;
  try {
    const res = await fetch("/api/checkbox", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file, line: lineIndex, expected, checked }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      input.checked = expected;
      toast("Error: " + (data.error || "Toggle failed"));
      return;
    }
    const lines = originalBody.split('\n');
    lines[lineIndex] = lines[lineIndex].replace(/\[[ xX]\]/, checked ? '[x]' : '[ ]');
    originalBody = lines.join('\n');
  } catch {
    input.checked = expected;
    toast("Toggle failed");
  } finally {
    input.disabled = false;
  }
}

async function saveBody() {
  const editor = document.getElementById("panel-editor");
  const body = editor.value;

  try {
    const res = await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: selectedFile, body }),
    });
    const data = await res.json();
    if (!res.ok) {
      toast("Error: " + (data.error || "Save failed"));
      return;
    }
    originalBody = body;
    renderBody(document.getElementById("panel-content"), originalBody);
    exitEditMode();
    toast("Saved");
  } catch {
    toast("Save failed");
  }
}

document.getElementById("panel-edit-btn").addEventListener("click", () => {
  if (editMode) exitEditMode();
  else enterEditMode();
});
document.getElementById("panel-save-btn").addEventListener("click", saveBody);
document.getElementById("panel-cancel-btn").addEventListener("click", exitEditMode);

document.getElementById("panel-editor").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    saveBody();
  }
  if (e.key === "Escape") {
    e.stopPropagation();
    exitEditMode();
  }
});

document.getElementById("panel-backdrop").addEventListener("click", closePanel);
document.getElementById("panel-close").addEventListener("click", closePanel);
document.addEventListener("keydown", e => {

});

// --- Drag-and-drop helpers ---

function getDropIndex(body, y) {
  const cards = [...body.querySelectorAll(".card")];
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (y < mid) return i;
  }
  return cards.length;
}

function clearIndicators(body) {
  body.querySelectorAll(".drop-indicator").forEach(el => el.remove());
}

function showIndicator(body, index) {
  clearIndicators(body);
  const indicator = document.createElement("div");
  indicator.className = "drop-indicator";
  const cards = [...body.querySelectorAll(".card")];
  if (index < cards.length) {
    body.insertBefore(indicator, cards[index]);
  } else {
    body.appendChild(indicator);
  }
}

function getColumnItems(status) {
  const items = projects
    .filter(p => p.status === status)
    .filter(p => !activeTrack || p.track === activeTrack);
  items.sort((a, b) => b.priority - a.priority);
  return items;
}

const TERMINAL_STATUSES = new Set(["done", "dropped"]);

function isOpenProject(project) {
  return !TERMINAL_STATUSES.has(project.status);
}

function computePriority(items, dropIndex, draggedFile) {
  const originalIndex = items.findIndex(p => p.file === draggedFile);
  const adjustedIndex = originalIndex !== -1 && originalIndex < dropIndex ? dropIndex - 1 : dropIndex;
  // Remove the dragged card from the list after adjusting the DOM-based drop index.
  const others = items.filter(p => p.file !== draggedFile);
  // above = card that will be above the drop position (higher priority)
  const above = others[adjustedIndex - 1];
  // below = card that will be below the drop position (lower priority)
  const below = others[adjustedIndex];

  if (above && below) {
    return (above.priority + below.priority) / 2;
  }
  if (above) return above.priority - 10;
  if (below) return below.priority + 10;
  return 50; // empty column
}

async function handleDrop(targetStatus, dropIndex) {
  if (!dragFile) return;

  const sameColumn = dragSourceStatus === targetStatus;
  const payload = { file: dragFile, to_status: targetStatus };

  if (sameColumn) {
    // Reorder: compute new priority based on neighbors
    const items = getColumnItems(targetStatus);
    payload.priority = computePriority(items, dropIndex, dragFile);
  }
  // Cross-column: keep existing priority, just change status

  const res = await fetch("/api/move", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });

  if (!res.ok) {
    const data = await res.json();
    toast("Error: " + (data.error || "Unknown"));
    return;
  }

  if (!sameColumn) toast("Moved to " + targetStatus);
  fetchProjects();
}

// --- New project / track ---

function slugify(s) {
  let out = "";
  let prevDash = true;
  // NFKD-decompose and drop combining marks so "Café" -> "cafe" (matches server).
  const folded = (s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  for (const ch of folded) {
    const lower = ch.toLowerCase();
    if (/[a-z0-9]/.test(lower)) {
      out += lower;
      prevDash = false;
    } else if (!prevDash) {
      out += "-";
      prevDash = true;
    }
  }
  return out.replace(/-+$/, "");
}

async function createProject(payload) {
  const res = await fetch("/api/projects", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  let data = {};
  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) {
    const err = new Error(data.error || `Create failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function createTrack(name) {
  const res = await fetch("/api/tracks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  let data = {};
  try { data = await res.json(); } catch { /* ignore */ }
  if (!res.ok) {
    throw new Error(data.error || `Create track failed (${res.status})`);
  }
  return data;
}

function showQuickAdd(columnBody, status) {
  // If a form is already open in this column, focus it instead of stacking.
  const existing = columnBody.querySelector(".quickadd-form");
  if (existing) {
    existing.querySelector(".quickadd-title")?.focus();
    return;
  }

  const form = document.createElement("div");
  form.className = "quickadd-form";
  form.innerHTML = `
    <div class="quickadd-row">
      <input class="quickadd-owner" placeholder="owner" value="${esc(defaultOwner)}" list="owner-options" autocomplete="off">
      <input class="quickadd-title" placeholder="Project title">
    </div>
    <div class="quickadd-preview"></div>
    <div class="quickadd-actions">
      <button data-action="cancel">Cancel</button>
      <button data-action="submit" class="primary">Create</button>
    </div>
  `;
  columnBody.appendChild(form);

  const ownerInput = form.querySelector(".quickadd-owner");
  const titleInput = form.querySelector(".quickadd-title");
  const preview = form.querySelector(".quickadd-preview");
  const cancelBtn = form.querySelector('[data-action="cancel"]');
  const submitBtn = form.querySelector('[data-action="submit"]');

  function updatePreview() {
    const o = ownerInput.value.trim() || defaultOwner;
    const s = slugify(titleInput.value);
    preview.textContent = s ? `→ ${o}-${s}.md` : "";
  }

  ownerInput.addEventListener("input", updatePreview);
  titleInput.addEventListener("input", updatePreview);

  function close() { form.remove(); }
  cancelBtn.addEventListener("click", close);

  async function submit() {
    const title = titleInput.value.trim();
    if (!title) { titleInput.focus(); return; }
    const owner = ownerInput.value.trim() || defaultOwner;
    submitBtn.disabled = true;
    try {
      const data = await createProject({
        track: activeTrack,
        title,
        owner,
        status,
      });
      pendingOpenFile = data.file;
      close();
      await fetchProjects();
    } catch (err) {
      toast("Error: " + err.message);
      submitBtn.disabled = false;
    }
  }
  submitBtn.addEventListener("click", submit);
  form.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    if (e.key === "Escape") { e.preventDefault(); close(); }
  });

  titleInput.focus();
}

function populateModal(initialStatus) {

    const opt = document.createElement("option");
    opt.value = t;

    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    statusSel.appendChild(opt);

}

async function submitModal() {
  const errorEl = document.getElementById("np-error");
  errorEl.textContent = "";
  const submitBtn = document.getElementById("np-submit");

  let track = document.getElementById("np-track").value;
  const isNewTrack = track === "__new__";
  if (isNewTrack) {
    track = document.getElementById("np-new-track").value.trim();
    if (!track) { errorEl.textContent = "Track name required"; return; }
  }
  const title = document.getElementById("np-title").value.trim();
  if (!title) { errorEl.textContent = "Title required"; return; }
  const owner = document.getElementById("np-owner").value.trim() || defaultOwner;
  const slug = document.getElementById("np-slug").value.trim();
  const status = document.getElementById("np-status").value;
  const priorityRaw = document.getElementById("np-priority").value;
  const deadline = document.getElementById("np-deadline").value.trim();
  const myNext = document.getElementById("np-my-next").value.trim();

  const payload = { track, title, owner, status };
  if (slug) payload.slug = slug;
  if (priorityRaw !== "") {
    const n = Number(priorityRaw);
    if (Number.isFinite(n)) payload.priority = n;
  }
  if (deadline) payload.deadline = deadline;
  if (myNext) payload.my_next = myNext;
  if (isNewTrack) payload.create_track = true;

  submitBtn.disabled = true;
  try {
    const data = await createProject(payload);
    pendingOpenFile = data.file;
    closeModal();
    await fetchProjects();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
}

document.getElementById("new-project-btn").addEventListener("click", () => openModal(null));
document.getElementById("board-view-btn").addEventListener("click", () => setView("board"));
document.getElementById("timeline-view-btn").addEventListener("click", () => setView("timeline"));
document.getElementById("mini-timeline").addEventListener("click", () => setView("timeline"));
document.querySelectorAll("[data-modal-close]").forEach(el => {
  el.addEventListener("click", closeModal);
});
document.getElementById("np-submit").addEventListener("click", submitModal);
document.getElementById("np-track").addEventListener("change", e => {
  document.getElementById("np-new-track-row").style.display = e.target.value === "__new__" ? "" : "none";
});
["np-owner", "np-title", "np-slug"].forEach(id => {
  document.getElementById(id).addEventListener("input", updateModalPreview);
});
document.getElementById("new-project-modal").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
    submitModal();
  }
  if (e.key === "Escape") {
    e.preventDefault();
    closeModal();
  }
});

// --- Render ---

function render() {
  renderFilters();

  const board = document.getElementById("board");
  board.innerHTML = "";

  const visible = activeTrack ? projects.filter(p => p.track === activeTrack) : projects;
  const nonTerminal = visible.filter(isOpenProject);
  const label = activeTrack ? activeTrack : "active";
  document.getElementById("total-count").textContent = nonTerminal.length + " " + label;

  for (const status of statuses) {
    const rendered = getColumnItems(status);

    const col = document.createElement("div");
    col.className = "column";
    col.dataset.status = status;

    col.innerHTML = `
      <div class="column-header">
        <span class="dot"></span>
        ${status}
        <span class="badge">${rendered.length}</span>
      </div>
    `;

    const body = document.createElement("div");
    body.className = "column-body";
    body.dataset.status = status;

    body.addEventListener("dragover", e => {
      e.preventDefault();
      if (dragSourceStatus === status) {
        // Same column: show precise drop indicator
        clearIndicators(body);
        body.classList.remove("drag-over");
        const idx = getDropIndex(body, e.clientY);
        showIndicator(body, idx);
      } else {
        // Cross column: highlight whole column
        clearIndicators(body);
        body.classList.add("drag-over");
      }
    });

    body.addEventListener("dragleave", e => {
      if (!body.contains(e.relatedTarget)) {
        clearIndicators(body);
        body.classList.remove("drag-over");
      }
    });

    body.addEventListener("drop", e => {
      e.preventDefault();
      clearIndicators(body);
      body.classList.remove("drag-over");
      const idx = getDropIndex(body, e.clientY);
      handleDrop(status, idx);
    });

    if (rendered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No projects";
      body.appendChild(empty);
    }

    for (const p of rendered) {
      const color = trackColorMap[p.track] || "#999";
      const dimmed = activeTrack && p.track !== activeTrack;

      const card = document.createElement("div");
      card.className = "card" + (dimmed ? " dimmed" : "") + (selectedFile === p.file ? " selected" : "");
      card.style.borderLeftColor = color;
      card.draggable = !dimmed;
      card.dataset.file = p.file;

      card.addEventListener("mousedown", () => { didDrag = false; });

      card.addEventListener("dragstart", e => {
        didDrag = true;
        dragFile = p.file;
        dragSourceStatus = p.status;
        e.dataTransfer.setData("text/plain", p.file);
        e.dataTransfer.effectAllowed = "move";
        requestAnimationFrame(() => card.classList.add("dragging"));
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        dragFile = null;
        dragSourceStatus = null;
        document.querySelectorAll(".drop-indicator").forEach(el => el.remove());
      });

      card.addEventListener("click", () => {
        if (!didDrag) openPanel(p.file);
      });

      let meta = "";
      if (p.my_next && p.my_next !== "(fill in)") {
        meta += `<span>\u2192 ${esc(p.my_next)}</span>`;
      }
      if (p.waiting_on) {
        const days = p.waiting_since ? daysSince(p.waiting_since) : null;
        const dayStr = days !== null ? ` (${days}d)` : "";
        meta += `<span>Waiting on ${esc(p.waiting_on)}${dayStr}</span>`;
      }
      if (p.deadline) {
        meta += `<span class="deadline">Due ${esc(p.deadline)}</span>`;
      }
      if (p.deferred_until) {
        meta += `<span>Deferred until ${esc(p.deferred_until)}</span>`;
      }

      card.innerHTML = `
        <div class="card-track" style="color:${color}">${esc(p.track)}</div>
        <div class="card-title">${esc(p.title)}</div>
        ${meta ? `<div class="card-meta">${meta}</div>` : ""}
      `;

      body.appendChild(card);
    }

    if (!TERMINAL_STATUSES.has(status)) {
      const addBtn = document.createElement("button");
      addBtn.className = "column-add";
      addBtn.textContent = "+ New";
      addBtn.addEventListener("click", () => {
        if (activeTrack) {
          showQuickAdd(body, status);
        } else {
          openModal(status);
        }
      });
      body.appendChild(addBtn);
    }

    col.appendChild(body);
    board.appendChild(col);
  }

  if (activeView === "timeline" && timelineData) renderTimeline();
  if (timelineData) renderMiniTimeline();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2000);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function parseLocalDate(dateStr) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!match) return new Date(dateStr);
  const [, year, month, day] = match;
  return new Date(Number(year), Number(month) - 1, Number(day));
}

function startOfLocalDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function daysSince(dateStr) {
  const d = parseLocalDate(dateStr);
  if (Number.isNaN(d.getTime())) return null;
  const today = startOfLocalDay(new Date());
  const days = Math.floor((today - d) / 86400000);
  return days >= 0 ? days : null;
}

// SSE live reload
function connectSSE() {
  const es = new EventSource("/api/events");
  es.onmessage = () => fetchProjects();
  es.onerror = () => {
    es.close();
    setTimeout(connectSSE, 3000);
  };
}

fetchProjects();
connectSSE();
</script>
