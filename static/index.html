<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #fff;
    --border: #e5e5e5;
    --text: #1a1a1a;
    --text-secondary: #666;
    --text-tertiary: #999;
    --accent: #2563eb;
    --col-active: #059669;
    --col-waiting: #d97706;
    --col-submitted: #7c3aed;
    --col-done: #10b981;
    --col-dropped: #ef4444;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: 0 0 auto;
    padding: 20px 28px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .app-workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(340px, 32vw, 460px);
    overflow: hidden;
  }

  .main-workspace {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .header-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    min-height: 43px;
    margin-bottom: 14px;
  }

  .app-home {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    cursor: pointer;
  }

  .app-home:hover {
    color: var(--accent);
  }

  .track-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    min-height: 29px;
    padding-bottom: 0;
  }

  .track-filter {
    position: relative;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-tertiary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
    margin-bottom: -1px;
  }

  .track-filter:hover {
    color: var(--text-secondary);
  }

  .track-filter.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .track-filter .filter-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
    position: relative;
    top: -0.5px;
  }

  .track-filter .filter-count {
    color: var(--text-tertiary);
    font-weight: 400;
    margin-left: 3px;
    font-size: 11px;
  }

  .mini-timeline {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 8px;
    cursor: pointer;
    overflow: hidden;
  }

  .mini-pulse-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }

  .mini-pulse-group + .mini-pulse-group {
    padding-left: 8px;
    border-left: 1px solid var(--border);
  }

  .mini-pulse-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .mini-pulse {
    width: 58px;
    height: 30px;
    padding: 2px 3px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
  }

  .mini-timeline-empty {
    width: 216px;
    height: 28px;
    color: var(--text-tertiary);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mini-column {
    flex: 0 0 2px;
    width: 2px;
    height: 100%;
    display: flex;
    align-items: flex-end;
  }

  .mini-stack {
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    gap: 0;
    overflow: hidden;
  }

  .mini-dot,
  .mini-segment {
    width: 2px;
    height: var(--mini-dot-height, 1px);
    min-height: 1px;
  }

  .mini-segment {
    height: var(--mini-segment-height, 1px);
  }

  .board {
    display: flex;
    gap: 12px;
    padding: 20px 28px;
    overflow-x: auto;
    height: 100%;
    min-height: 0;
    align-items: stretch;
  }

  .board.hidden,
  .tasks-view.hidden,
  .timeline-view.hidden,
  .routines-view.hidden {
    display: none;
  }

  .search-box {
    flex: 1 1 160px;
    min-width: 120px;
    max-width: 240px;
    height: 26px;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }

  .search-box:focus {
    border-color: var(--accent);
  }

  .search-box::placeholder {
    color: var(--text-tertiary);
  }

  .view-switch {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    background: var(--surface);
  }

  .view-toggle {
    height: 26px;
    padding: 0 10px;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  .view-toggle:last-child {
    border-right: none;
  }

  .view-toggle:hover {
    background: var(--bg);
    color: var(--text);
  }

  .view-toggle.active {
    background: var(--text);
    color: #fff;
  }

  .timeline-view {
    padding: 20px 28px 28px;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
  }

  .tasks-view,
  .routines-view {
    height: 100%;
    overflow-y: auto;
    padding: 22px 28px 48px;
  }

  .task-row.dragging {
    opacity: 0.35;
  }

  .task-row {
    grid-template-columns: 26px minmax(0, 1fr) 44px auto auto;
  }

  .task-row.drop-before {
    box-shadow: 0 -3px 0 var(--accent);
  }

  .task-row.drop-after {
    box-shadow: 0 3px 0 var(--accent);
  }

  .task-priority {
    min-width: 44px;
    color: var(--text-tertiary);
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 10px;
    text-align: right;
  }

  .routine-group {
    margin-bottom: 20px;
  }

  .routine-group.empty {
    margin-bottom: 12px;
  }

  .routine-group-title {
    margin: 0 0 6px 38px;
    color: var(--text-tertiary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .routine-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .routine-row {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 6px 9px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }

  .routine-row:hover {
    border-color: #ccc;
  }

  .routine-row.upcoming,
  .routine-row.deferred {
    opacity: 0.22;
    box-shadow: none;
  }

  .routine-row.upcoming:hover,
  .routine-row.deferred:hover {
    opacity: 0.45;
  }

  .routine-complete {
    width: 23px;
    height: 23px;
    border: 1px solid #b8b8b8;
    border-radius: 50%;
    background: var(--surface);
    color: var(--col-active);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .routine-complete:hover {
    border-color: var(--col-active);
    background: #ecfdf5;
  }

  .routine-title {
    font-size: 13px;
    font-weight: 500;
  }

  .routine-summary {
    color: var(--text-tertiary);
    font-size: 10px;
  }

  .routine-date {
    color: var(--text-secondary);
    font-size: 11px;
    white-space: nowrap;
  }

  .routine-row.overdue .routine-date {
    color: var(--col-dropped);
    font-weight: 600;
  }

  .routine-row.due .routine-date {
    color: var(--col-waiting);
    font-weight: 600;
  }

  .routine-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .routine-action {
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-tertiary);
    padding: 3px 5px;
    font: inherit;
    font-size: 10px;
    cursor: pointer;
  }

  .routine-action:hover {
    background: var(--bg);
    color: var(--text-secondary);
  }

  .timeline-toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }

  .timeline-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .timeline-note {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .timeline-scroller {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .timeline-plot {
    display: flex;
    align-items: stretch;
  }

  .timeline-y-axis {
    flex: 0 0 44px;
    padding: 14px 8px 14px 12px;
    display: grid;
    grid-template-rows: 1fr 1px 72px;
    color: var(--text-tertiary);
    font-size: 11px;
    text-align: right;
  }

  .timeline-y-load,
  .timeline-y-outflow {
    position: relative;
  }

  .timeline-y-label {
    position: absolute;
    right: 0;
    transform: translateY(50%);
    line-height: 1;
  }

  .timeline-y-label.top { top: 0; transform: translateY(-10%); }
  .timeline-y-label.mid { top: 50%; }
  .timeline-y-label.zero { top: 0; transform: translateY(-50%); }
  .timeline-y-label.bottom { bottom: 0; transform: translateY(50%); }

  .timeline-chart {
    flex: 1;
    height: 430px;
    padding: 14px 14px 14px 0;
    display: flex;
    align-items: stretch;
    gap: 1px;
  }

  .timeline-column {
    flex: 0 0 5px;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr 1px 72px;
  }

  .timeline-load-stack {
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    gap: var(--timeline-gap, 1px);
    align-self: end;
  }

  .timeline-zero-line {
    background: var(--border);
  }

  .timeline-outflow-stack {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 1px;
  }

  .timeline-cell,
  .timeline-outflow-cell {
    width: 5px;
    border-radius: 1px;
    min-height: 1px;
  }

  .timeline-cell {
    height: var(--timeline-cell-height, 4px);
  }

  .timeline-outflow-cell {
    height: var(--timeline-outflow-cell-height, 6px);
  }

  .timeline-axis {
    height: 34px;
    padding: 0 14px 10px 44px;
    border-top: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .timeline-axis-track {
    position: relative;
    height: 100%;
    width: max-content;
  }

  .timeline-axis-day {
    position: absolute;
    top: 0;
    width: 1px;
    height: 3px;
    background: var(--border);
    transform: translateX(-50%);
  }

  .timeline-axis-tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .timeline-axis-tick.first {
    transform: translateX(0);
    align-items: flex-start;
  }

  .timeline-axis-tick.last {
    transform: translateX(-100%);
    align-items: flex-end;
  }

  .timeline-axis-mark {
    width: 1px;
    height: 6px;
    background: var(--border);
  }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 12px;
    color: var(--text-secondary);
    font-size: 12px;
  }

  .timeline-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .timeline-legend-swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .analysis-pulses {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  .analysis-pulse-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    padding: 10px 12px 12px;
  }

  .analysis-pulse-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .analysis-pulse-body {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    grid-template-rows: 96px 18px;
    gap: 3px 8px;
  }

  .analysis-pulse-y-axis {
    grid-row: 1;
    color: var(--text-tertiary);
    font-size: 10px;
    line-height: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    padding: 2px 0 0;
    font-variant-numeric: tabular-nums;
  }

  .analysis-pulse {
    grid-column: 2;
    height: 96px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow: hidden;
    padding-top: 2px;
  }

  .analysis-pulse .mini-column {
    flex: 1 1 4px;
    min-width: 3px;
  }

  .analysis-pulse-x-axis {
    grid-column: 2;
    border-top: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 10px;
    line-height: 1;
    display: flex;
    justify-content: space-between;
    padding-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  .column {
    flex: 0 0 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
  }

  .column-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }

  .column-header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .column-header .badge {
    font-weight: 500;
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .column[data-status="active"] .dot { background: var(--col-active, #6b7280); }
  .column[data-status="waiting"] .dot { background: var(--col-waiting, #6b7280); }
  .column[data-status="submitted"] .dot { background: var(--col-submitted, #6b7280); }
  .column[data-status="done"] .dot { background: var(--col-done, #6b7280); }
  .column[data-status="dropped"] .dot { background: var(--col-dropped, #6b7280); }

  .column-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 60px;
    flex: 1;
    padding: 4px;
    border-radius: var(--radius);
    transition: background 0.15s;
  }

  .column-body.drag-over {
    background: rgba(37, 99, 235, 0.1);
    outline: 2px dashed rgba(37, 99, 235, 0.3);
    outline-offset: -2px;
    border-radius: var(--radius);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: grab;
    transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    box-shadow: var(--shadow);
    border-left: 3px solid var(--border);
  }

  .card:hover {
    border-color: #ccc;
  }

  .column[data-status="done"] .column-header {
    color: var(--text-tertiary);
  }

  .column[data-status="done"] .column-header .dot {
    background: #a3a3a3;
  }

  .column[data-status="done"] .column-body {
    background: rgba(0, 0, 0, 0.018);
  }

  .column[data-status="done"] .column-body.drag-over {
    background: rgba(37, 99, 235, 0.1);
  }

  .column[data-status="done"] .card {
    background: #f7f7f7;
    box-shadow: none;
    filter: saturate(0.45);
    opacity: 0.72;
  }

  .column[data-status="done"] .card:hover,
  .column[data-status="done"] .card.selected,
  .column[data-status="done"] .card:focus-within {
    background: var(--surface);
    filter: none;
    opacity: 1;
  }

  .column[data-status="done"] .card.dragging {
    opacity: 0.4;
  }

  .card.dragging {
    opacity: 0.4;
  }

  .card.dimmed {
    opacity: 0.15;
    pointer-events: none;
  }

  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  body.panel-open .card:not(.selected) {
    opacity: 0.35;
    transition: opacity 0.2s;
  }

  body.panel-open .card.selected {
    box-shadow: 0 0 0 1px var(--accent), 0 2px 12px rgba(37, 99, 235, 0.15);
  }

  .drop-indicator {
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
    margin: -1px 4px;
    pointer-events: none;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .card-track {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .card-meta {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 6px;
    line-height: 1.5;
  }

  .card-meta span {
    display: block;
  }

  .card-meta .deadline {
    color: var(--col-waiting);
    font-weight: 500;
  }

  .card-meta .submitted {
    color: var(--col-submitted);
    font-weight: 600;
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
    gap: 2px;
    margin-top: 7px;
  }

  .card-defer-wrap {
    position: relative;
    display: flex;
  }

  .card-defer {
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    border-radius: 4px;
    padding: 2px 5px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }

  .card-defer:hover {
    background: var(--bg);
    color: var(--text-secondary);
  }

  .card-defer-menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 2px);
    z-index: 20;
    width: 210px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    cursor: default;
  }

  .card-defer-wrap.open .card-defer-menu {
    display: block;
  }

  .card-defer-presets {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px;
  }

  .card-defer-menu button {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 4px;
    padding: 6px 7px;
    font: inherit;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
  }

  .card-defer-menu button:hover {
    background: var(--bg);
    color: var(--text);
  }

  .card-defer-custom {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px;
    margin-top: 5px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .card-defer-custom input {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 5px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 10px;
  }

  .card-defer-custom button {
    border: 1px solid var(--border);
    padding: 4px 7px;
  }

  .card-move-menu {
    width: 130px;
  }

  .card-status {
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 2px 6px;
    font-weight: 600;
    white-space: nowrap;
  }

  .card-status:hover {
    border-color: #ccc;
  }

  .card-move-options {
    display: flex;
    flex-direction: column;
  }

  .card-move-options button[disabled] {
    color: var(--text-tertiary);
    opacity: 0.55;
    cursor: default;
  }

  .card-move-options button[disabled]:hover {
    background: transparent;
  }

  /* --- Project workspace --- */

  .panel-overlay {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 30;
    background: var(--surface);
  }

  .panel-overlay.open {
    display: block;
  }

  .panel-backdrop {
    display: none;
  }

  .panel {
    position: absolute;
    inset: 0;
    width: 100%;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 20px 20px 0;
    gap: 12px;
  }

  .panel-heading {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .panel-header h2 {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .panel-close {
    flex-shrink: 0;
    height: 30px;
    padding: 0 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #bfdbfe;
    background: #eff6ff;
    color: #1d4ed8;
    cursor: pointer;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }

  .panel-close:hover {
    border-color: #93c5fd;
    background: #dbeafe;
    color: #1e40af;
  }

  .panel-fields {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
  }

  .panel-next-action {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .panel-next-action-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-next-action-copy {
    min-width: 0;
    flex: 1;
  }

  .panel-next-action-text {
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    word-wrap: break-word;
  }

  .panel-next-action-text.empty {
    color: var(--text-tertiary);
    font-weight: 400;
  }

  .panel-next-action input {
    width: 100%;
    height: 32px;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    outline: none;
  }

  .panel-next-action input:focus {
    border-color: var(--accent);
  }

  .panel-next-action-buttons {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .panel-next-action button {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-secondary);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .panel-next-action button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .panel-next-action button:disabled {
    cursor: default;
    opacity: 0.45;
  }

  .panel-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 20px 0;
    border-bottom: 1px solid var(--border);
  }

  .panel-tab {
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--text-tertiary);
    padding: 6px 10px 7px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .panel-tab:hover {
    color: var(--text-secondary);
  }

  .panel-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .panel-field {
    min-width: 100px;
  }

  .panel-field.wide {
    flex: 1 1 280px;
  }

  .panel-field-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
    margin-bottom: 2px;
  }

  .panel-field-value {
    font-size: 13px;
    color: var(--text);
  }

  .panel-fields.editing {
    align-items: flex-end;
  }

  .panel-field-edit {
    flex: 1 1 160px;
    min-width: 130px;
  }

  .panel-field-edit.wide {
    flex-basis: 280px;
  }

  .panel-field-edit input,
  .panel-field-edit select {
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    outline: none;
  }

  .panel-field-edit input:focus,
  .panel-field-edit select:focus {
    border-color: var(--accent);
  }

  .metadata-actions {
    flex: 1 0 100%;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 2px;
  }

  .metadata-actions button {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-secondary);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .metadata-actions button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .panel-body-content {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
    word-wrap: break-word;
  }

  .panel-body-content h1,
  .panel-body-content h2,
  .panel-body-content h3 {
    color: var(--text);
    margin: 16px 0 6px;
    line-height: 1.3;
  }

  .panel-body-content h1 { font-size: 16px; }
  .panel-body-content h2 { font-size: 14px; }
  .panel-body-content h3 { font-size: 13px; }

  .panel-body-content p { margin: 0 0 10px; }

  .panel-body-content ul,
  .panel-body-content ol {
    margin: 0 0 10px;
    padding-left: 20px;
  }

  .panel-body-content li { margin-bottom: 3px; }

  .panel-body-content code {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 12px;
    background: var(--bg);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .panel-body-content pre {
    background: var(--bg);
    padding: 10px;
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 0 0 10px;
  }

  .panel-body-content pre code {
    background: none;
    padding: 0;
  }

  .panel-body-content a {
    color: var(--accent);
    text-decoration: none;
  }

  .panel-body-content a:hover { text-decoration: underline; }

  .panel-body-content blockquote {
    border-left: 3px solid var(--border);
    padding-left: 12px;
    color: var(--text-tertiary);
    margin: 0 0 10px;
  }

  .panel-body-empty {
    font-size: 13px;
    color: var(--text-tertiary);
    font-style: italic;
  }

  .panel-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .panel-btn {
    height: 28px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .panel-btn:hover {
    background: var(--bg);
    color: var(--text);
  }

  .panel-btn.panel-primary-action {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-weight: 600;
  }

  .panel-btn.panel-primary-action:hover {
    border-color: #cbd5e1;
    background: var(--bg);
    color: var(--text);
  }

  .panel-actions .card-defer-menu {
    top: calc(100% + 4px);
  }

  .panel-more-menu {
    width: 150px;
  }

  .panel-more-menu a {
    display: block;
    color: var(--text-secondary);
    border-radius: 4px;
    padding: 6px 7px;
    font-size: 11px;
    text-decoration: none;
  }

  .panel-more-menu a:hover {
    background: var(--bg);
    color: var(--text);
  }

  #panel-editor {
    display: none;
    width: 100%;
    flex: 1;
    min-height: 200px;
    resize: none;
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    color: var(--text);
    background: var(--surface);
    outline: none;
  }

  #panel-editor:focus {
    border-color: var(--accent);
  }

  .panel-edit-actions {
    display: none;
    gap: 8px;
    justify-content: flex-end;
    padding-top: 8px;
  }

  .panel-edit-actions button {
    height: 28px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .panel-edit-actions button:hover {
    background: var(--bg);
  }

  .panel-edit-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .panel-edit-actions button.primary:hover {
    opacity: 0.9;
  }

  .agent-workspace {
    min-width: 0;
    min-height: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .agent-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 50px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  .agent-title {
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
  }

  .agent-title-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .agent-running-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
  }

  .agent-running-indicator[hidden] {
    display: none;
  }

  .agent-spinner {
    width: 12px;
    height: 12px;
    box-sizing: border-box;
    border: 2px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: agent-spin 0.75s linear infinite;
  }

  .agent-clear {
    border: 0;
    background: transparent;
    color: var(--text-tertiary);
    padding: 4px 5px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }

  .agent-clear:hover:not(:disabled) {
    color: var(--text);
  }

  .agent-clear:disabled {
    cursor: default;
    opacity: 0.4;
  }

  .agent-view {
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .panel-body.hidden {
    display: none;
  }

  .agent-status {
    min-height: 30px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    color: var(--text-tertiary);
    font-size: 11px;
  }

  .agent-status strong {
    color: var(--text-secondary);
    font-weight: 600;
  }

  .agent-activity {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .agent-elapsed {
    min-width: 24px;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  @keyframes agent-spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .agent-spinner { animation-duration: 1.8s; }
  }

  .agent-settings {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(88px, 0.55fr);
    gap: 8px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }

  .agent-settings label {
    min-width: 0;
  }

  .agent-settings select {
    width: 100%;
    height: 28px;
    padding: 0 24px 0 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-secondary);
    font: inherit;
    font-size: 11px;
  }

  .agent-settings select:disabled {
    opacity: 0.5;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .agent-transcript {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .agent-empty {
    margin: auto 0;
    color: var(--text-tertiary);
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
  }

  .agent-message {
    max-width: 92%;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.55;
    word-wrap: break-word;
  }

  .agent-message.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    white-space: pre-wrap;
  }

  .agent-message.user.queued {
    border: 1px dashed color-mix(in srgb, var(--accent) 70%, var(--border));
    background: color-mix(in srgb, var(--accent) 72%, var(--surface));
  }

  .agent-queued-label {
    display: block;
    margin-bottom: 3px;
    color: color-mix(in srgb, #fff 78%, transparent);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .agent-message.agent {
    align-self: flex-start;
    background: var(--bg);
    color: var(--text);
  }

  .agent-message.agent p {
    margin-bottom: 8px;
  }

  .agent-message.agent p:last-child {
    margin-bottom: 0;
  }

  .agent-message.agent ul,
  .agent-message.agent ol {
    margin: 0 0 8px;
    padding-left: 18px;
  }

  .agent-notice {
    color: var(--text-tertiary);
    font-size: 11px;
    text-align: center;
  }

  .agent-composer {
    border-top: 1px solid var(--border);
    padding: 10px 20px 12px;
  }

  .agent-composer textarea {
    display: block;
    width: 100%;
    min-height: 66px;
    max-height: 150px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    padding: 8px 9px;
    font: inherit;
    font-size: 12px;
    line-height: 1.5;
    outline: none;
  }

  .agent-composer textarea:focus {
    border-color: var(--accent);
  }

  .agent-composer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }

  .agent-composer-hint {
    color: var(--text-tertiary);
    font-size: 10px;
  }

  .agent-composer-buttons {
    display: flex;
    gap: 6px;
  }

  .agent-composer button {
    height: 27px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-secondary);
    padding: 0 9px;
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .agent-composer button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .agent-composer button:disabled {
    cursor: default;
    opacity: 0.45;
  }

  @media (max-width: 900px) {
    .app-workspace {
      grid-template-columns: minmax(0, 1fr) 320px;
    }

    .board,
    .tasks-view,
    .timeline-view,
    .routines-view {
      padding-left: 16px;
      padding-right: 16px;
    }

    .agent-composer-hint {
      display: none;
    }
  }

  .panel-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "SF Mono", "Menlo", monospace;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--text);
    color: #fff;
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show { opacity: 1; }

  .empty-state {
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 16px 4px;
    text-align: center;
    font-style: italic;
  }

  /* --- New project / track UI --- */

  .header-action {
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  @media (max-width: 1200px) {
    header {
      padding-left: 16px;
      padding-right: 16px;
    }

    .mini-timeline {
      display: none;
    }

    .view-switch {
      margin-left: 0;
    }

    .track-filters {
      flex-wrap: nowrap;
      overflow-x: auto;
    }
  }

  @media (max-width: 700px) {
    .header-top {
      gap: 8px;
      margin-bottom: 8px;
    }

    .search-box {
      order: 5;
      flex-basis: calc(100% - 170px);
      max-width: none;
    }

    .view-switch {
      order: 6;
    }
  }

  .header-action:hover {
    background: var(--bg);
    color: var(--text);
    border-color: #ccc;
  }

  .header-action:disabled {
    opacity: 0.42;
    cursor: default;
    background: var(--surface);
    color: var(--text-tertiary);
    border-color: var(--border);
  }

  .column-add {
    margin-top: 4px;
    width: 100%;
    padding: 6px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-tertiary);
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
  }

  .column-add:hover {
    background: var(--surface);
    color: var(--text-secondary);
    border-color: #ccc;
  }

  .quickadd-form {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }

  .quickadd-form input {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }

  .quickadd-form input:focus {
    border-color: var(--accent);
  }

  .quickadd-row {
    display: flex;
    gap: 6px;
  }

  .quickadd-row .quickadd-owner {
    flex: 0 0 30%;
  }

  .quickadd-row .quickadd-title {
    flex: 1;
  }

  .quickadd-preview {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: "SF Mono", "Menlo", monospace;
    min-height: 14px;
  }

  .quickadd-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
  }

  .quickadd-actions button {
    height: 24px;
    padding: 0 10px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .quickadd-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.18);
  }

  .modal {
    position: relative;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    width: 480px;
    max-width: calc(100vw - 32px);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal h2 {
    font-size: 15px;
    font-weight: 600;
  }

  .modal label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-tertiary);
  }

  .modal input,
  .modal select,
  .modal textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    background: var(--surface);
    text-transform: none;
    font-weight: 400;
    letter-spacing: normal;
    outline: none;
  }

  .modal input:focus,
  .modal select:focus,
  .modal textarea:focus {
    border-color: var(--accent);
  }

  .modal-row {
    display: flex;
    gap: 12px;
  }

  .modal-row label {
    flex: 1;
  }

  .modal details {
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .modal details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    user-select: none;
  }

</style>
